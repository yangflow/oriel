<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Oriel's product icon: a drop of ink on a warm ivory tile, on the macOS grid (824 tile at 100, radius 185), with
       the subscription sign cut out of it: two arcs open to the tile, and a teal dot. Drawn for Oriel and released under the project's MIT license.
       design/export-icon.sh renders it to resources/icon.png; design/tray.svg is the same mark for the menu bar. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#fdfcf9"/><stop offset=".55" stop-color="#f4f1ea"/><stop offset="1" stop-color="#e6e0d5"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".1" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".7" stop-color="#8a8070" stop-opacity="0"/><stop offset="1" stop-color="#8a8070" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="dot" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </radialGradient>
    <mask id="feed" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="6.5" stroke-linecap="round"><path d="M39 56a16 16 0 0 1 16 16"/><path d="M39 43a29 29 0 0 1 29 29"/></g>
    </mask>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3b2f1e" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#tile-shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#field)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- The mark is drawn on a 100 grid (as design/mark.svg and design/tray.svg are): the arcs and the dot share one
       center, with equal gaps. The drop's weight is in its round lower half, so its box sits a little above the tile's
       center. -->
  <g filter="url(#lift)" transform="translate(92 96) scale(8.4)">
    <path d="M50 10C50 10 23 41 23 61a27 27 0 0 0 54 0C77 41 50 10 50 10z" fill="#26231f" mask="url(#feed)"/>
    <circle cx="39" cy="72" r="6.25" fill="url(#dot)"/>
  </g>
</svg>
