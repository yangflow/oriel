<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example fixture</title>
<style>
:root { color-scheme: light; --background:#fafafa; --text:#242424; --muted:#666; --button:#eee; --border:#d6d6d6 }
:root[data-scheme=dark] { color-scheme:dark; --background:#202020; --text:#f3f3f3; --muted:#aaa; --button:#333; --border:#555 }
* { box-sizing:border-box }
body { margin:0; font-family:system-ui,sans-serif; color:var(--text); background:var(--background) }
main { width:100%; min-width:360px; height:320px; padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px }
h1 { font-size:24px; margin:0 }
output { font-size:48px; font-weight:700 }
nav { display:flex; gap:8px }
button { min-width:44px; padding:7px 12px; border:1px solid var(--border); border-radius:6px; background:var(--button); color:var(--text); font:inherit; font-size:13px }
button:last-child { background:#006fdf; color:white; border-color:#006fdf }
button:disabled { opacity:.45 }
p { margin:0; font-size:12px; color:var(--muted) }
</style>
<main><h1>Example</h1><output>0</output><nav><button aria-label="Decrement">−</button><button>Reset</button><button aria-label="Increment">+</button></nav><p>Use the arrow keys to count.</p></main>
<script>
const query=new URLSearchParams(location.search);
document.documentElement.dataset.scheme=query.get('scheme')==='dark'?'dark':'light';
let count={zero:0,positive:2,negative:-1}[query.get('state')] ?? 0;
const buttons=document.querySelectorAll('button');
function render(){document.querySelector('output').textContent=count;buttons[1].disabled=count===0}
buttons[0].onclick=()=>{count--;render()};buttons[1].onclick=()=>{count=0;render()};buttons[2].onclick=()=>{count++;render()};
onkeydown=e=>{if(e.key==='ArrowUp'){count++;render();e.preventDefault()}if(e.key==='ArrowDown'){count--;render();e.preventDefault()}};
render();
</script>
</html>
