<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader screen</title>
<!-- The reader: an article opened from the timeline takes the place of the list; the sidebar stays. It shows the
     extracted full text, or the feed's own content with a note when there is no full text. The back button, Escape
     and the sidebar return to the list where it was. Colors are the Oriel palette of design/tokens.md; icons are
     Lucide (ISC License). Pictures are drawn as gradients here; in the app they load in the background through the
     image proxy and show the Surface color, at their own aspect ratio when the page gives it, until then.
     States: full (extracted text), feed (no full text, the feed's content), extracting (full text not tried yet,
     the feed's content meanwhile), extracting-empty, failed (no full text and no feed content), loading, error.
     AI states: summarizing, summary, summary-failed, translating (the original stays readable), translation (the
     translated text, with a switch back to the original), translation-failed, ai-off (AI is not set up: the
     summary or translate button leads to Settings instead of failing). Summary and translation sit between
     previous/next and star in the toolbar; translation is plain text, so pictures and links are in the original.
     The bar above the window only switches the mockup.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min. -->
<style>
:root { color-scheme:light; --stage:#e7e5e4; --stage-text:#57534e }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0c0a09; --stage-text:#a8a29e }
:root { --background:#fbfaf7; --surface:#f2f0eb; --surface-hover:#e9e6df; --surface-pressed:#dfdbd2; --border:#dcd7cd; --text:#1f1d1a; --muted:#6f6a64; --accent:#0f766e; --accent-hover:#115e59; --accent-text:#ffffff; --accent-soft:#e3efeb; --danger:#c2410c; --danger-soft:#fbece4; --warning:#a16207; --warning-soft:#f8f0dc; --success:#15803d; --focus:rgba(15,118,110,.5); --star:#a16207 }
:root[data-scheme=dark] { --background:#1b1a18; --surface:#25231f; --surface-hover:#2f2c28; --surface-pressed:#3a3732; --border:#3d3933; --text:#ede9e3; --muted:#a8a29e; --accent:#2dd4bf; --accent-hover:#5eead4; --accent-text:#0b2522; --accent-soft:#1f3330; --danger:#fb923c; --danger-soft:#3a2418; --warning:#facc15; --warning-soft:#35301a; --success:#4ade80; --focus:rgba(45,212,191,.55); --star:#facc15 }
* { box-sizing:border-box }
body { margin:0; padding:24px; font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default }
button:focus-visible { outline:3px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

.window { position:relative; width:960px; height:640px; border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; background:var(--background) }
.window.min { width:640px; height:480px }
.titlebar { height:28px; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); background:var(--surface); border-bottom:1px solid var(--border) }
.body { flex:1; min-height:0; display:flex }

/* Sidebar */
aside { width:212px; flex:none; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border) }
.min aside { width:184px }
.nav { flex:1; overflow-y:auto; padding:8px }
.section { margin:12px 8px 4px; font-size:11px; font-weight:600; color:var(--muted) }
.item { width:100%; height:28px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; color:var(--text); text-align:left }
.item:hover { background:var(--surface-hover) }
.item.chosen { background:var(--surface-pressed) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.item .count { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums }
.item .warn { color:var(--warning) }
.mono { width:16px; height:16px; flex:none; display:grid; place-items:center; border-radius:4px; font-size:10px; font-weight:600; background:var(--accent-soft); color:var(--accent) }
.mono.k-video { background:var(--danger-soft); color:var(--danger) }
.mono.k-social { background:var(--warning-soft); color:var(--warning) }
.mono.k-image { background:color-mix(in srgb, var(--success) 14%, var(--background)); color:var(--success) }
.server { flex:none; width:100%; text-align:left; display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-top:1px solid var(--border); color:var(--muted); font-size:12px }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

/* Toolbar */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.toolbar { flex:none; height:48px; display:flex; align-items:center; gap:8px; padding:0 12px 0 20px; border-bottom:1px solid var(--border) }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; white-space:nowrap }
.toolbar .sub { color:var(--muted); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums }
.spacer { flex:1 }
.segmented { display:flex; padding:2px; gap:2px; border-radius:8px; background:var(--surface) }
.segmented button { height:24px; display:flex; align-items:center; gap:4px; padding:0 8px; border-radius:6px; color:var(--muted) }
.segmented button.on { background:var(--background); color:var(--text); box-shadow:0 0 0 1px var(--border) }
.segmented button svg.icon { width:14px; height:14px }
.min .segmented button span { display:none }
.search { width:200px; height:28px; display:flex; align-items:center; gap:6px; padding:0 4px 0 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted) }
.min .search { width:136px }
.search.focused { border-color:var(--accent); background:var(--background); box-shadow:0 0 0 3px var(--focus) }
.search.invalid { border-color:var(--warning) }
.search input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--text) }
.search input::placeholder { color:var(--muted) }
.search .clear { width:20px; height:20px; display:grid; place-items:center; border-radius:5px }
.search .clear svg.icon { width:14px; height:14px }
.tool { width:28px; height:28px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.tool:hover { background:var(--surface-hover); color:var(--text) }
.tool:disabled { opacity:.45; background:none; color:var(--muted); cursor:default }
.hint { flex:none; display:flex; align-items:center; gap:6px; padding:6px 20px; font-size:12px; color:var(--warning); background:var(--warning-soft); border-bottom:1px solid var(--border) }
.hint svg.icon { width:14px; height:14px }

/* Reader */
.toolbar { padding:0 12px 0 8px; gap:2px }
.back { height:28px; display:flex; align-items:center; gap:2px; padding:0 8px 0 4px; border-radius:6px; color:var(--muted); min-width:0 }
.back span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.back:hover { background:var(--surface-hover); color:var(--text) }
.tool.on { color:var(--star) }
.divider { width:1px; height:16px; margin:0 6px; background:var(--border) }
.scroll { flex:1; overflow-y:auto }
.page { max-width:680px; margin:0 auto; padding:28px 32px 48px }
.min .page { padding:20px 20px 40px }
.meta { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); min-width:0; flex-wrap:wrap }
.meta .src { color:var(--text); font-weight:500 }
.meta .sep::before { content:"·" }
.page h1 { margin:10px 0 0; font-size:24px; line-height:1.25; font-weight:650; text-wrap:pretty }
.min .page h1 { font-size:20px }
.note { display:flex; gap:8px; align-items:flex-start; margin:18px 0 0; padding:10px 12px; border-radius:8px; font-size:12.5px; background:var(--surface); color:var(--muted) }
.note.warn { background:var(--warning-soft); color:var(--warning) }
.note svg.icon { width:14px; height:14px; margin-top:2px }
.note .link { color:inherit; text-decoration:underline; font-weight:500 }
.prose { margin-top:22px; font-size:15px; line-height:1.65; color:var(--text) }
.prose > * { margin:0 0 14px }
.prose h2 { margin:26px 0 10px; font-size:18px; line-height:1.3; font-weight:600 }
.prose h3 { margin:22px 0 8px; font-size:15.5px; font-weight:600 }
.prose a { color:var(--accent); text-decoration:underline; text-underline-offset:2px }
.prose ul, .prose ol { padding-left:22px }
.prose li { margin:4px 0 }
.prose blockquote { padding:2px 0 2px 14px; border-left:3px solid var(--border); color:var(--muted) }
.prose code { font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; padding:1px 4px; border-radius:4px; background:var(--surface) }
.prose pre { padding:12px 14px; border-radius:8px; background:var(--surface); overflow-x:auto }
.prose pre code { padding:0; background:none }
.prose figure { margin:20px 0 }
.prose .pic { width:100%; border-radius:8px; background:var(--surface) }
.prose figcaption { margin-top:6px; font-size:12px; color:var(--muted) }
.prose hr { border:0; border-top:1px solid var(--border); margin:24px 0 }
.end { display:flex; justify-content:center; margin-top:28px }
.skeleton .bar { height:12px; border-radius:6px; background:var(--surface); margin:10px 0 }
.skeleton .bar.h { height:22px; width:80%; margin:14px 0 22px }
.skeleton .bar.m { width:30% }
.skeleton .bar.s { width:96% }
.skeleton .bar.e { width:64% }
.empty { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center }
.tile { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent) }
.tile.danger { background:var(--danger-soft); color:var(--danger) }
.tile svg.icon { width:24px; height:24px; stroke-width:1.5 }
.empty h2 { margin:0; font-size:15px; font-weight:600 }
.empty p { margin:-4px 0 0; max-width:320px; color:var(--muted) }
.buttons { display:flex; gap:8px }
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border:1px solid var(--border); border-radius:8px; background:var(--background); color:var(--text) }
.button:hover { background:var(--surface-hover) }
.button.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-text); font-weight:500 }
.spin { animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
.g1 { background:linear-gradient(135deg,#d6c7a8,#7b8f86) }
.tabs { flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:8px 8px 6px; border-bottom:1px solid var(--border) }
.tab { height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:8px; color:var(--muted) }
.tab.on { background:var(--accent-soft); color:var(--accent) }
.tab svg.icon { width:18px; height:18px }
.tab span { min-height:10px; font-size:10px; line-height:1; font-variant-numeric:tabular-nums }

/* AI */
.tool.pressed { background:var(--accent-soft); color:var(--accent) }
.ai { margin:18px 0 0; padding:12px 14px 14px; border-radius:10px; background:var(--accent-soft); font-size:14px; line-height:1.6 }
.ai.plain { background:var(--surface) }
.ai.error { background:var(--danger-soft) }
.ai .head { display:flex; align-items:center; gap:6px; height:22px; font-size:12px; color:var(--accent); font-weight:600 }
.ai.plain .head { color:var(--text) }
.ai.error .head { color:var(--danger) }
.ai .head svg.icon { width:14px; height:14px }
.ai .head .by { font-weight:400; color:var(--muted) }
.ai .head .mini { margin-left:auto; width:22px; height:22px; display:grid; place-items:center; border-radius:5px; color:var(--muted) }
.ai .head .mini svg.icon { width:13px; height:13px }
.ai .head .textbutton { margin-left:auto; height:22px; padding:0 6px; border-radius:5px; font-weight:500; color:var(--muted) }
.ai p { margin:6px 0 0 }
.ai .muted { color:var(--muted); font-size:13px }
.ai .bars .bar { height:10px; border-radius:5px; background:color-mix(in srgb, var(--accent) 14%, var(--background)); margin:9px 0 0 }
.ai .buttons { margin-top:10px }
.button.small { height:26px; padding:0 10px; font-size:12px }
.button.small svg.icon { width:14px; height:14px }
.note .grow { flex:1 }
.note .textlink { color:inherit; text-decoration:underline; font-weight:500; white-space:nowrap }
.note.lens { align-items:center; background:var(--accent-soft); color:var(--accent) }
.note.lens svg.icon { margin-top:0 }
.note.error { background:var(--danger-soft); color:var(--danger) }
.note .segmented { margin:-4px -6px -4px 0; background:var(--background) }
.note .segmented button.on { background:var(--accent); color:var(--accent-text); box-shadow:none }
</style>
<div class="switcher" aria-hidden="true">
  <label>state <select id="state"></select></label>
  <label>scheme <select id="scheme"></select></label>
  <label>lang <select id="lang"></select></label>
  <label>size <select id="size"></select></label>
</div>
<div class="window" id="window"><div class="titlebar">Oriel</div><div class="body" id="app"></div></div>
<script>
const states=['full','feed','extracting','extracting-empty','failed','loading','error','summarizing','summary','summary-failed','translating','translation','translation-failed','ai-off'];
const query=new URLSearchParams(location.search);
const pick=(name,list,fallback)=>list.includes(query.get(name))?query.get(name):fallback;
const options={state:states,scheme:['light','dark'],lang:['en','zh-Hans'],size:['default','min']};
const state=pick('state',states,'full');
const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');
document.documentElement.dataset.scheme=scheme;
document.documentElement.lang=lang;
document.getElementById('window').classList.toggle('min',size==='min');
for(const [id,list] of Object.entries(options)){
  const select=document.getElementById(id);
  select.innerHTML=list.map(s=>`<option>${s}</option>`).join('');
  select.value={state,scheme,lang,size}[id];
  select.onchange=()=>{query.set(id,select.value);location.search=query};
}

const copy={

    aiTimeout:'The AI endpoint took too long to answer.', aiUnauthorized:'The AI endpoint turned down the API key. Check it in Settings.',
    aiOff:'Summaries and translations use an AI endpoint of your choosing, such as OpenAI or a model on this computer. Set one up in Settings first.',
    aiOffTitle:'AI isn’t set up', openSettings:'Open Settings…', close:'Close',
  },
  'zh-Hans':{
    all:'全部', article:'文章', video:'视频', social:'社交', image:'图片', kinds:'形态', sources:'订阅',
    back:'回到{scope}', previous:'上一篇', next:'下一篇',
    star:'收藏', unstar:'取消收藏', markRead:'标为已读', markUnread:'标为未读', open:'在浏览器中打开',
    feedNote:'这不是全文：网页抽不出正文，下面是订阅里带的内容。',
    extractingNote:'正在取全文，先显示订阅里带的内容。',
    openOriginal:'打开原文',
    extracting:'正在取全文', extractingHint:'读完网页后，文章会显示在这里。',
    failed:'没有可显示的正文', failedHint:'网页抽不出正文，订阅里也没有这篇的内容。',
    error:'这篇加载不出来', errorHint:'服务端没有响应。检查一下连接再试。', retry:'重试',
    thisComputer:'本机', failing:'上次抓取失败',
    summarize:'摘要', hideSummary:'收起摘要', translate:'翻译', showOriginal:'显示原文',
    summary:'摘要', by:'由 {model} 生成', summarizing:'正在生成摘要…', cancel:'取消',
    summaryFailed:'摘要没能生成', translating:'正在翻译，完成前先看原文。',
    translated:'由 {model} 翻译', translation:'译文', original:'原文',
    translationFailed:'没能翻译。{reason}',
    aiTimeout:'AI 接口太久没有响应。', aiUnauthorized:'AI 接口不接受这个 API key，去设置里检查一下。',
    aiOff:'摘要和翻译走你自己选的 AI 接口，例如 OpenAI 或本机的模型。先在设置里配好。',
    aiOffTitle:'还没配置 AI', openSettings:'打开设置…', close:'关闭',
  },
}[lang];
const t=(key,args={})=>copy[key].replace(/\{(\w+)\}/g,(_,k)=>args[k]);
const zh=lang==='zh-Hans';

const sources=[
  {kind:'article',name:'Simon Willison',mono:'S',unread:3,chosen:true},
  {kind:'article',name:zh?'少数派':'Sspai',mono:zh?'少':'S',unread:12},
  {kind:'article',name:'The Go Blog',mono:'G',unread:0,failing:true},
];
const sidebar=`<aside><div class="tabs" role="tablist" aria-label="${copy.kinds}">${[['all','inbox'],['article','article'],['video','video'],['social','social'],['image','image']].map(([k,g])=>`<button class="tab${k==='article'?' on':''}" role="tab" aria-selected="${k==='article'}" aria-label="${copy[k]}">${icon(g)}<span>${k==='article'?15:''}</span></button>`).join('')}</div>
<nav class="nav" aria-label="${copy.sources}"><div class="section">${copy.article}</div>${sources.map(s=>`<button class="item${s.chosen?' chosen':''}"><span class="mono">${s.mono}</span><span class="name">${s.name}</span>${s.failing?`<span class="warn" role="img" aria-label="${copy.failing}">${icon('alert')}</span>`:''}${s.unread?`<span class="count">${s.unread}</span>`:''}</button>`).join('')}</nav>
<button class="server">${icon('laptop')}<span class="name">${copy.thisComputer}</span><span class="dot" aria-hidden="true"></span></button></aside>`;

const summaryOn=['summarizing','summary','summary-failed'].includes(state), translated=state==='translation';
const starred=state==='full', read=true, off=state==='error'||state==='loading'?' disabled':'';
const tools=`<button class="back" aria-label="${t('back',{scope:'Simon Willison'})}" title="${t('back',{scope:'Simon Willison'})} (Esc)">${icon('chevronLeft')}<span>Simon Willison</span></button><span class="spacer"></span>
<button class="tool" aria-label="${copy.previous}" title="${copy.previous} (K)">${icon('chevronUp')}</button>
<button class="tool" aria-label="${copy.next}" title="${copy.next} (J)">${icon('chevronDown')}</button><span class="divider"></span>
<button class="tool${summaryOn?' pressed':''}"${off} aria-pressed="${summaryOn}" aria-label="${summaryOn?copy.hideSummary:copy.summarize}" title="${summaryOn?copy.hideSummary:copy.summarize}">${icon('sparkles')}</button>
<button class="tool${translated?' pressed':''}"${off} aria-pressed="${translated}" aria-label="${translated?copy.showOriginal:copy.translate}" title="${translated?copy.showOriginal:copy.translate}">${icon('languages')}</button><span class="divider"></span>
<button class="tool${starred?' on':''}"${off} aria-pressed="${starred}" aria-label="${starred?copy.unstar:copy.star}" title="${starred?copy.unstar:copy.star} (S)">${icon('star',starred?'filled':'')}</button>
<button class="tool"${off} aria-label="${read?copy.markUnread:copy.markRead}" title="${read?copy.markUnread:copy.markRead} (M)">${icon(read?'dot':'circleCheck')}</button>
<button class="tool"${off} aria-label="${copy.open}" title="${copy.open} (O)">${icon('external')}</button>`;

const titleOf=zh=>zh?'用 SQLite 做全文检索：trigram 分词的取舍':'Full-text search in SQLite: the trade-offs of the trigram tokenizer';
const meta=`<div class="meta"><span class="mono">S</span><span class="src">Simon Willison</span><span class="sep"></span><span>${zh?'10月18日 11:34':'Oct 18, 11:34'}</span></div>`;
const fullOf=zh=>zh?`
<p>SQLite 的 FTS5 自带三种分词器。<code>unicode61</code> 按空白和标点切词，对英文够用，对中文就不行了：一整句话会被当成一个词。<a href="#">trigram 分词器</a>换了个思路，把文本切成所有连续的三个字符。</p>
<h2>它换来了什么</h2>
<p>任意子串都能命中，不需要词典，也不关心语言：</p>
<ul><li>中文、日文和英文混在一起也能搜；</li><li><code>LIKE</code> 和 <code>GLOB</code> 查询可以走索引；</li><li>不用维护停用词表。</li></ul>
<figure><div class="pic g1" style="aspect-ratio:16/9" role="img" aria-label="索引大小对比图"></div><figcaption>同一份语料在三种分词器下的索引大小。</figcaption></figure>
<h2>它的代价</h2>
<blockquote>短于三个字符的查询用不上索引——这是 trigram 的定义决定的，不是实现的缺陷。</blockquote>
<pre><code>CREATE VIRTUAL TABLE entries_fts USING fts5(
  title, body, tokenize = 'trigram'
);</code></pre>
<p>索引大约是原文的三倍。对一个个人阅读器来说，这通常可以接受。</p>`:`
<p>SQLite’s FTS5 ships with three tokenizers. <code>unicode61</code> splits on whitespace and punctuation, which is fine for English and useless for Chinese, where a whole sentence becomes one token. The <a href="#">trigram tokenizer</a> takes another route: it indexes every run of three characters.</p>
<h2>What it buys you</h2>
<p>Any substring matches, with no dictionary and no idea of language:</p>
<ul><li>Chinese, Japanese and English can be searched together;</li><li><code>LIKE</code> and <code>GLOB</code> queries can use the index;</li><li>there is no stop-word list to maintain.</li></ul>
<figure><div class="pic g1" style="aspect-ratio:16/9" role="img" aria-label="Chart of index sizes"></div><figcaption>The same corpus under the three tokenizers.</figcaption></figure>
<h2>What it costs</h2>
<blockquote>Queries shorter than three characters cannot use the index. That follows from what a trigram is; it is not a flaw in the implementation.</blockquote>
<pre><code>CREATE VIRTUAL TABLE entries_fts USING fts5(
  title, body, tokenize = 'trigram'
);</code></pre>
<p>The index ends up about three times the size of the text. For a personal reader that is usually fine.</p>`;
const title=titleOf(zh), full=fullOf(zh);
const feed=zh?`<p>trigram 分词让任意子串都能命中，代价是索引变大、短于三个字的查询无法使用。这篇文章比较了三种方案在中文语料上的表现。</p><p><a href="#">继续阅读 →</a></p>`:`<p>The trigram tokenizer matches any substring, at the cost of a bigger index and no queries shorter than three characters. Here is how three approaches compare on a mixed-language corpus.</p><p><a href="#">Continue reading →</a></p>`;
const note=(cls,glyph,text)=>`<div class="note ${cls}" role="note">${icon(glyph,glyph==='loader'?'spin':'')}<span>${text} ${cls?`<a class="link" href="#">${copy.openOriginal}</a>`:''}</span></div>`;
const article=(extra,html)=>`<article class="page" aria-labelledby="title">${meta}<h1 id="title">${title}</h1>${extra}<div class="prose">${html}</div></article>`;
const empty=(tile,heading,hint,buttons,cls='')=>`<div class="empty" role="status"><div class="tile ${cls}">${icon(tile,tile==='loader'?'spin':'')}</div><h2>${heading}</h2><p>${hint}</p><div class="buttons">${buttons}</div></div>`;
const openButton=(cls='')=>`<button class="button ${cls}">${icon('external')}${copy.openOriginal}</button>`;

const model='gpt-4o-mini';
const summaryText=zh?'SQLite FTS5 的 trigram 分词器把文本切成所有连续的三个字符，任意子串都能命中，不需要词典，中英文混排也能搜，LIKE 和 GLOB 查询还能走索引。代价是索引约为原文的三倍，短于三个字符的查询用不上索引。作者认为对个人阅读器来说，这个取舍值得。'
  :'The trigram tokenizer in SQLite’s FTS5 indexes every run of three characters, so any substring matches without a dictionary, Chinese and English alike, and LIKE and GLOB queries can use the index. The price is an index about three times the size of the text, and no index for queries shorter than three characters. For a personal reader, the author finds the trade worth it.';
const close=`<button class="mini" aria-label="${copy.hideSummary}" title="${copy.hideSummary}">${icon('x')}</button>`;
const card={
  summarizing:`<section class="ai" aria-label="${copy.summary}" aria-busy="true"><div class="head" role="status">${icon('loader','spin')}<span>${copy.summarizing}</span><button class="textbutton">${copy.cancel}</button></div><div class="bars" aria-hidden="true"><div class="bar" style="width:96%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:58%"></div></div></section>`,
  summary:`<section class="ai" aria-label="${copy.summary}"><div class="head">${icon('sparkles')}<span>${copy.summary}</span><span class="by">· ${t('by',{model})}</span>${close}</div><p>${summaryText}</p></section>`,
  'summary-failed':`<section class="ai error" aria-label="${copy.summary}"><div class="head" role="alert">${icon('alert')}<span>${copy.summaryFailed}</span>${close}</div><p>${copy.aiTimeout}</p><div class="buttons"><button class="button small">${icon('refresh')}${copy.retry}</button></div></section>`,
  'ai-off':`<section class="ai plain" aria-label="${copy.aiOffTitle}"><div class="head" role="status">${icon('sparkles')}<span>${copy.aiOffTitle}</span><button class="mini" aria-label="${copy.close}" title="${copy.close}">${icon('x')}</button></div><p class="muted">${copy.aiOff}</p><div class="buttons"><button class="button small primary">${icon('settings')}${copy.openSettings}</button></div></section>`,
};
const plain=html=>html.replace(/<figure[\s\S]*?<\/figure>|<pre[\s\S]*?<\/pre>/g,'').replace(/<li>/g,' ').split(/<\/(?:p|h2|ul|blockquote)>/).map(x=>x.replace(/<[^>]+>/g,'').trim()).filter(Boolean).map(x=>`<p>${x}</p>`).join('');
const lens=`<div class="note lens" role="note">${icon('languages')}<span class="grow">${t('translated',{model})}</span><div class="segmented" role="radiogroup" aria-label="${copy.translate}"><button role="radio" aria-checked="true" class="on">${copy.translation}</button><button role="radio" aria-checked="false">${copy.original}</button></div></div>`;
const original=(extra)=>`<article class="page" aria-labelledby="title" lang="${zh?'en':'zh-Hans'}">${meta}<h1 id="title">${titleOf(!zh)}</h1>${extra}<div class="prose">${fullOf(!zh)}</div></article>`;

let page;
switch(state){
  case 'summarizing':case 'summary':case 'summary-failed':case 'ai-off':page=article(card[state],full);break;
  case 'translating':page=original(`<div class="note" role="status">${icon('loader','spin')}<span class="grow">${copy.translating}</span><a class="textlink" href="#">${copy.cancel}</a></div>`);break;
  case 'translation':page=article(lens,plain(full));break;
  case 'translation-failed':page=original(`<div class="note error" role="alert">${icon('alert')}<span class="grow">${t('translationFailed',{reason:copy.aiUnauthorized})}</span><a class="textlink" href="#">${copy.retry}</a></div>`);break;
  case 'full':page=article('',full);break;
  case 'feed':page=article(note('warn','triangle',copy.feedNote),feed);break;
  case 'extracting':page=article(note('','loader',copy.extractingNote),feed);break;
  case 'extracting-empty':page=`<article class="page" aria-labelledby="title">${meta}<h1 id="title">${title}</h1></article>`+empty('loader',copy.extracting,copy.extractingHint,openButton()).replace('class="empty"','class="empty" style="min-height:0;padding-top:24px"');break;
  case 'failed':page=`<article class="page" aria-labelledby="title">${meta}<h1 id="title">${title}</h1></article>`+empty('fileText',copy.failed,copy.failedHint,openButton('primary')).replace('class="empty"','class="empty" style="min-height:0;padding-top:24px"');break;
  case 'loading':page=`<div class="page skeleton" aria-busy="true"><div class="bar m"></div><div class="bar h"></div>${'<div class="bar s"></div>'.repeat(3)}<div class="bar e"></div><br>${'<div class="bar s"></div>'.repeat(2)}<div class="bar e"></div></div>`;break;
  case 'error':page=empty('wifiOff',copy.error,copy.errorHint,`<button class="button">${icon('refresh')}${copy.retry}</button>`,'danger');break;
}
document.getElementById('app').innerHTML=`${sidebar}<section class="main"><div class="toolbar">${tools}</div><div class="scroll">${page}</div></section>`;
</script>
</html>
