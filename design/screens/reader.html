<title>Reader screen</title>
<!-- The reader: an article opened from the timeline takes the place of the list; the sidebar stays. It shows the
     extracted full text, or the feed's own content with a note when there is no full text. The back button, Escape
     and the sidebar return to the list where it was. Colors are the Oriel palette of design/tokens.md; icons are
     Lucide (ISC License). Pictures are drawn as gradients here; in the app they load in the background through the
     image proxy and show the Surface color, at their own aspect ratio when the page gives it, until then.
     States: full (extracted text), full-switch (the same, with the Full text | Feed switch, shown when the feed carries text
     too), feed-text (the switch on Feed: the feed's content, no note), feed (no full text, the feed's content; "Try again"
     in the note), extracting (full text not tried yet, or being tried again after "Try again"; the feed's content
     meanwhile), extracting-empty (the same with no feed content), failed (no full text and no feed content; "Try again"
     beside "Open the original"), loading, error.
     AI states: summarizing, summary, summary-failed, summary-cap (the daily cap on automatic work is reached), translating (the original stays readable), translation (the
     translated text, with a switch back to the original), translation-failed, ai-off (AI is not set up: the
     summary or translate button leads to Settings instead of failing). no-more-unread: N found no unread article
     after this one, so a toast says so and the reader stays put. resumed: the article was left part way (read progress
     between 0.02 and 0.95), so it opens scrolled to the place, about 40% down here, with a quiet toast "Back where you left off"
     (the toast of the no-more-unread state, with the rotate-ccw icon); a finished, unopened or near-top article opens at the top as full. Site icons are generic stand-ins. Summary and translation sit between
     previous/next and star in the toolbar; translation is plain text, so pictures and links are in the original.
     Summary and translation carry their name beside the icon (icon only in the smallest window); mark as unread is
     an envelope; every tooltip names its key. The toolbar's ends line up with the article column (size=wide).
     The window has no title bar: the window buttons sit over the sidebar's top; the sidebar is a floating pane of
     warm ink glass in both schemes, the article is paper set in the system sans, and Summarize and Translate are the one
     glass capsule; the other controls are bare icons (docs/design.md, Title bar).
     The header line ends with the reading time after the date ("6 min read"), the same label as in the timeline row.
     The bar above the window only switches the mockup.
     Copy link (docs/product.md, Copy link): the toolbar button after Open in browser (link icon, "Copy link"; dimmed with the other
     article buttons) puts the entry's original address on the clipboard and a toast says "Link copied" (link-copied), which
     screen readers also hear. It has no Undo.
     Export (docs/product.md, Export as Markdown): the last toolbar button is More (ellipsis), a menu button whose menu,
     the platform's own with text only, holds Copy as Markdown and Save as Markdown… (more-menu). Copy puts the article on
     the clipboard and a toast says "Copied" (copied), which screen readers also hear; Save opens the system save dialog.
     More is dimmed with the other article buttons while the article is not loaded.
     Reading preferences (Settings, Appearance, kept per device): textsize=small|medium|large|xlarge (default medium)
     scales the body, h2, h3, code, the gaps and the column: the column is 680 x the text size scale (634 / 680 /
     771 / 861, rounded; scale 14/15, 1, 17/15, 19/15), never wider than the window leaves it, and the toolbar's ends
     follow it. font=interface|serif (default interface) is the Reading font: it sets the article's body only; the
     title, notes, h2, h3, captions and the toolbar stay in the interface font. Serif is the platform serif set (here
     macOS: New York and Songti SC). Use size=wide to see the two largest columns whole; the default window is
     narrower than they are, so the window limits them.
     Chinese typesetting (Settings, Appearance, Reading, kept per device; docs/design.md, Chinese typesetting):
     cjk=on|off (default on). On, text that is Chinese gets 0.25em between a Han character and a Latin letter or digit
     (extra letter spacing on the character before the boundary, no space inserted) and -0.5em on the first of two
     full-width punctuation marks that leave half an em blank between them. Here the transformation is done in script
     with spans (.cjk-gap, .cjk-tight); in the app it is layout and the text is unchanged. Off, text is set as the font
     gives it; the browser's own trimming and autospacing are turned off so on and off differ only by these rules.
     Try lang=zh-Hans&cjk=off against lang=zh-Hans (on).
     Selection states (a right click on selected body text adds "Translate selection" and "Explain selection" to the
     menu; the answer shows in a card over the bottom of the reader): selection-menu, selection-loading,
     selection-translate (result), selection-explain (result), selection-failed, selection-ai-off, selection-too-long
     (over 2000 characters: no request is made). Escape closes the card; so does opening another entry.
     Toolbar (docs/design.md, Toolbar buttons): one order, back, previous, next, summary, translate, star, read/unread, open
     in browser, copy link, more; buttons are 32 square, radius 8, 4 apart. translate-disabled: an article already in the
     target language keeps a dimmed Translate with its reason as tooltip; more-narrow: the minimum window, copy link moved
     into More. The bar is solid Background; scrolled shows its hairline (the reader scrolled 96).
     Immersive reading (docs/design.md, Immersive reading; the Z key, Esc or Z leave it): immersive hides the sidebar and the toolbar, the
     article keeps its column, centered in the whole window, and the 52 high band at the top stays Background, empty (so the window
     buttons never sit over text and nothing moves when it is entered). immersive-bar: the pointer is in that band (or the focus is
     in the toolbar), so the toolbar shows over it with the one extra button, "Exit immersive reading" (minimize-2, tooltip with Z),
     before More; it hides again when the pointer leaves and the focus is not in it. J and K still change the article.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min|wide, textsize, font, cjk. -->
<style>
:root { color-scheme:light; --stage:#dedad2; --stage-text:#4f4a42; --shadow:28,24,18; --t:140ms ease-out;
  --background:#fdfcfa; --surface:#f6f3ee; --raised:#ffffff; --track:#ece8e0; --disabled:#b3ada1;
  --text:#25221e; --text2:#58534a; --muted:#736d62; --prose:#3a362f;
  --ink:37,34,30; --hover:rgba(var(--ink),.03); --pressed:rgba(var(--ink),.05); --sel:rgba(var(--ink),.065); --border:rgba(var(--ink),.075);
  --accent:#2a6d65; --accent-hover:#225a54; --accent-text:#ffffff; --accent-soft:rgba(42,109,101,.09); --focus:rgba(42,109,101,.7);
  --danger:#b4533c; --danger-soft:rgba(180,83,60,.09); --warning:#9a7222; --warning-soft:rgba(154,114,34,.10); --success:#4c7c59; --star:#b98a22;
  --chrome:#37332e; --chrome-ink:255,248,235; --chrome-text:#ece7dd; --chrome-text2:#cdc7bb; --chrome-muted:#a49e91;
  --glass:rgba(255,254,251,.66); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.95), 0 0 0 .5px rgba(var(--ink),.12), 0 2px 12px rgba(var(--ink),.07);
  --reading:system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; --scale:1; --col:680px }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0b0c0c; --stage-text:#8a918f;
  --background:#171918; --surface:#1d1f1e; --raised:#252827; --track:#2c2f2e; --disabled:#565b59;
  --text:#dde1df; --text2:#aab0ae; --muted:#8a918f; --prose:#c3c9c7;
  --ink:234,240,238; --hover:rgba(var(--ink),.04); --pressed:rgba(var(--ink),.06); --sel:rgba(var(--ink),.08); --border:rgba(var(--ink),.075);
  --accent:#78beb1; --accent-hover:#8ccbbf; --accent-text:#10241f; --accent-soft:rgba(120,190,177,.12); --focus:rgba(120,190,177,.7);
  --danger:#e0897a; --danger-soft:rgba(224,137,122,.13); --warning:#d6aa55; --warning-soft:rgba(214,170,85,.13); --success:#8ab997; --star:#e2b24f;
  --chrome:#1a2422; --chrome-ink:235,248,244; --chrome-text:#e8eeec; --chrome-text2:#cbd5d2; --chrome-muted:#93a39f;
  --glass:rgba(58,63,62,.52); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 .5px rgba(0,0,0,.55) }
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
body { margin:0; padding:24px; font:13px/1.5 system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
:root:lang(zh-Hans) body { line-height:1.65 }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
/* The mockup applies the Chinese typesetting rules itself, so the browser's own are off. */
body { text-autospace:no-autospace; text-spacing-trim:space-all }
.cjk-gap { letter-spacing:.25em }
.cjk-tight { letter-spacing:-.5em }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default; transition:background-color var(--t), color var(--t), opacity var(--t) }
button:focus-visible { outline:2px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

/* Window: no title bar, the window buttons over the sidebar's top; the sidebar is an ink pane of glass floating 8
   from the window's edges; the content is paper and never sits on glass. */
.window { position:relative; width:960px; height:640px; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; background:var(--background); box-shadow:0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px rgba(var(--shadow),.28) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.65) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }

/* Sidebar: warm charcoal in both schemes, so its roles are its own: light on dark, warm-white state fills (5.5, 8.5
   and 12%), its own accent. The selection is the fill plus the icon in Accent. */
aside { width:216px; flex:none; display:flex; flex-direction:column; margin:8px 0 8px 8px; padding-top:40px; border-radius:14px;
  background:var(--chrome);
  box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.10), 0 0 0 .5px rgba(0,0,0,.35), 0 6px 24px rgba(var(--shadow),.14);
  --ink:var(--chrome-ink); --text:var(--chrome-text); --text2:var(--chrome-text2); --muted:var(--chrome-muted); --accent:#7cc9bb; --warning:#d6aa55; --success:#8ab997;
  --hover:rgba(var(--ink),.055); --pressed:rgba(var(--ink),.085); --sel:rgba(var(--ink),.12); --border:rgba(var(--ink),.08); --track:rgba(var(--ink),.11) }
:root[data-scheme=dark] aside { box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.08), 0 0 0 .5px rgba(0,0,0,.7) }
.min aside { width:184px }
.kind-list { flex:none; padding:0 8px 8px; display:flex; flex-direction:column; gap:1px }
.nav { flex:1; overflow-y:auto; padding:4px 8px 6px }
.section { margin:14px 10px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
:root:lang(zh-Hans) .section { font-size:12px; letter-spacing:.02em }
.item { width:100%; height:30px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:8px; color:var(--text); text-align:left }
.item:hover { background:var(--hover) }
.item:active { background:var(--pressed) }
.item.chosen { background:var(--sel) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text2) }
.item.chosen .name { font-weight:500; color:var(--text) }
.item .count { font-size:11px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums; color:var(--muted) }
.item:hover .count, .item.chosen .count { color:var(--text2) }
.item .warn { color:var(--warning) }
.kind-list .item svg.icon { color:var(--muted) }
.kind-list .item:hover svg.icon { color:var(--text2) }
.kind-list .item.chosen svg.icon { color:var(--accent) }

/* One shape for every source icon: size, radius and hairline; monograms are neutral, never colored by kind. */
.fav, .mono { width:18px; height:18px; flex:none; border-radius:4px }
.fav { position:relative; overflow:hidden }
.fav::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 .5px rgba(var(--ink),.2) }
.fav svg { display:block; width:100%; height:100% }
.mono { display:grid; place-items:center; font-size:10.5px; font-weight:600; background:var(--track); color:var(--text2) }
.meta .fav, .meta .mono { width:15px; height:15px; border-radius:4px }
.meta .mono { font-size:9px }
.server { flex:none; width:calc(100% - 8px); display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 18px; margin-bottom:6px; text-align:left; font-size:12px; letter-spacing:.01em; color:var(--muted) }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

/* Toolbar: a solid Background bar, 52 high, the full width of the column, over the article; a hairline (Border, 0.5)
   appears under it once the article scrolls beneath (.main.scrolled; state=scrolled). The buttons are bare icons, one spec
   (32 square, radius 8, 4 apart); the one glass capsule holds Summarize and Translate. The ends line up with the article column. */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.main::before { content:""; position:absolute; top:0; left:0; right:0; height:52px; background:var(--background); z-index:1; pointer-events:none }
.main::after { content:""; position:absolute; top:52px; left:0; right:0; height:.5px; background:var(--border); opacity:0; transition:opacity 120ms ease-out; z-index:1; pointer-events:none }
.main.scrolled::after { opacity:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; display:flex; align-items:center; gap:4px; padding:0 max(16px,calc((100% - var(--col))/2 + 32px)) 0 max(12px,calc((100% - var(--col))/2 + 28px)) }
.immersive .toolbar { padding-left:max(78px,min(calc((100% - var(--col))/2 + 28px),calc((100% - 640px)/2))); padding-right:max(16px,min(calc((100% - var(--col))/2 + 32px),calc((100% - 640px)/2))) }
.immersive.quiet .toolbar { display:none }
.immersive.bar::after { opacity:1 }
.spacer { flex:1 }
.back { height:32px; display:flex; align-items:center; gap:2px; min-width:0; padding:0 10px 0 4px; border-radius:8px; color:var(--text2); font-weight:500 }
.back span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.back:hover { background:var(--hover); color:var(--text) }
.back:active { background:var(--pressed) }
.bare { display:flex; align-items:center; gap:4px; flex:none }
/* The toolbar icon button (docs/design.md, Toolbar buttons): 32 square, icon 16, radius 8. No fill; SurfaceHover under the pointer,
   SurfacePressed pressed; icon TextMuted, Text under the pointer; Disabled with no fill; on: the star in Star, a toggle on Soft(Accent). */
.tool { width:32px; height:32px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.tool:hover { background:var(--hover); color:var(--text) }
.tool:active { background:var(--pressed) }
.tool.on { color:var(--star) }
.tool:disabled, .tool[aria-disabled=true], .tool:disabled:hover, .tool[aria-disabled=true]:hover { background:none; color:var(--disabled) }
.group { flex:none; display:flex; align-items:center; gap:1px; height:34px; padding:0 4px; margin:0; border-radius:17px; background:var(--glass); box-shadow:var(--glass-rim); -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5) }
.group .tool { height:28px; width:30px; border-radius:14px }
.group .tool:disabled, .group .tool[aria-disabled=true] { background:none }
.group .tool.labeled { width:auto; display:flex; gap:6px; padding:0 11px 0 9px; font-size:12px; font-weight:500; letter-spacing:.01em }
.group .tool.pressed { background:var(--accent-soft); color:var(--accent) }
.min .group .tool.labeled { width:30px; padding:0; display:grid }
.min .group .tool.labeled span { display:none }

/* Reader: the article is paper; the body is set in the system sans. */
.scroll { flex:1; overflow-y:auto }
.page { max-width:var(--col); margin:0 auto; padding:56px 32px 72px }
.min .page { padding:52px 20px 56px }
.meta { display:flex; align-items:center; gap:6px; min-width:0; flex-wrap:wrap; font-size:12px; letter-spacing:.005em; color:var(--muted) }
.meta .src { font-weight:500; color:var(--text2) }
.meta .sep::before { content:"·"; opacity:.7 }
.meta span:last-child { font-variant-numeric:tabular-nums }
.page h1 { margin:12px 0 0; font-size:24px; line-height:1.28; font-weight:600; letter-spacing:-.015em; text-wrap:pretty; color:var(--text) }
.min .page h1 { font-size:21px }
:root:lang(zh-Hans) .page h1 { line-height:1.42; letter-spacing:-.005em }
.also-line { display:flex; align-items:center; flex-wrap:wrap; gap:2px 4px; margin:10px 0 0; font-size:12px; color:var(--muted) }
.also-line .head { flex:none; margin-right:4px; font-weight:500 }
.also-line button { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 8px; border-radius:8px; font:inherit; font-size:13px; color:var(--text2) }
.also-line button:hover, .also-line button.hover { background:var(--hover); color:var(--text) }
.also-line .fav, .also-line .mono { width:15px; height:15px; border-radius:4px; flex:none }
.also-line .mono { font-size:9px }
.also-line .src { font-weight:500 }
.also-line .when { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap }
.prose { margin-top:26px; font:400 calc(16px * var(--scale))/1.7 var(--reading); color:var(--prose); font-feature-settings:"kern","liga" }
:root:lang(zh-Hans) .prose { line-height:1.85 }
.prose > * { margin:0 0 1.05em }
.prose h2 { margin:1.9em 0 .6em; font:600 calc(19px * var(--scale))/1.35 system-ui,-apple-system,"PingFang SC",sans-serif; letter-spacing:-.01em; color:var(--text) }
:root:lang(zh-Hans) .prose h2 { line-height:1.5; letter-spacing:0 }
.prose h3 { margin:1.6em 0 .5em; font:600 calc(16px * var(--scale))/1.4 system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--text) }
.prose a { color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:color-mix(in srgb,var(--accent) 38%,transparent); transition:text-decoration-color var(--t) }
.prose a:hover { text-decoration-color:var(--accent) }
.prose ul, .prose ol { padding-left:22px }
.prose li { margin:.3em 0 }
.prose li::marker { color:var(--muted) }
.prose blockquote { padding:0 0 0 18px; border-left:2px solid rgba(var(--ink),.16); color:var(--text2) }
.prose code { font:.86em/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; padding:.08em .38em; border-radius:4px; background:rgba(var(--ink),.055); color:var(--text) }
.prose pre { padding:14px 16px; border-radius:12px; background:var(--surface); overflow-x:auto; font-size:calc(13px * var(--scale)); line-height:1.6 }
.prose pre code { font-size:inherit; padding:0; background:none }
.prose figure { margin:1.4em 0 }
.pic { border-radius:12px; background-color:var(--surface); outline:.5px solid rgba(var(--ink),.10); outline-offset:-.5px }
.prose .pic { width:100% }
.prose figcaption { margin-top:8px; font:400 12px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--muted) }
.prose hr { border:0; border-top:1px solid var(--border); margin:24px 0 }
.g1 { background-image:linear-gradient(135deg,#d6c7a8,#7b8f86) }
:root[data-scheme=dark] .g1 { background-image:linear-gradient(135deg,#5b564a,#44605a) }

.note { display:flex; gap:8px; align-items:flex-start; margin:18px 0 0; padding:11px 14px; border-radius:12px; font-size:12px; background:var(--surface); color:var(--text2) }
.note svg.icon { width:14px; height:14px; margin-top:2px }
.note.warn { background:var(--warning-soft) }
.note.warn svg.icon { color:var(--warning) }
.note.lens { align-items:center; background:var(--accent-soft) }
.note.lens svg.icon { margin-top:0; color:var(--accent) }
.note.error { background:var(--danger-soft) }
.note.error svg.icon { color:var(--danger) }
.note .grow { flex:1 }
.note .link, .note .textlink { color:inherit; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:color-mix(in srgb,currentColor 40%,transparent); font-weight:500 }
.note .textlink { white-space:nowrap }
.note .segmented, .switch .segmented { display:flex; padding:2px; gap:2px; margin:-4px -6px -4px 0; border-radius:8px; background:rgba(var(--ink),.07) }
.note .segmented button, .switch .segmented button { height:24px; padding:0 9px; border-radius:6px; color:var(--text2) }
.note .segmented button.on, .switch .segmented button.on { background:var(--raised); color:var(--text); box-shadow:0 1px 2px rgba(var(--shadow),.14) }
:root[data-scheme=dark] .note .segmented button.on, :root[data-scheme=dark] .switch .segmented button.on { background:var(--track); box-shadow:none }
.switch { display:flex; margin:18px 0 0 }
.switch .segmented { margin:0 }

.ai { margin:18px 0 0; padding:14px 16px 16px; border-radius:14px; background:var(--accent-soft); font-size:13px; line-height:1.65 }
:root:lang(zh-Hans) .ai { line-height:1.8 }
.ai.plain { background:var(--surface) }
.ai.error { background:var(--danger-soft) }
.ai .head { display:flex; align-items:center; gap:6px; height:22px; font-size:12px; font-weight:500; letter-spacing:.01em; color:var(--accent) }
.ai.plain .head { color:var(--text2) }
.ai.error .head { color:var(--danger) }
.ai .head svg.icon { width:14px; height:14px }
.ai .head .by { font-weight:400; color:var(--muted) }
.ai .head .mini { margin-left:auto; width:22px; height:22px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.ai .head .mini:hover { background:var(--hover); color:var(--text) }

// Chinese typesetting (docs/design.md). Han and Latin letters or digits: 0.25em after the character before the
// boundary. Full-width punctuation: -0.5em after the first of a pair with a blank half between the two. Code is
// skipped and breaks adjacency; tags other than code are transparent; a space breaks adjacency.
const han=c=>/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(c);
const latin=c=>/[A-Za-z0-9\u00c0-\u024f]/.test(c);
const closing=c=>'，。、；：！？）」』》〉】'.includes(c);
const opening=c=>'（「『《〈【'.includes(c);
const cjk=html=>{
  if(!cjkOn)return html;
  const out=[]; let prev=-1;
  for(const part of html.split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>|<[^>]+>)/)){
    if(/^<(pre|code)/.test(part)){out.push(part);prev=-1;continue}
    if(part[0]==='<'&&part.length>1){out.push(part);continue}
    for(const c of part){
      const me={c,cls:''};
      if(/\s/.test(c))prev=-1;
      else{
        if(prev>=0){
          const p=out[prev].c;
          if((han(p)&&latin(c))||(latin(p)&&han(c)))out[prev].cls='cjk-gap';
          else if(((closing(p))&&(closing(c)||opening(c)))||(opening(p)&&opening(c)))out[prev].cls='cjk-tight';
        }
        prev=out.length;
      }
      out.push(me);
    }
  }
  return out.map(o=>typeof o==='string'?o:o.cls?`<span class="${o.cls}">${o.c}</span>`:o.c).join('');
};

const titleOf=zh=>zh?cjk('用SQLite做全文检索：trigram分词的取舍'):'Full-text search in SQLite: the trade-offs of the trigram tokenizer';

const fullOf=zh=>zh?cjk(`
<p>SQLite 的 FTS5 自带三种分词器。<code>unicode61</code> 按空白和标点切词，对英文够用，对中文就不行了：一整句话会被当成一个词。<a href="#">trigram 分词器</a>换了个思路，把文本切成所有连续的三个字符。</p>
<p>我用Go写了个RSS阅读器，数据放在SQLite里，全文检索靠FTS5的trigram，支持2种主题和3档行距（见「设置」）。</p>
<h2>它换来了什么</h2>
<p>任意子串都能命中，不需要词典，也不关心语言：</p>
<ul><li>中文、日文和英文混在一起也能搜；</li><li><code>LIKE</code> 和 <code>GLOB</code> 查询可以走索引；</li><li>不用维护停用词表。</li></ul>
<figure><div class="pic g1" style="aspect-ratio:16/9" role="img" aria-label="索引大小对比图"></div><figcaption>同一份语料在三种分词器下的索引大小。</figcaption></figure>
<h2>它的代价</h2>
<blockquote>短于三个字符的查询用不上索引——这是 trigram 的定义决定的，不是实现的缺陷。官方文档写的是「trigram要求至少3个字符」，所以『双字词』（如「分词」）要另想办法。</blockquote>
<pre><code>CREATE VIRTUAL TABLE entries_fts USING fts5(
  title, body, tokenize = 'trigram'
);</code></pre>
<p>索引大约是原文的三倍。对一个个人阅读器来说，这通常可以接受。</p>`):`
<p>SQLite’s FTS5 ships with three tokenizers. <code>unicode61</code> splits on whitespace and punctuation, which is fine for English and useless for Chinese, where a whole sentence becomes one token. The <a href="#">trigram tokenizer</a> takes another route: it indexes every run of three characters.</p>
<h2>What it buys you</h2>
<p>Any substring matches, with no dictionary and no idea of language:</p>
<ul><li>Chinese, Japanese and English can be searched together;</li><li><code>LIKE</code> and <code>GLOB</code> queries can use the index;</li><li>there is no stop-word list to maintain.</li></ul>
<figure><div class="pic g1" style="aspect-ratio:16/9" role="img" aria-label="Chart of index sizes"></div><figcaption>The same corpus under the three tokenizers.</figcaption></figure>
<h2>What it costs</h2>
<blockquote>Queries shorter than three characters cannot use the index. That follows from what a trigram is; it is not a flaw in the implementation.</blockquote>
<pre><code>CREATE VIRTUAL TABLE entries_fts USING fts5(
  title, body, tokenize = 'trigram'
);</code></pre>
<p>The index ends up about three times the size of the text. For a personal reader that is usually fine.</p>`;

{const sc=document.querySelector('.scroll'),mn=document.querySelector('.main');if(sc&&mn){const bar=()=>mn.classList.toggle('scrolled',sc.scrollTop>0);sc.addEventListener('scroll',bar);bar()}}
