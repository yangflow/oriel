<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example screen, light and dark</title>
<!-- Static comparison of the example screen in both appearances. Colors are the MyGo default theme roles;
     see design/tokens.md. No scripts and no external resources. -->
<style>
* { box-sizing:border-box }
body { margin:0; padding:24px; font-family:system-ui,sans-serif; background:#e4e4e7; color:#18181b }
h2 { margin:0 0 4px; font-size:16px }
p.note { margin:0 0 20px; font-size:13px; color:#52525b }
.row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start }
figure { margin:0 }
figcaption { margin:8px 0 0; font-size:12px; color:#52525b }
.window { width:480px; height:320px; border:1px solid #a1a1aa; border-radius:10px; overflow:hidden; display:flex; flex-direction:column }
.titlebar { height:28px; flex:none; display:flex; align-items:center; padding:0 12px; font-size:12px; border-bottom:1px solid var(--border); background:var(--button); color:var(--muted) }
.light { --background:#ffffff; --text:#18181b; --muted:#71717a; --button:#f4f4f5; --border:#d9d9de; --accent:#2563eb; --accent-text:#ffffff; --focus:rgba(37,99,235,.55) }
.dark { --background:#18181b; --text:#f4f4f5; --muted:#a1a1aa; --button:#27272a; --border:#3f3f46; --accent:#3b82f6; --accent-text:#ffffff; --focus:rgba(96,165,250,.6) }
.content { flex:1; padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--background); color:var(--text) }
.content h1 { font-size:23px; margin:0 }
.content output { font-size:47px; font-weight:700 }
.content nav { display:flex; gap:8px }
.content button { min-width:44px; padding:7px 12px; border:1px solid var(--border); border-radius:6px; background:var(--button); color:var(--text); font:inherit; font-size:13px }
.content button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent) }
.content button.focus { outline:2px solid var(--focus); outline-offset:1px }
.content button.disabled { opacity:.45 }
.content p { margin:0; font-size:12px; color:var(--muted) }
</style>
<h2>Example screen: light and dark</h2>
<p class="note">Top row: count 0, so Reset is disabled. Bottom row: count 2, with the keyboard focus on Increment.</p>
<div class="row">
  <figure><div class="window light"><div class="titlebar">Oriel</div><div class="content"><h1>Example</h1><output>0</output><nav><button aria-label="Decrement">−</button><button class="disabled" disabled>Reset</button><button class="primary" aria-label="Increment">+</button></nav><p>Use the arrow keys to count.</p></div></div><figcaption>Light, zero</figcaption></figure>
  <figure><div class="window dark"><div class="titlebar">Oriel</div><div class="content"><h1>Example</h1><output>0</output><nav><button aria-label="Decrement">−</button><button class="disabled" disabled>Reset</button><button class="primary" aria-label="Increment">+</button></nav><p>Use the arrow keys to count.</p></div></div><figcaption>Dark, zero</figcaption></figure>
  <figure><div class="window light"><div class="titlebar">Oriel</div><div class="content"><h1>Example</h1><output>2</output><nav><button aria-label="Decrement">−</button><button>Reset</button><button class="primary focus" aria-label="Increment">+</button></nav><p>Use the arrow keys to count.</p></div></div><figcaption>Light, positive, focus ring</figcaption></figure>
  <figure><div class="window dark"><div class="titlebar">Oriel</div><div class="content"><h1>Example</h1><output>-1</output><nav><button aria-label="Decrement" class="focus">−</button><button>Reset</button><button class="primary" aria-label="Increment">+</button></nav><p>Use the arrow keys to count.</p></div></div><figcaption>Dark, negative, focus ring</figcaption></figure>
</div>
</html>
