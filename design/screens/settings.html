<title>Settings screen</title>
<!-- Settings: they take the whole window. The timeline's sidebar gives way to the settings' own: "Back to the
     timeline" on top, then one item per group, and the server bar, which says whose settings these are. Opened from the
     gear button in the timeline's server bar or the app menu's "Settings…" (CmdOrCtrl+,); the back button and Escape
     return to the timeline where it was. Groups: Appearance (first; theme, interface language, interface font and the
     reading text, kept on this device only, not on the server), Fetching (the RSSHub instance and how long entries are
     kept), Import and export (OPML), AI (the endpoint for summaries and translations, and the global prompts), Devices
     (the sessions signed in to the server).
     Appearance is saved and applied as soon as a control is changed; it has no Save button. Colors are the Oriel palette of
     design/tokens.md; icons are Lucide (ISC License).
     States: appearance, fetching, edited (the instance changed, not saved), invalid (the server refused it), saved, opml,
     importing, imported (with failures), import-error, exported, devices (a remote server and its sessions),
     devices-local (this computer's server, no sessions), revoke (confirming a revocation), loading, error;
     ai (not set up), ai-configured (saved, the key only shown as set), ai-edited (changed, not saved; testing waits
     for the save), ai-invalid (the server refused the address), ai-testing, ai-tested, ai-test-failed;
     font-open (the Interface font picker open, the keyboard highlight on a row below the current choice),
     font-filtered ("sans" typed: the matches, the current choice still pinned on top if it matches),
     font-empty (nothing matches), font-loading (the family list is still being read);
     reading-font (the Reading card with Reading font set to Serif; the sample below is set in it),
     reading-font-open (the Reading font picker open from that row: Follow interface and Serif pinned).
     The font picker is a popup anchored under its control, right edges aligned: a search field, a hairline, then the
     list. It is reused by the Reading font (#101), which fills the same popup with its own pinned rows: Follow
     interface (drawn in the interface font) and Serif (drawn in the platform serif), then the current family when it
     is one. The Reading font applies to the article's body only; the sample in the Reading card shows it. The caller supplies the pinned rows; the popup supplies the search, the list, the keys and
     the states. Rules (docs/design.md, Font picker): 300 wide at least and as wide as the control; at most 360 high,
     the list scrolls inside; rows 32 high; every family is drawn in its own face; the pinned rows ("System font" and
     the current choice) sit above a hairline and are searched with the rest; the keyboard highlight starts on the
     current choice and moves with Up and Down; the current choice has a check; a match is not marked inside a name,
     so the preview stays true. The popup takes the room the window leaves, below the control or above it, whichever is larger, up to 360.
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     glass and the toolbar's title sits bare over the content (docs/design.md, Title bar).
     The bar above the window only switches the mockup.
     The toolbar's title lines up with the settings column. Width rule: a page is a column centered in the window, at
     most 600 wide (a form), 880 wide for the Devices table (from a 880 wide window; narrower, the stacked rows), 1040
     wide for AI in two columns (from a 1200 wide window; narrower, one column). The mockup measures the room next to
     the sidebar, so the rule holds at every window width, not only at size=wide.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min|wide. -->

<script>
const states=['appearance','font-open','font-filtered','font-empty','font-loading','reading-font','reading-font-open','ai','ai-configured','ai-edited','ai-invalid','ai-testing','ai-tested','ai-test-failed','fetching','edited','invalid','saved','opml','importing','imported','import-error','exported','devices','devices-local','revoke','loading','error'];
const query=new URLSearchParams(location.search);
const pick=(name,list,fallback)=>list.includes(query.get(name))?query.get(name):fallback;
const options={state:states,scheme:['light','dark'],lang:['en','zh-Hans'],size:['default','min','wide']};
const state=pick('state',states,'ai');
const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');
document.documentElement.dataset.scheme=scheme;
document.documentElement.lang=lang;
document.getElementById('window').classList.toggle('min',size==='min');
document.getElementById('window').classList.toggle('wide',size==='wide');
for(const [id,list] of Object.entries(options)){
  const select=document.getElementById(id);
  select.innerHTML=list.map(s=>`<option>${s}</option>`).join('');
  select.value={state,scheme,lang,size}[id];
  select.onchange=()=>{query.set(id,select.value);location.search=query};
}

const file='feeds.opml';
const busy=state==='importing';
let result='';
if(state==='importing')result=`<div class="status busy" role="status">${icon('loader','spin')}${t('importing',{file})}</div>`;
if(state==='imported')result=`<div class="result warn" role="status"><div class="head">${icon('triangle')}<span class="grow">${t('imported',{file,added:12,existing:3,failed:2})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div>
<ul aria-label="${copy.notAdded}"><li><span class="what">Gopher Weekly · <span class="mono-text">ftp://example.org/feed</span></span><span class="why">${copy.invalidUrl}</span></li>
<li><span class="what">${zh?'播客合集':'Podcasts'} · <span class="mono-text">https://example.com/podcast.xml</span></span><span class="why">${copy.invalidKind}</span></li></ul></div>`;
if(state==='import-error')result=`<div class="result error" role="alert"><div class="head">${icon('alert')}<span class="grow">${t('invalidOpml',{file:'notes.txt'})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div></div>`;
if(state==='exported')result=`<div class="result" role="status"><div class="head" style="color:var(--success)">${icon('check')}<span class="grow" style="color:var(--text)">${t('exported',{n:18,file:'oriel.opml'})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div></div>`;
const opml=`<p class="lead">${copy.opmlHelp}</p><div class="card">
<div class="row"><div class="device"><div class="text"><span class="label">${copy.importLabel}</span><p class="help">${copy.importHelp}</p></div><button class="button"${busy?' disabled':''}>${icon('upload')}${copy.import}</button></div>${result}</div>
<div class="row"><div class="device"><div class="text"><span class="label">${copy.exportLabel}</span><p class="help">${copy.exportHelp}</p></div><button class="button"${busy?' disabled':''}>${icon('download')}${copy.export}</button></div></div>
</div>`;

const sessions=[
  {client:'Oriel',platform:'macOS',glyph:'laptop',date:zh?'10月3日':'Oct 3',seen:copy.now,current:true},
  {client:'Oriel',platform:'Windows',glyph:'monitor',date:zh?'9月21日':'Sep 21',seen:t('hours',{n:3})},
  {client:'Safari',platform:'iPhone',glyph:'smartphone',date:zh?'8月30日':'Aug 30',seen:copy.yesterday},
  {client:'Chrome',platform:'Linux',glyph:'monitor',date:zh?'8月2日':'Aug 2',seen:zh?'6 天前':'6 days ago'},
  {client:'Firefox',platform:'Android',glyph:'smartphone',date:zh?'7月14日':'Jul 14',seen:zh?'3 周前':'3 weeks ago'},
];
const sname=s=>s.client==='Oriel'?'Oriel · '+s.platform:s.client+' · '+s.platform;
const revokeBtn=s=>`<button class="button small danger" aria-label="${t('revokeTitle',{name:sname(s)}).replace(/[?？]$/,'')}">${copy.revoke}</button>`;
const stack=sessions.map(s=>`<div class="row"><div class="device"><div class="glyph">${icon(s.glyph)}</div><div class="text"><div class="name">${sname(s)}${s.current?`<span class="badge">${copy.thisDevice}</span>`:''}</div><div class="when">${t('signedIn',{date:s.date,seen:s.seen})}</div></div>${s.current?'':revokeBtn(s)}</div></div>`).join('');
const table=`<div role="table" aria-label="${copy.devices}"><div role="row" class="head"><span role="columnheader">${copy.colDevice}</span><span role="columnheader">${copy.colPlatform}</span><span role="columnheader">${copy.colSigned}</span><span role="columnheader" class="last">${copy.colLastUsed}</span><span role="columnheader"><span class="sr">${copy.revoke}</span></span></div>`+
  sessions.map(s=>`<div role="row"><div role="cell" class="device"><div class="glyph">${icon(s.glyph)}</div><div class="text"><div class="name">${s.client}${s.current?`<span class="badge">${copy.thisDevice}</span>`:''}</div></div></div><span role="cell" class="cell-muted">${s.platform}</span><span role="cell" class="cell-muted">${s.date}</span><span role="cell" class="last">${s.seen}</span><span role="cell" class="act">${s.current?'':revokeBtn(s)}</span></div>`).join('')+'</div>';
const devices=remote?`<p class="lead">${copy.devicesHelp}</p><div class="card"><div class="dstack">${stack}</div><div class="dtable">${table}</div></div>`:
`<div class="card"><div class="row note">${icon('laptop')}<span>${copy.localDevices}</span></div></div>`;

const aiSet=state!=='ai', aiDirty=state==='ai-edited'||state==='ai-invalid';
const aiField=(label,value,placeholder,cls='')=>`<div class="field${cls}" role="textbox" aria-label="${label}"${cls.includes('invalid')?' aria-invalid="true"':''}>${value||`<span class="placeholder">${placeholder}</span>`}</div>`;
const endpoint=state==='ai-invalid'?'api.openai.com/v1':state==='ai-edited'?'http://localhost:11434/v1':aiSet?'https://api.openai.com/v1':'';
const modelName=state==='ai-edited'?'qwen3:8b':aiSet?'gpt-4o-mini':'';
let aiStatus='';
if(state==='ai-edited')aiStatus=`<div class="status busy">${copy.testFirst}</div>`;
if(state==='ai-testing')aiStatus=`<div class="status busy" role="status">${icon('loader','spin')}${copy.testing}</div>`;
if(state==='ai-tested')aiStatus=`<div class="status ok" role="status">${icon('check')}${t('tested',{model:'gpt-4o-mini-2024-07-18'})}</div>`;
if(state==='ai-test-failed')aiStatus=`<div class="status error" role="alert">${icon('alert')}${copy.aiUnauthorized}</div>`;
const prompt=(label,text)=>`<div class="row"><div class="label-row"><span class="label">${label}</span><button class="button small" disabled>${icon('rotateCcw')}${copy.reset}</button></div><div class="textarea" role="textbox" aria-multiline="true" aria-label="${label}">${text}</div></div>`;
const ai=`<p class="lead">${copy.aiLead}</p><div class="two"><div class="col"><h2 class="section-title">${copy.connection}</h2><div class="card">
<div class="row"><span class="label">${copy.endpoint}</span><p class="help">${copy.endpointHelp}</p><div class="control">${aiField(copy.endpoint,endpoint,copy.endpointPlaceholder,state==='ai-invalid'?' invalid':state==='ai'||state==='ai-edited'?' focused':'')}</div>${state==='ai-invalid'?`<div class="status error" role="alert">${icon('alert')}${copy.invalidAiBase}</div>`:''}</div>
<div class="row"><span class="label">${copy.model}</span><div class="control">${aiField(copy.model,modelName,copy.modelPlaceholder)}</div></div>
<div class="row"><div class="label-row"><span class="label">${copy.apiKey}</span><span class="badge${aiSet?'':' off'}">${aiSet?copy.keySet:copy.keyUnset}</span></div><p class="help">${copy.keyHelp}</p>
<div class="control">${aiField(copy.apiKey,'',aiSet?copy.keyReplace:copy.keyPlaceholder)}${aiSet?`<button class="button">${copy.removeKey}</button>`:''}</div></div>
<div class="row"><div class="device"><div class="text"><span class="label">${copy.language}</span><p class="help">${copy.languageHelp}</p></div>
<button class="select" aria-haspopup="listbox" aria-label="${copy.language}"><span>${copy.zhHans}</span>${icon('chevronDown')}</button></div></div>
<div class="row"><div class="actions">${aiStatus||'<span class="status"></span>'}<button class="button"${aiSet&&!aiDirty&&state!=='ai-testing'?'':' disabled'}>${icon('plug')}${copy.test}</button><button class="button${aiDirty?' primary':''}"${aiDirty?'':' disabled'}>${copy.save}</button></div></div>
</div></div>
<div class="col"><h2 class="section-title">${copy.prompts}</h2><div class="card">
${prompt(copy.promptSummary,'Summarize the article in {language} in three to five sentences. Reply with the summary only.')}
${prompt(copy.promptTranslate,'Translate the text into {language}. Keep the paragraphs and their order, and the title on the first line. Reply with the translation only.')}
<div class="row"><div class="actions"><p class="help status" style="display:block">${copy.promptHelp}</p><button class="button" disabled>${copy.save}</button></div></div>
</div></div></div>`;

let page;
if(state==='loading')page=`<div class="page skeleton" aria-busy="true"><div class="bar" style="width:60%"></div><div class="block"></div></div>`;
else if(state==='error')page=`<div class="empty" role="status"><div class="tile">${icon('wifiOff')}</div><h2>${copy.error}</h2><p>${copy.errorHint}</p><button class="button">${icon('refresh')}${copy.retry}</button></div>`;
else page=`<div class="page${group==='devices'&&remote?' list':group==='ai'?' split':''}">${{appearance,fetching,opml,ai,devices}[group]}</div>`;

let overlay='';
// Font picker. pinned: the rows the caller supplies, [name, face]; the current one has the check. families: the
// installed ones, which the picker sorts and searches. The Reading font passes Follow interface and Serif as pinned.
const picker=(pinned,current,families,query,loading,hl)=>{
  const q=query.toLowerCase(), hit=n=>!q||n.toLowerCase().includes(q);
  const pin=pinned.filter(([n])=>hit(n)), rest=loading?[]:families.filter(n=>n!==current&&hit(n));
  const opt=(n,face)=>`<button class="opt${n===hl?' hl':''}" role="option" aria-selected="${n===current}"${n===hl?' id="hl"':''}><span class="face" style="font-family:${face}">${n}</span>${n===current?icon('check')+`<span class="sr">, ${copy.fontCurrent}</span>`:''}</button>`;
  const total=pin.length+rest.length;
  let body=pin.map(([n,f])=>opt(n,f)).join('');
  if(pin.length&&(rest.length||loading))body+='<div class="rule" role="separator"></div>';
  if(loading)body+=`<div class="wait" role="status">${icon('loader','spin')}${copy.fontLoading}</div>`;
  body+=rest.map(n=>opt(n,`'${n}'`)).join('');
  if(!total)body=`<div class="none" role="status">${t('fontNone',{q:query})}</div>`;
  const count=loading?'':total===1?copy.fontCountOne:t('fontCount',{n:total});
  return `<div class="picker" id="picker"><div class="search">${icon('search')}<span class="typed${query?'':' placeholder'}">${query?query:copy.fontSearch}<i class="caret"></i></span></div>
<div class="list" role="listbox" aria-label="${copy.fontList}">${body}</div><span class="sr" role="status">${total?count:t('fontNone',{q:query})}</span></div>`;
};
if(fontOpen){
  const families=['Andale Mono','Arial','Arial Narrow','Baskerville','Big Caslon','Charter','Courier New','Didot','Futura','Georgia','Gill Sans','Helvetica Neue','Hiragino Sans','Hiragino Sans GB','Hoefler Text','Iowan Old Style','Lucida Sans Unicode','Menlo','Noto Sans','Noto Sans SC','Open Sans','Optima','Palatino','PingFang SC','Songti SC','Trebuchet MS','Verdana'];
  const query={'font-filtered':'sans','font-empty':'Fraktur'}[state]||'';
  overlay=picker([[copy.systemFont,'inherit'],['Avenir Next',"'Avenir Next'"]],'Avenir Next',families,query,state==='font-loading',{'font-open':'Arial','font-filtered':'Hiragino Sans'}[state]);
}
if(readingOpen){
  const families=['Arial','Baskerville','Big Caslon','Charter','Didot','Futura','Georgia','Gill Sans','Helvetica Neue','Hiragino Mincho ProN','Hiragino Sans GB','Hoefler Text','Iowan Old Style','Menlo','Noto Serif','Noto Serif SC','Optima','Palatino','PingFang SC','Songti SC','Times New Roman','Verdana'];
  overlay=picker([[copy.followInterface,'inherit'],[copy.serif,serifFace]],copy.serif,families,'',false,'Charter');
}
if(state==='revoke')overlay=`<div class="backdrop"><div class="alert" role="alertdialog" aria-labelledby="at" aria-describedby="ab"><h2 id="at">${t('revokeTitle',{name:'Safari · iPhone'})}</h2><p id="ab">${copy.revokeBody}</p><div class="buttons"><button class="button">${copy.cancel}</button><button class="button default">${copy.revokeConfirm}</button></div></div></div>`;
document.getElementById('app').innerHTML=`${sidebar}<section class="main"><div class="toolbar"><h1>${copy[group]}</h1></div><div class="scroll">${page}</div></section>${overlay}`;
if(fontOpen||readingOpen){
  // Anchor under the control, right edges aligned; use the larger side when 360 does not fit.
  const win=document.getElementById('window').getBoundingClientRect(), box=document.getElementById('picker');
  const at=document.querySelector('.select.open').getBoundingClientRect();
  const w=Math.max(300,at.width), room=win.height-8-(at.bottom-win.top+4), roomUp=at.top-win.top-4-8, up=room<Math.min(box.offsetHeight,360)&&roomUp>room;
  box.style.width=w+'px';
  box.style.left=(at.right-win.left-w)+'px';
  box.style.maxHeight=Math.min(360,up?roomUp:room)+'px';
  box.style.top=(up?at.top-win.top-4-box.offsetHeight:at.bottom-win.top+4)+'px';
  document.getElementById('hl')?.scrollIntoView({block:'nearest'});
}
</script>
</html>
