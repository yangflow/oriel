<!doctype html>

<meta charset="utf-8">

<title>Settings screen</title>
<!-- Settings: they take the whole window. The timeline's sidebar gives way to the settings' own: "Back to the
     timeline" on top, then one item per group, and the server bar, which says whose settings these are. Opened from the
     gear button in the timeline's server bar or the app menu's "Settings…" (CmdOrCtrl+,); the back button and Escape
     return to the timeline where it was. Groups: Appearance (first; theme, interface language, interface font and the
     reading text and how each kind is viewed, kept on this device only, not on the server), Fetching (the RSSHub instances, an ordered list, and how long entries are
     kept), Import and export (OPML, and a dialog that imports from Miniflux or FreshRSS), AI (the endpoint for summaries and translations, and the global prompts), Devices
     (the sessions signed in to the server), Activity and storage (what is being fetched, how each subscription's recent
     fetches went, the database size and the Compact database action).
     Appearance is saved and applied as soon as a control is changed; it has no Save button. Colors are the Oriel palette of
     design/tokens.md; icons are Lucide (ISC License).
     States: appearance, fetching (one RSSHub instance), several (three instances: the first is the primary, the others
     take over in order), edited (the list changed, not saved), invalid (a line is not a valid address; nothing is sent), saved, opml,
     importing, imported (with failures), import-error, exported, backup (the Back up and restore block, after a backup was saved),
     restore-confirm (the alert before the data is replaced), restoring, restored, restore-failed (a file that is not a backup; the data is as it was), auto-off (Automatic backup switched off, nothing chosen yet),
     auto-on (on, a folder chosen, the last success), auto-failed (the last attempt failed: warning line, retried within the hour),
     auto-remote (a remote server: the folder is a text field), reader (the Import from Reader dialog, Miniflux: service,
     address, token), reader-freshrss (adds the user name; the credential is the API password), reader-invalid (the address
     is not http or https), reader-fetching (progress, Cancel), reader-preview (what was found, nothing added yet; Import),
     reader-writing, reader-done (what was added and what was left out), reader-failed (the server turned the credential
     down; Try again), devices (a remote server and its sessions),
     devices-local (this computer's server, no sessions), revoke (confirming a revocation), loading, error;
     activity (storage figures, one fetch under way, recent fetches with the newest attempt of each source),
     activity-open (one source expanded to its attempts, a failed one with its reason), activity-empty (nothing fetching,
     no attempts yet), vacuum-running (Compact database pressed: busy, cannot be pressed again), vacuum-done (finished,
     how much was freed), vacuum-failed (the reason, the button usable again),
     diagnostics-exported (Export diagnostics… finished, the file name), diagnostics-failed (the export did not work);
     ai (not set up), ai-configured (saved, the key only shown as set), ai-edited (changed, not saved; testing waits
     for the save), ai-invalid (the server refused the address), ai-preset (Ollama picked from the Preset row: address filled in, unsaved,
     model placeholder is that runtime's hint, key untouched), ai-local (the endpoint is on this computer, with the count of automatic requests today), ai-cap-reached (the daily cap of
     automatic requests is used up: a plain sentence under the caps), ai-testing, ai-tested (connected, model listed, context
     holds the limits), ai-tested-small (connected, but the model's context is too small for the limits: a hint, not a
     failure), ai-test-failed (key turned down), ai-model-missing (no model of that name), ai-unreachable (cannot connect),
     prompt-restored (Restore default on an edited summary prompt: the default is back in the box, unsaved, so Save is
     primary and that Restore default is dimmed; a toast says "Summary prompt restored to default" with Undo, which puts back
     the exact text that was there, and a close button; it closes by itself after 8 seconds);
     font-open (the Interface font picker open, the keyboard highlight on a row below the current choice),
     font-filtered ("sans" typed: the matches, the current choice still pinned on top if it matches),
     font-empty (nothing matches), font-loading (the family list is still being read);
     reading-font (the Reading card with Reading font set to Serif; the sample below is set in it),
     reading-font-open (the Reading font picker open from that row: Follow interface and Serif pinned),
     reading-cjk-off (the Reading card with Chinese typesetting off; on, the default, is the appearance state: the
     switch sits after Line spacing and the sample under it is set with the rules, in Simplified Chinese; the sample
     in English is plain either way);
     density (the Timeline card, between Reading and View as, with List density set to Compact; Comfortable, the
     default, is the appearance state; under it, Show an article once, a switch that is on by default, in every state);
     mark-read (the same card with Mark as read set to After staying: the Stay time row appears under it, 5 s chosen;
     When opened, the default, is the appearance state and has no Stay time row), mark-read-scroll (set to After
     scrolling past: the help names what scrolling does; no Stay time row; Never automatically has the same shape
     with its own help line, so it has no state of its own);
     viewers (the View as card with the choices changed from the defaults: Articles Compact, Videos List, Images Grid;
     in appearance every row is on its default, the first segment: List, Grid, Card, Wall).
     The font picker is a popup anchored under its control, right edges aligned: a search field, a hairline, then the
     list. It is reused by the Reading font (#101), which fills the same popup with its own pinned rows: Follow
     interface (drawn in the interface font) and Serif (drawn in the platform serif), then the current family when it
     is one. The Reading font applies to the article's body only; the sample in the Reading card shows it. The caller supplies the pinned rows; the popup supplies the search, the list, the keys and
     the states. Rules (docs/design.md, Font picker): 300 wide at least and as wide as the control; at most 360 high,
     the list scrolls inside; rows 32 high; every family is drawn in its own face; the pinned rows ("System font" and
     the current choice) sit above a hairline and are searched with the rest; the keyboard highlight starts on the
     current choice and moves with Up and Down; the current choice has a check; a match is not marked inside a name,
     so the preview stays true. The popup takes the room the window leaves, below the control or above it, whichever is larger, up to 360.
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     glass and the toolbar's title sits bare over the content (docs/design.md, Title bar).
     The bar above the window only switches the mockup.
     The toolbar's title lines up with the settings column. Width rule: a page is a column centered in the window, at
     most 600 wide (a form), 880 wide for the Devices table (from a 880 wide window; narrower, the stacked rows), 1040
     wide for AI in two columns (from a 1200 wide window; narrower, one column). The mockup measures the room next to
     the sidebar, so the rule holds at every window width, not only at size=wide.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min|wide. 
     Rules (after Fetching): the Rules card lists what happens to a new entry (star it, mark it read), one rule per row
     with an on/off switch and a menu (Edit..., Delete); Add rule... opens a dialog. The Muted keywords card under it is
     the global list, for every subscription, together with each subscription's own. Rules act once on entries that
     arrive later; muted keywords hide at any time.
     Rules states: rules (two cards), rules-empty (no rules yet), rule-menu (the row menu open), rule-add (the dialog,
     nothing filled in), rule-invalid (Save pressed with nothing filled in: both lines name the problem), rule-edit (the
     dialog on an existing rule), rule-deleted (the row is gone, a toast with Undo), muted-edited (the global list
     changed, not saved, the count follows the typing), muted-invalid (the server refused: too many lines), rules-error
     (the page did not load).
-->
<style>
:root { color-scheme:light; --stage:#dedad2; --stage-text:#4f4a42;
  --chrome:#37332e; --chrome-ink:255,248,235; --chrome-text:#ece7dd; --chrome-text2:#cdc7bb; --chrome-muted:#a49e91; --chrome-accent:#7cc9bb; --chrome-success:#8ab997;
  --background:#fdfcfa; --surface:#f6f3ee; --raised:#ffffff; --track:#ece8e0; --disabled:#b3ada1;
  --text:#25221e; --text2:#58534a; --muted:#736d62;
  --ink:37,34,30; --hover:rgba(var(--ink),.03); --pressed:rgba(var(--ink),.05); --chosen:rgba(var(--ink),.065);
  --border:rgba(var(--ink),.075); --edge-line:rgba(var(--ink),.12);
  --accent:#2a6d65; --accent-hover:#225a54; --accent-text:#ffffff; --accent-soft:rgba(42,109,101,.09); --focus:rgba(42,109,101,.7);
  --danger:#b4533c; --danger-soft:rgba(180,83,60,.09); --warning:#9a7222; --warning-soft:rgba(154,114,34,.10); --success:#4c7c59;
  --segment-on:#ffffff; --segment-shadow:0 1px 2px rgba(var(--ink),.12), 0 0 0 .5px rgba(var(--ink),.08);
  --scrim:rgba(28,24,18,.32); --sheet-shadow:0 0 0 .5px rgba(var(--ink),.12), 0 20px 50px rgba(28,24,18,.25);
  --t:140ms ease-out }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0b0c0c; --stage-text:#8a918f;
  --chrome:#1a2422; --chrome-ink:235,248,244; --chrome-text:#e8eeec; --chrome-text2:#cbd5d2; --chrome-muted:#93a39f;
  --background:#171918; --surface:#1d1f1e; --raised:#252827; --track:#2c2f2e; --disabled:#565b59;
  --text:#dde1df; --text2:#aab0ae; --muted:#8a918f;
  --ink:234,240,238; --hover:rgba(var(--ink),.04); --pressed:rgba(var(--ink),.06); --chosen:rgba(var(--ink),.08);
  --accent:#78beb1; --accent-hover:#8ccbbf; --accent-text:#10241f; --accent-soft:rgba(120,190,177,.12); --focus:rgba(120,190,177,.7);
  --danger:#e0897a; --danger-soft:rgba(224,137,122,.13); --warning:#d6aa55; --warning-soft:rgba(214,170,85,.13); --success:#8ab997;
  --segment-on:rgba(var(--ink),.12); --segment-shadow:none;
  --sheet-shadow:0 0 0 1px rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.55) }
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
body { margin:0; padding:24px; font:13px/1.5 system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
:root:lang(zh-Hans) body { line-height:1.65 }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default; transition:background-color var(--t), color var(--t), opacity var(--t) }
button:focus-visible { outline:2px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

.window { position:relative; width:960px; height:640px; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; background:var(--background); box-shadow:0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px rgba(28,24,18,.28) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.65) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }

/* Sidebar: the settings' own ink pane, in the place of the timeline's. It has its own light-on-dark roles, the same
   in both schemes: a glass pane floating 8 from the window's edges, radius 14. */
aside { width:216px; flex:none; margin:8px 0 8px 8px; padding-top:40px; display:flex; flex-direction:column; border-radius:14px; background:var(--chrome);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 .5px rgba(0,0,0,.35), 0 6px 24px rgba(28,24,18,.12);
  --text:var(--chrome-text); --muted:var(--chrome-muted); --accent:var(--chrome-accent); --success:var(--chrome-success);
  --hover:rgba(var(--chrome-ink),.055); --pressed:rgba(var(--chrome-ink),.085); --chosen:rgba(var(--chrome-ink),.12) }
:root[data-scheme=dark] aside { box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 .5px rgba(0,0,0,.7) }
.min aside { width:184px }
aside .top { height:36px; flex:none; display:flex; align-items:center; padding:0 8px }
.back { height:28px; display:flex; align-items:center; gap:2px; padding:0 8px 0 4px; border-radius:8px; color:var(--muted); min-width:0 }
.back span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.back:hover { background:var(--hover); color:var(--text) }
.back:active { background:var(--pressed) }
.nav { flex:1; overflow-y:auto; padding:6px 8px }
.section { margin:14px 10px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
:root:lang(zh-Hans) .section { font-size:12px; letter-spacing:.02em }
.item { width:100%; height:30px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:8px; color:var(--chrome-text2); text-align:left; transition:background-color var(--t), color var(--t) }
.item:hover { background:var(--hover) }
.item:active { background:var(--pressed) }
.item.chosen { background:var(--chosen); color:var(--text) }
.item.chosen .name { font-weight:500 }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.item svg.icon { color:var(--muted) }
.item:hover svg.icon { color:var(--chrome-text2) }
.item.chosen svg.icon { color:var(--accent) }
.server { flex:none; width:100%; display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; color:var(--muted); font-size:12px; letter-spacing:.01em; cursor:default }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

/* Toolbar: no bar, the title bare over the content, which fades under it */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.main::before { content:""; position:absolute; top:0; left:0; right:0; height:52px; background:var(--background); z-index:1; pointer-events:none }
.main::after { content:""; position:absolute; top:52px; left:0; right:0; height:.5px; background:var(--border); opacity:0; transition:opacity 120ms ease-out; z-index:1; pointer-events:none }
.main.scrolled::after { opacity:1 }
.main { container-type:inline-size; --pad:32px }
.toolbar { --col:600px }
.min .main { --pad:20px }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; display:flex; align-items:center; gap:8px; padding:0 max(12px,calc((100% - var(--col))/2 + var(--pad))) 0 max(var(--pad),calc((100% - var(--col))/2 + var(--pad))) }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.005em; white-space:nowrap }
.scroll { flex:1; overflow-y:auto; padding-top:52px }

/* Settings: groups are tinted Surface cards, rows inside them parted by an inset hairline; fields and controls sit
   on the cards in Raised and Track. */
.page { max-width:600px; margin:0 auto; padding:12px 32px 48px }
.min .page { padding:12px 20px 40px }
/* Width rule: a list page widens to hold its table, a long form splits in two. Measured on the room beside the sidebar. */
.dtable { display:none }
.two { display:block }
.two .col + .col { margin-top:28px }
@container (min-width:656px) { .main:has(.page.list) .toolbar { --col:880px } .page.list { max-width:880px } .page.list .dstack { display:none } .page.list .dtable { display:block } }
@container (min-width:976px) { .main:has(.page.split) .toolbar { --col:1040px } .page.split { max-width:1040px } .page.split .lead { max-width:600px }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start } .two .col + .col { margin-top:0 } .page.split .textarea { min-height:120px } }
.lead { margin:0 0 20px; color:var(--muted) }
.card { border-radius:12px; background:var(--surface) }
.row { position:relative; padding:16px 20px }
.row + .row::before { content:""; position:absolute; top:0; left:20px; right:20px; border-top:1px solid var(--border) }
.card + .card, .card + .section-title { margin-top:28px }
.section-title { margin:0 0 8px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
:root:lang(zh-Hans) .section-title { font-size:12px; letter-spacing:.02em }
.label { display:block; font-weight:500 }
.help { margin:4px 0 0; font-size:12px; color:var(--muted) }
.help code, .mono-text { font:12px ui-monospace,Menlo,Consolas,monospace }
.control { display:flex; gap:8px; margin-top:12px; align-items:center }
.field, .textarea { background:var(--raised); box-shadow:inset 0 0 0 .5px var(--edge-line); color:var(--text); transition:box-shadow var(--t) }
.field { flex:1; min-width:0; height:32px; display:flex; align-items:center; padding:0 10px; border-radius:8px; font:13px ui-monospace,Menlo,Consolas,monospace }
.field.short { flex:none; width:64px }
.field.focused, .textarea.focused { box-shadow:0 0 0 2px var(--focus) }
.field.invalid { box-shadow:inset 0 0 0 1.5px var(--danger) }
.field .placeholder { color:var(--muted) }
.textarea .line { display:block; min-height:1.5em; white-space:pre-wrap; overflow-wrap:anywhere } .textarea .line.bad { color:var(--danger) } .textarea.invalid { box-shadow:inset 0 0 0 1.5px var(--danger) }
.textarea { display:block; margin-top:12px; min-height:76px; padding:7px 10px; border-radius:8px; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace }
.select { height:32px; display:flex; align-items:center; gap:8px; padding:0 8px 0 12px; border-radius:8px; background:var(--track); min-width:160px }
.select:hover { background:color-mix(in srgb,var(--track),rgba(var(--ink),.06)) }
.select span { flex:1; text-align:left }
.select svg.icon { width:14px; height:14px; color:var(--muted) }
.select.open { background:var(--chosen) }
/* Font picker: a popup on Raised over the page, anchored under its control. Search on top, a hairline, the list. */
.picker { position:absolute; z-index:4; width:300px; max-height:360px; display:flex; flex-direction:column; border-radius:12px; background:var(--raised); box-shadow:var(--sheet-shadow) }
.picker .search { flex:none; display:flex; align-items:center; gap:8px; margin:8px 8px 0; height:32px; padding:0 10px; border-radius:8px; background:var(--surface); box-shadow:0 0 0 2px var(--focus); color:var(--muted) }
.picker .search svg.icon { width:15px; height:15px }
.picker .search .typed { flex:1; min-width:0; color:var(--text); white-space:nowrap; overflow:hidden }
.picker .search .typed.placeholder { color:var(--muted) }
.picker .search .caret { display:inline-block; width:1px; height:15px; margin-left:1px; vertical-align:-3px; background:var(--text) }
.picker .search .typed.placeholder .caret { margin:0 -1px 0 0 }
.picker .list { flex:1; min-height:0; overflow-y:auto; padding:6px 8px 8px; margin-top:6px }
.picker .opt { width:100%; height:32px; display:flex; align-items:center; gap:8px; padding:0 8px 0 10px; border-radius:6px; text-align:left; color:var(--text); font-size:13px }
.picker .opt:hover { background:var(--hover) }
.picker .opt.hl { background:var(--chosen) }
.picker .opt .face { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.picker .opt svg.icon { width:14px; height:14px; color:var(--accent) }
.picker .rule { height:1px; margin:6px 2px; background:var(--border) }
.picker .none, .picker .wait { display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; padding:12px; text-align:center; color:var(--muted) }
.picker .wait svg.icon { width:14px; height:14px }
.segmented { display:inline-flex; flex:none; gap:2px; padding:3px; border-radius:9px; background:var(--track) }
.segmented button { height:26px; padding:0 12px; border-radius:7px; color:var(--text2); white-space:nowrap }
.segmented button:hover { color:var(--text) }
.segmented button.on { background:var(--segment-on); box-shadow:var(--segment-shadow); color:var(--text); font-weight:500 }
.status { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px }
.status svg.icon { width:14px; height:14px }
.status.error { color:var(--danger) }
.status.ok { color:var(--success) }
.status.busy { color:var(--muted) }
.status.warn { color:var(--text) } .status.warn svg.icon { color:var(--warning) }
.checks { display:flex; flex-direction:column; gap:2px; margin-top:8px } .checks .status { margin-top:0 }
.presets { display:flex; align-items:center; gap:8px } .presets .label { margin-right:4px }
.button.small.on { background:var(--accent-soft); color:var(--accent) }
.pair { display:flex; gap:12px } .pair > div { flex:1; min-width:0 }
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border-radius:8px; background:var(--track); color:var(--text); font-weight:500 }
.button:hover { background:color-mix(in srgb,var(--track),rgba(var(--ink),.06)) }
.button:active { background:color-mix(in srgb,var(--track),rgba(var(--ink),.1)) }
.button.primary, .alert .button.default { background:var(--accent); color:var(--accent-text) }
.button.primary:hover, .alert .button.default:hover { background:var(--accent-hover) }
.button.danger { background:none; color:var(--danger); padding:0 8px }
.button.danger:hover { background:var(--danger-soft) }
.button.danger:active { background:color-mix(in srgb,var(--danger-soft),rgba(var(--ink),.05)) }
.button.danger.small { padding:0 10px }
.button.small { height:26px; padding:0 10px; font-size:12px }
.button svg.icon { width:14px; height:14px }
.button:disabled { background:rgba(var(--ink),.04); color:var(--disabled); font-weight:400 }
.result { margin-top:12px; padding:10px 12px; border-radius:8px; background:rgba(var(--ink),.045); font-size:12px }
.result.warn { background:var(--warning-soft) }
.result.error { background:var(--danger-soft); color:var(--text) }
.result .head { display:flex; gap:8px; align-items:flex-start }
.result .head svg.icon { width:14px; height:14px; margin-top:2px; flex:none }
.result.error .head svg.icon { color:var(--danger) }
.result.warn .head svg.icon { color:var(--warning) }
.result .head .grow { flex:1 }
.result ul { margin:8px 0 0; padding:0 0 0 22px; list-style:none }
.result li { display:flex; gap:8px; padding:3px 0; min-width:0 }
.result li .what { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result li .why { color:var(--text2); white-space:nowrap }
.result .close { width:20px; height:20px; display:grid; place-items:center; border-radius:5px; color:var(--muted) }
.result .close:hover { background:var(--hover); color:var(--text) }
.result .close svg.icon { width:13px; height:13px; margin:0 }
/* Hit area: a control drawn under 24 keeps its look; an invisible 24 by 24 minimum target surrounds it (docs/design.md, Accessibility). */

// installed ones, which the picker sorts and searches. The Reading font passes Follow interface and Serif as pinned.
const picker=(pinned,current,families,query,loading,hl)=>{
  const q=query.toLowerCase(), hit=n=>!q||n.toLowerCase().includes(q);
  const pin=pinned.filter(([n])=>hit(n)), rest=loading?[]:families.filter(n=>n!==current&&hit(n));
  const opt=(n,face)=>`<button class="opt${n===hl?' hl':''}" role="option" aria-selected="${n===current}"${n===hl?' id="hl"':''}><span class="face" style="font-family:${face}">${n}</span>${n===current?icon('check')+`<span class="sr">, ${copy.fontCurrent}</span>`:''}</button>`;
  const total=pin.length+rest.length;
  let body=pin.map(([n,f])=>opt(n,f)).join('');
  if(pin.length&&(rest.length||loading))body+='<div class="rule" role="separator"></div>';
  if(loading)body+=`<div class="wait" role="status">${icon('loader','spin')}${copy.fontLoading}</div>`;
  body+=rest.map(n=>opt(n,`'${n}'`)).join('');
  if(!total)body=`<div class="none" role="status">${t('fontNone',{q:query})}</div>`;
  const count=loading?'':total===1?copy.fontCountOne:t('fontCount',{n:total});
  return `<div class="picker" id="picker"><div class="search">${icon('search')}<span class="typed${query?'':' placeholder'}">${query?query:copy.fontSearch}<i class="caret"></i></span></div>
<div class="list" role="listbox" aria-label="${copy.fontList}">${body}</div><span class="sr" role="status">${total?count:t('fontNone',{q:query})}</span></div>`;
};

    overlay=dlg(`<div class="result error" role="alert" style="margin:0 0 12px"><div class="head">${icon('alert')}<span class="grow">${copy.readerErrUnauthorized}</span></div></div>`,
      `<button class="button">${copy.readerClose}</button><button class="button primary">${copy.readerTryAgain}</button>`);
  }
}
const toast=state==='rule-deleted'?`<div class="toast" role="status">${icon('trash')}<span class="msg">${copy.ruleDeleted}</span><button class="act">${copy.undo}</button><button class="x" aria-label="${copy.dismiss}">${icon('x')}</button></div>`:state==='prompt-restored'?`<div class="toast" role="status">${icon('rotateCcw')}<span class="msg">${t('promptRestored',{name:copy.promptSummary})}</span><button class="act">${copy.undo}</button><button class="x" aria-label="${copy.dismiss}">${icon('x')}</button></div>`:'';
document.getElementById('app').innerHTML=`${sidebar}<section class="main"><div class="toolbar"><h1>${copy[group]}</h1></div><div class="scroll">${page}</div>${toast}</section>${overlay}`;
if(fontOpen||readingOpen){
  // Anchor under the control, right edges aligned; use the larger side when 360 does not fit.
  const win=document.getElementById('window').getBoundingClientRect(), box=document.getElementById('picker');
  const at=document.querySelector('.select.open').getBoundingClientRect();
  const w=Math.max(300,at.width), room=win.height-8-(at.bottom-win.top+4), roomUp=at.top-win.top-4-8, up=room<Math.min(box.offsetHeight,360)&&roomUp>room;
  box.style.width=w+'px';
  box.style.left=(at.right-win.left-w)+'px';
  box.style.maxHeight=Math.min(360,up?roomUp:room)+'px';
  box.style.top=(up?at.top-win.top-4-box.offsetHeight:at.bottom-win.top+4)+'px';
  document.getElementById('hl')?.scrollIntoView({block:'nearest'});
}
if(state==='rule-menu'){
  const win=document.getElementById('window').getBoundingClientRect(), at=document.getElementById('more').getBoundingClientRect(), m=document.getElementById('menu');
  m.style.left=(at.right-win.left-m.offsetWidth)+'px'; m.style.top=(at.bottom-win.top+4)+'px';
}
if(mEdited){document.querySelector('.page').style.paddingBottom='200px';const sc=document.querySelector('.scroll');sc.scrollTop+=document.getElementById('muted').getBoundingClientRect().top-sc.getBoundingClientRect().top-60}
if(viewed||dense||state.startsWith('mark-read')){document.querySelector('.page').style.paddingBottom='200px';const sc=document.querySelector('.scroll');sc.scrollTop+=document.getElementById(viewed?'view-as':'timeline').getBoundingClientRect().top-sc.getBoundingClientRect().top-60}
{const sc=document.querySelector('.scroll'),mn=document.querySelector('.main');if(sc&&mn){const bar=()=>mn.classList.toggle('scrolled',sc.scrollTop>0);sc.addEventListener('scroll',bar);bar()}}
</script>
</html>
