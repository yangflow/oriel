<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings screen</title>
<!-- Settings: they take the whole window. The timeline's sidebar gives way to the settings' own: "Back to the
     timeline" on top, then one item per group, and the server bar, which says whose settings these are. Opened from the
     gear button in the timeline's server bar or the app menu's "Settings…" (CmdOrCtrl+,); the back button and Escape
     return to the timeline where it was. Groups: Fetching (the RSSHub instance and how long entries are kept), Import
     and export (OPML), AI (the endpoint for summaries and translations, and the global prompts), Devices (the
     sessions signed in to the server).
     Language and appearance follow the system and are not settings. Colors are the Oriel palette of
     design/tokens.md; icons are Lucide (ISC License).
     States: fetching, edited (the instance changed, not saved), invalid (the server refused it), saved, opml,
     importing, imported (with failures), import-error, exported, devices (a remote server and its sessions),
     devices-local (this computer's server, no sessions), revoke (confirming a revocation), loading, error;
     ai (not set up), ai-configured (saved, the key only shown as set), ai-edited (changed, not saved; testing waits
     for the save), ai-invalid (the server refused the address), ai-testing, ai-tested, ai-test-failed.
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     Liquid Glass and the toolbar's controls are glass capsules over the content (docs/design.md, Title bar).
     The bar above the window only switches the mockup.
     The toolbar's title lines up with the settings column (size=wide).
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min|wide. -->
<style>

:root { color-scheme:light; --stage:#e7e5e4; --stage-text:#57534e }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0c0a09; --stage-text:#a8a29e }
:root { --background:#fbfaf7; --surface:#f2f0eb; --surface-hover:#e9e6df; --surface-pressed:#dfdbd2; --border:#dcd7cd; --text:#1f1d1a; --muted:#6f6a64; --accent:#0f766e; --accent-hover:#115e59; --accent-text:#ffffff; --accent-soft:#e3efeb; --danger:#c2410c; --danger-soft:#fbece4; --warning:#a16207; --warning-soft:#f8f0dc; --success:#15803d; --focus:rgba(15,118,110,.5); --star:#a16207 }
:root[data-scheme=dark] { --background:#161513; --surface:#25231f; --surface-hover:#2f2c28; --surface-pressed:#3a3732; --border:#3d3933; --text:#ede9e3; --muted:#a8a29e; --accent:#4fbfad; --accent-hover:#6dd0c0; --accent-text:#0b2522; --accent-soft:#1f302c; --danger:#fb923c; --danger-soft:#3a2418; --warning:#facc15; --warning-soft:#35301a; --success:#4ade80; --focus:rgba(79,191,173,.5); --star:#facc15 }
* { box-sizing:border-box }
body { margin:0; padding:24px; font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default }
button:focus-visible { outline:3px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

.window { position:relative; width:960px; height:640px; border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; background:var(--background) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }

/* Sidebar */
aside { width:212px; flex:none; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border) }
.min aside { width:184px }
.nav { flex:1; overflow-y:auto; padding:8px }
.section { margin:12px 8px 4px; font-size:11px; font-weight:600; color:var(--muted) }
.item { width:100%; height:28px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; color:var(--text); text-align:left }
.item:hover { background:var(--surface-hover) }
.item.chosen { background:var(--surface-pressed) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server { flex:none; width:100%; text-align:left; display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-top:1px solid var(--border); color:var(--muted); font-size:12px }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

/* Toolbar */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.toolbar { flex:none; height:48px; display:flex; align-items:center; gap:8px; padding:0 max(12px,calc((100% - 600px)/2 + 32px)) 0 max(20px,calc((100% - 600px)/2 + 32px)); border-bottom:1px solid var(--border) }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; white-space:nowrap }
.spacer { flex:1 }

/* Settings */
aside .top { height:48px; flex:none; display:flex; align-items:center; padding:0 8px; border-bottom:1px solid var(--border) }
.item svg.icon { color:var(--muted) }
.item.chosen svg.icon { color:var(--text) }
div.server { cursor:default }
.back { height:28px; display:flex; align-items:center; gap:2px; padding:0 8px 0 4px; border-radius:6px; color:var(--muted); min-width:0 }
.back span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.back:hover { background:var(--surface-hover); color:var(--text) }
.scroll { flex:1; overflow-y:auto }
.page { max-width:600px; margin:0 auto; padding:24px 32px 48px }
.min .page { padding:20px 20px 40px }
.lead { margin:0 0 16px; color:var(--muted) }
.card { border:1px solid var(--border); border-radius:10px; background:var(--background) }
.row { padding:14px 16px }
.row + .row { border-top:1px solid var(--border) }
.label { display:block; font-weight:500 }
.help { margin:2px 0 0; font-size:12px; color:var(--muted) }
.help code, .mono-text { font:12px ui-monospace,Menlo,Consolas,monospace }
.control { display:flex; gap:8px; margin-top:10px; align-items:center }
.field { flex:1; min-width:0; height:32px; display:flex; align-items:center; padding:0 10px; border:1px solid var(--border); border-radius:8px; background:var(--background); font:13px ui-monospace,Menlo,Consolas,monospace; color:var(--text) }
.field.focused { border-color:var(--accent); box-shadow:0 0 0 3px var(--focus) }
.field.invalid { border-color:var(--danger) }
.field .placeholder { color:var(--muted) }
.select { height:32px; display:flex; align-items:center; gap:8px; padding:0 8px 0 10px; border:1px solid var(--border); border-radius:8px; background:var(--background); min-width:160px }
.select span { flex:1; text-align:left }
.select svg.icon { width:14px; height:14px; color:var(--muted) }
.status { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px }
.status svg.icon { width:14px; height:14px }
.status.error { color:var(--danger) }
.status.ok { color:var(--success) }
.status.busy { color:var(--muted) }
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border:1px solid var(--border); border-radius:8px; background:var(--background); color:var(--text) }
.button:hover { background:var(--surface-hover) }
.button:disabled { opacity:.45; background:var(--background) }
.button.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-text); font-weight:500 }
.button.danger { color:var(--danger) }
.button.small { height:26px; padding:0 10px; font-size:12px }
.button svg.icon { width:15px; height:15px }
.result { margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--surface); font-size:12.5px }
.result.warn { background:var(--warning-soft) }
.result.error { background:var(--danger-soft); color:var(--danger) }
.result .head { display:flex; gap:8px; align-items:flex-start }
.result .head svg.icon { width:14px; height:14px; margin-top:2px; flex:none }
.result.warn .head svg.icon { color:var(--warning) }
.result .head .grow { flex:1 }
.result ul { margin:8px 0 0; padding:0 0 0 22px; list-style:none }
.result li { display:flex; gap:8px; padding:3px 0; min-width:0 }
.result li .what { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.result li .why { color:var(--muted); white-space:nowrap }
.result .close { width:20px; height:20px; display:grid; place-items:center; border-radius:5px; color:var(--muted) }
.result .close svg.icon { width:13px; height:13px; margin:0 }
.device { display:flex; align-items:center; gap:12px }
.device .glyph { width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:8px; background:var(--surface); color:var(--muted) }
.device .text { flex:1; min-width:0 }
.device .name { display:flex; align-items:center; gap:6px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.device .when { font-size:12px; color:var(--muted) }
.badge { height:18px; display:inline-flex; align-items:center; padding:0 6px; border-radius:9px; font-size:11px; font-weight:500; background:var(--accent-soft); color:var(--accent) }
.note { display:flex; gap:10px; align-items:flex-start; color:var(--muted) }
.note svg.icon { margin-top:1px }
.skeleton .bar { height:12px; border-radius:6px; background:var(--surface); margin:10px 0 }
.skeleton .block { height:160px; border-radius:10px; background:var(--surface); margin-top:16px }
.empty { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center }
.tile { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; background:var(--danger-soft); color:var(--danger) }
.tile svg.icon { width:24px; height:24px; stroke-width:1.5 }
.empty h2 { margin:0; font-size:15px; font-weight:600 }
.empty p { margin:-4px 0 0; max-width:320px; color:var(--muted) }
.spin { animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
.backdrop { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.28) }
.alert { width:360px; padding:20px; border:1px solid var(--border); border-radius:12px; background:var(--background); box-shadow:0 12px 32px rgba(0,0,0,.18) }
.alert h2 { margin:0; font-size:15px; font-weight:600 }
.alert p { margin:8px 0 0; color:var(--muted) }
.alert .buttons { display:flex; justify-content:flex-end; gap:8px; margin-top:20px }
.badge.off { background:var(--surface); color:var(--muted) }
.textarea { display:block; margin-top:10px; min-height:76px; padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--background); font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--text) }
.textarea.focused { border-color:var(--accent); box-shadow:0 0 0 3px var(--focus) }
.label-row { display:flex; align-items:center; gap:8px }
.label-row .label { flex:1 }
.actions { display:flex; align-items:center; gap:8px }
.actions .status { flex:1; margin:0; min-width:0 }
.card + .card, .card + .section-title { margin-top:20px }
.section-title { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--muted) }
.alert .button.default { border-color:var(--accent); background:var(--accent); color:var(--accent-text); font-weight:500 }
/* Window chrome, as macOS 26 draws it: no title bar, the window buttons over the sidebar's top; the sidebar a pane
   of Liquid Glass floating 8 from the window's edges; the toolbar no bar, its controls capsules of glass floating
   over the content, which fades under them (the soft scroll edge). */
:root { --glass:color-mix(in srgb,var(--surface) 72%,transparent); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.8), inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 .5px rgba(0,0,0,.13); --edge:color-mix(in srgb,var(--background) 85%,transparent) }
:root[data-scheme=dark] { --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.11), 0 0 0 .5px rgba(0,0,0,.6) }
.window { position:relative; border:0; border-radius:16px; box-shadow:0 0 0 .5px rgba(0,0,0,.22), 0 24px 64px rgba(0,0,0,.22) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 24px 64px rgba(0,0,0,.6) }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }
aside, .toolbar .segmented, .toolbar .search, .toolbar > .tool, .toolbar .group, .toolbar .back, .toolbar .ghost { background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6); box-shadow:var(--glass-rim) }
aside { margin:8px 0 8px 8px; padding-top:40px; border:0; border-radius:16px }
.server-bar { border-top:0 }
aside .top { height:36px; border-bottom:0 }
.main::after { content:""; position:absolute; top:0; left:0; right:0; height:62px; background:linear-gradient(var(--edge),transparent); pointer-events:none; z-index:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; border-bottom:0 }
.toolbar ~ .scroll { padding-top:52px }
.toolbar ~ .hint ~ .scroll { padding-top:0 }
.toolbar + .hint { margin:56px 12px 4px; padding:7px 14px; border:0; border-radius:10px }
.toolbar .segmented { height:32px; padding:3px; border-radius:16px }
.toolbar .segmented button { height:26px; padding:0 10px; border-radius:13px }
.toolbar .segmented button.on { background:var(--background); box-shadow:0 1px 3px rgba(0,0,0,.14) }
:root[data-scheme=dark] .toolbar .segmented button.on { background:var(--surface-pressed); box-shadow:none }
.toolbar .search { height:32px; padding:0 6px 0 12px; border:0; border-radius:16px }
.toolbar .search.focused { box-shadow:var(--glass-rim), 0 0 0 3px var(--focus) }
.toolbar .search.invalid { box-shadow:var(--glass-rim), inset 0 0 0 1.5px var(--warning) }
.toolbar > .tool { width:32px; height:32px; border-radius:16px }
.toolbar .group { flex:none; display:flex; align-items:center; height:32px; padding:0 2px; border-radius:16px }
.toolbar .group .tool { height:28px; border-radius:14px }
.toolbar .group + .group { margin-left:8px }
.toolbar .back { height:32px; padding:0 12px 0 6px; border-radius:16px; color:var(--text) }
.toolbar .ghost { height:32px; border-radius:16px }
/* One look for each state (docs/design.md, States). Chosen in navigation (a kind, a subscription, a settings
   group): the soft accent fill, the icon in Accent, the name in Text at 500. Chosen in a control (a segment): a
   raised face. The keyboard's place: the focus ring. Counts: 11, 500, tabular. Disabled: a neutral face with
   TextMuted, never faded. Chinese text runs taller: 1.6 for body text instead of 1.45. */
:root { --chosen:rgba(15,118,110,.12) }
:root[data-scheme=dark] { --chosen:rgba(79,191,173,.2) }
.item.chosen { background:var(--chosen); color:var(--text) }
.item.chosen .name { font-weight:500 }
.item.chosen svg.icon { color:var(--accent) }
.item .count, .count { font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--muted) }
.item.chosen .count { color:var(--accent) }
.button:disabled, .button[disabled] { opacity:1; border-color:var(--border); background:var(--surface); color:var(--muted); font-weight:inherit; box-shadow:none }
:root:lang(zh-Hans) body { line-height:1.6 }
.segmented button.on, .kinds button.on, .note .segmented button.on { background:var(--background); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--border) }
:root[data-scheme=dark] .segmented button.on, :root[data-scheme=dark] .kinds button.on, :root[data-scheme=dark] .note .segmented button.on { background:var(--surface-pressed); box-shadow:none }
.note .segmented { background:var(--surface) }
/* Settings spacing: the page starts at 32, rows breathe at 16 by 20, help sits 4 below its label and the control
   12 below, cards and section titles are 28 apart. Fields and text areas share one fill, Surface, Background when
   focused. */
.page { padding-top:32px }
.row { padding:16px 20px }
.lead { margin-bottom:20px }
.help { margin-top:4px }
.control, .textarea { margin-top:12px }
.card + .card, .card + .section-title { margin-top:28px }
.field, .textarea { background:var(--surface) }
.field.focused, .textarea.focused { background:var(--background) }
</style>
<div class="switcher" aria-hidden="true">
  <label>state <select id="state"></select></label>
  <label>scheme <select id="scheme"></select></label>
  <label>lang <select id="lang"></select></label>
  <label>size <select id="size"></select></label>
</div>
<div class="window" id="window"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="body" id="app"></div></div>
<script>
const states=['ai','ai-configured','ai-edited','ai-invalid','ai-testing','ai-tested','ai-test-failed','fetching','edited','invalid','saved','opml','importing','imported','import-error','exported','devices','devices-local','revoke','loading','error'];
const query=new URLSearchParams(location.search);
const pick=(name,list,fallback)=>list.includes(query.get(name))?query.get(name):fallback;
const options={state:states,scheme:['light','dark'],lang:['en','zh-Hans'],size:['default','min','wide']};
const state=pick('state',states,'ai');
const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');
document.documentElement.dataset.scheme=scheme;
document.documentElement.lang=lang;
document.getElementById('window').classList.toggle('min',size==='min');
document.getElementById('window').classList.toggle('wide',size==='wide');
for(const [id,list] of Object.entries(options)){
  const select=document.getElementById(id);
  select.innerHTML=list.map(s=>`<option>${s}</option>`).join('');
  select.value={state,scheme,lang,size}[id];
  select.onchange=()=>{query.set(id,select.value);location.search=query};
}

const icons={
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  article:'<path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/>',
  video:'<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
  social:'<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  star:'<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
  dot:'<circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="10"/>',
  circle:'<circle cx="12" cy="12" r="10"/>',
  checkCheck:'<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
  circleCheck:'<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>',
  search:'<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
  external:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  rss:'<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',
  arrowUp:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  wifiOff:'<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
  loader:'<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',

const t=(key,args={})=>copy[key].replace(/\{(\w+)\}/g,(_,k)=>args[k]);
const zh=lang==='zh-Hans';
const host='reader.example.net';
const remote=state!=='devices-local';
const group=state.startsWith('ai')?'ai':['opml','importing','imported','import-error','exported'].includes(state)?'opml':['devices','devices-local','revoke'].includes(state)?'devices':'fetching';

const groups=[['fetching','rss'],['opml','arrowUpDown'],['ai','sparkles'],['devices','laptop']];
const sidebar=`<aside><div class="top"><button class="back" aria-label="${copy.backTimeline}" title="${copy.backTimeline} (Esc)">${icon('chevronLeft')}<span>${copy.backTimeline}</span></button></div>
<nav class="nav" aria-label="${copy.settings}"><div class="section">${copy.settings}</div>${groups.map(([k,g])=>`<button class="item${k===group?' chosen':''}"${k===group?' aria-current="page"':''}>${icon(g)}<span class="name">${copy[k]}</span></button>`).join('')}</nav>
<div class="server" title="${copy.serverNote}">${icon(remote?'server':'laptop')}<span class="name">${remote?host:copy.thisComputer}</span><span class="dot" aria-hidden="true"></span></div></aside>`;

const base=state==='edited'||state==='invalid'?(state==='invalid'?'rsshub.example':'https://rsshub.example.net'):'https://rsshub.app';
const field=`<div class="field${state==='edited'?' focused':''}${state==='invalid'?' invalid':''}" role="textbox" aria-label="${copy.rsshub}"${state==='invalid'?' aria-invalid="true"':''}>${base}</div>`;
const dirty=state==='edited'||state==='invalid';
let status='';
if(state==='invalid')status=`<div class="status error" role="alert">${icon('alert')}${copy.invalidBase}</div>`;
if(state==='saved')status=`<div class="status ok" role="status">${icon('check')}${copy.saved}</div>`;
const fetching=`<p class="lead">${copy.lead}</p><div class="card">
<div class="row"><span class="label">${copy.rsshub}</span><p class="help">${copy.rsshubHelp}</p>
<div class="control">${field}<button class="button${dirty?' primary':''}"${dirty?'':' disabled'}>${copy.save}</button></div>${status}</div>
<div class="row"><div class="device"><div class="text"><span class="label">${copy.retention}</span><p class="help">${copy.retentionHelp}</p></div>
<button class="select" aria-haspopup="listbox" aria-label="${copy.retention}"><span>${copy.months3}</span>${icon('chevronDown')}</button></div></div>
</div>`;

const file='feeds.opml';
const busy=state==='importing';
let result='';
if(state==='importing')result=`<div class="status busy" role="status">${icon('loader','spin')}${t('importing',{file})}</div>`;
if(state==='imported')result=`<div class="result warn" role="status"><div class="head">${icon('triangle')}<span class="grow">${t('imported',{file,added:12,existing:3,failed:2})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div>
<ul aria-label="${copy.notAdded}"><li><span class="what">Gopher Weekly · <span class="mono-text">ftp://example.org/feed</span></span><span class="why">${copy.invalidUrl}</span></li>
<li><span class="what">${zh?'播客合集':'Podcasts'} · <span class="mono-text">https://example.com/podcast.xml</span></span><span class="why">${copy.invalidKind}</span></li></ul></div>`;
if(state==='import-error')result=`<div class="result error" role="alert"><div class="head">${icon('alert')}<span class="grow">${t('invalidOpml',{file:'notes.txt'})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div></div>`;
if(state==='exported')result=`<div class="result" role="status"><div class="head" style="color:var(--success)">${icon('check')}<span class="grow" style="color:var(--text)">${t('exported',{n:18,file:'oriel.opml'})}</span><button class="close" aria-label="${copy.dismiss}">${icon('x')}</button></div></div>`;
const opml=`<p class="lead">${copy.opmlHelp}</p><div class="card">
<div class="row"><div class="device"><div class="text"><span class="label">${copy.importLabel}</span><p class="help">${copy.importHelp}</p></div><button class="button"${busy?' disabled':''}>${icon('upload')}${copy.import}</button></div>${result}</div>
<div class="row"><div class="device"><div class="text"><span class="label">${copy.exportLabel}</span><p class="help">${copy.exportHelp}</p></div><button class="button"${busy?' disabled':''}>${icon('download')}${copy.export}</button></div></div>
</div>`;

const sessions=[
  {name:'Oriel · macOS',glyph:'laptop',date:zh?'10月3日':'Oct 3',seen:copy.now,current:true},
  {name:'Oriel · Windows',glyph:'monitor',date:zh?'9月21日':'Sep 21',seen:t('hours',{n:3})},
  {name:'Safari · iPhone',glyph:'smartphone',date:zh?'8月30日':'Aug 30',seen:copy.yesterday},
];
const devices=remote?`<p class="lead">${copy.devicesHelp}</p><div class="card">`+sessions.map(s=>`<div class="row"><div class="device"><div class="glyph">${icon(s.glyph)}</div><div class="text"><div class="name">${s.name}${s.current?`<span class="badge">${copy.thisDevice}</span>`:''}</div><div class="when">${t('signedIn',{date:s.date,seen:s.seen})}</div></div>${s.current?'':`<button class="button small danger">${copy.revoke}</button>`}</div></div>`).join('')+'</div>':
`<div class="card"><div class="row note">${icon('laptop')}<span>${copy.localDevices}</span></div></div>`;

const aiSet=state!=='ai', aiDirty=state==='ai-edited'||state==='ai-invalid';
const aiField=(label,value,placeholder,cls='')=>`<div class="field${cls}" role="textbox" aria-label="${label}"${cls.includes('invalid')?' aria-invalid="true"':''}>${value||`<span class="placeholder">${placeholder}</span>`}</div>`;
const endpoint=state==='ai-invalid'?'api.openai.com/v1':state==='ai-edited'?'http://localhost:11434/v1':aiSet?'https://api.openai.com/v1':'';
const modelName=state==='ai-edited'?'qwen3:8b':aiSet?'gpt-4o-mini':'';
let aiStatus='';
if(state==='ai-edited')aiStatus=`<div class="status busy">${copy.testFirst}</div>`;
if(state==='ai-testing')aiStatus=`<div class="status busy" role="status">${icon('loader','spin')}${copy.testing}</div>`;
if(state==='ai-tested')aiStatus=`<div class="status ok" role="status">${icon('check')}${t('tested',{model:'gpt-4o-mini-2024-07-18'})}</div>`;
if(state==='ai-test-failed')aiStatus=`<div class="status error" role="alert">${icon('alert')}${copy.aiUnauthorized}</div>`;
const prompt=(label,text)=>`<div class="row"><div class="label-row"><span class="label">${label}</span><button class="button small" disabled>${icon('rotateCcw')}${copy.reset}</button></div><div class="textarea" role="textbox" aria-multiline="true" aria-label="${label}">${text}</div></div>`;
const ai=`<p class="lead">${copy.aiLead}</p><div class="card">
<div class="row"><span class="label">${copy.endpoint}</span><p class="help">${copy.endpointHelp}</p><div class="control">${aiField(copy.endpoint,endpoint,copy.endpointPlaceholder,state==='ai-invalid'?' invalid':state==='ai'||state==='ai-edited'?' focused':'')}</div>${state==='ai-invalid'?`<div class="status error" role="alert">${icon('alert')}${copy.invalidAiBase}</div>`:''}</div>
<div class="row"><span class="label">${copy.model}</span><div class="control">${aiField(copy.model,modelName,copy.modelPlaceholder)}</div></div>
<div class="row"><div class="label-row"><span class="label">${copy.apiKey}</span><span class="badge${aiSet?'':' off'}">${aiSet?copy.keySet:copy.keyUnset}</span></div><p class="help">${copy.keyHelp}</p>
<div class="control">${aiField(copy.apiKey,'',aiSet?copy.keyReplace:copy.keyPlaceholder)}${aiSet?`<button class="button">${copy.removeKey}</button>`:''}</div></div>
<div class="row"><div class="device"><div class="text"><span class="label">${copy.language}</span><p class="help">${copy.languageHelp}</p></div>
<button class="select" aria-haspopup="listbox" aria-label="${copy.language}"><span>${copy.zhHans}</span>${icon('chevronDown')}</button></div></div>
<div class="row"><div class="actions">${aiStatus||'<span class="status"></span>'}<button class="button"${aiSet&&!aiDirty&&state!=='ai-testing'?'':' disabled'}>${icon('plug')}${copy.test}</button><button class="button${aiDirty?' primary':''}"${aiDirty?'':' disabled'}>${copy.save}</button></div></div>
</div>
<h2 class="section-title">${copy.prompts}</h2><div class="card">
${prompt(copy.promptSummary,'Summarize the article in {language} in three to five sentences. Reply with the summary only.')}
${prompt(copy.promptTranslate,'Translate the text into {language}. Keep the paragraphs and their order, and the title on the first line. Reply with the translation only.')}
<div class="row"><div class="actions"><p class="help status" style="display:block">${copy.promptHelp}</p><button class="button" disabled>${copy.save}</button></div></div>
</div>`;

let page;
if(state==='loading')page=`<div class="page skeleton" aria-busy="true"><div class="bar" style="width:60%"></div><div class="block"></div></div>`;
else if(state==='error')page=`<div class="empty" role="status"><div class="tile">${icon('wifiOff')}</div><h2>${copy.error}</h2><p>${copy.errorHint}</p><button class="button">${icon('refresh')}${copy.retry}</button></div>`;
else page=`<div class="page">${{fetching,opml,ai,devices}[group]}</div>`;

let overlay='';
if(state==='revoke')overlay=`<div class="backdrop"><div class="alert" role="alertdialog" aria-labelledby="at" aria-describedby="ab"><h2 id="at">${t('revokeTitle',{name:'Safari · iPhone'})}</h2><p id="ab">${copy.revokeBody}</p><div class="buttons"><button class="button">${copy.cancel}</button><button class="button default">${copy.revokeConfirm}</button></div></div></div>`;
document.getElementById('app').innerHTML=`${sidebar}<section class="main"><div class="toolbar"><h1>${copy[group]}</h1></div><div class="scroll">${page}</div></section>${overlay}`;
</script>
