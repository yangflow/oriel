<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline screen</title>
<!-- The timeline: every subscription's entries in one list, newest first, each kind with its own row. The sidebar
     chooses the scope (everything, one kind or one source); the bar above the list narrows it to unread or starred
     and searches it. Colors are the Oriel palette of design/tokens.md; icons are Lucide (ISC License). Pictures are
     drawn as gradients here; in the app they load in the background and show the Surface color until then.
     Row 2 shows the pointer resting on it (its actions show), row 3 the keyboard choice (focus ring).
     All, Articles and Social are one column; Videos become a cover grid and Images a masonry wall. The kinds sit on
     top of the sidebar as named items with counts; the sidebar then lists only that kind's subscriptions. The server bar at the
     bottom opens the connect screen; the gear beside it opens the settings.
     A social post's pictures stay low: one keeps its own ratio up to 240 high, two sit side by side, three or more
     are one row of three squares, the third covered with +N for the rest. Over a column, the toolbar lines its title
     and controls up with the column's edges, so a wide window keeps them together (size=wide).
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     Liquid Glass and the toolbar's controls are glass capsules over the content (docs/design.md, Title bar).
     Mark all as read names its scope in its tooltip, acts at once and offers Undo in a toast (marked-read), never a confirmation. N goes to the next
     unread entry; no-more-unread is what it says when there is none below. ? opens the keyboard shortcuts (keys).
     Site icons replace the monogram where a subscription has one; the ones here are generic stand-ins, not the
     sites' real icons, and The Go Blog shows the monogram a subscription without an icon keeps.
     The bar above the window only switches the mockup.
     URL parameters: state, scope=all|article|video|social|image|source, scheme=light|dark, lang=en|zh-Hans,
     size=default|min|wide. -->
<style>
:root { color-scheme:light; --stage:#e7e5e4; --stage-text:#57534e }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0c0a09; --stage-text:#a8a29e }
:root { --background:#fbfaf7; --surface:#f2f0eb; --surface-hover:#e9e6df; --surface-pressed:#dfdbd2; --border:#dcd7cd; --text:#1f1d1a; --muted:#6f6a64; --accent:#0f766e; --accent-hover:#115e59; --accent-text:#ffffff; --accent-soft:#e3efeb; --danger:#c2410c; --danger-soft:#fbece4; --warning:#a16207; --warning-soft:#f8f0dc; --success:#15803d; --focus:rgba(15,118,110,.5); --star:#a16207 }
:root[data-scheme=dark] { --background:#161513; --surface:#25231f; --surface-hover:#2f2c28; --surface-pressed:#3a3732; --border:#3d3933; --text:#ede9e3; --muted:#a8a29e; --accent:#4fbfad; --accent-hover:#6dd0c0; --accent-text:#0b2522; --accent-soft:#1f302c; --danger:#fb923c; --danger-soft:#3a2418; --warning:#facc15; --warning-soft:#35301a; --success:#4ade80; --focus:rgba(79,191,173,.5); --star:#facc15 }
* { box-sizing:border-box }
body { margin:0; padding:24px; font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default }
button:focus-visible { outline:3px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

.window { position:relative; width:960px; height:640px; border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; background:var(--background) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }

/* Sidebar */
aside { width:212px; flex:none; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border) }
.min aside { width:184px }
.nav { flex:1; overflow-y:auto; padding:8px }
.section { margin:12px 8px 4px; font-size:11px; font-weight:600; color:var(--muted) }
.item { width:100%; height:28px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; color:var(--text); text-align:left }
.item:hover { background:var(--surface-hover) }
.item.chosen { background:var(--surface-pressed) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.item .count { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums }
.item .warn { color:var(--warning) }
.mono { width:16px; height:16px; flex:none; display:grid; place-items:center; border-radius:4px; font-size:10px; font-weight:600; background:var(--accent-soft); color:var(--accent) }
.mono.k-video { background:var(--danger-soft); color:var(--danger) }
.mono.k-social { background:var(--warning-soft); color:var(--warning) }
.mono.k-image { background:color-mix(in srgb, var(--success) 14%, var(--background)); color:var(--success) }
.server-bar { flex:none; display:flex; align-items:center; border-top:1px solid var(--border); padding-right:6px }
.server { flex:1; min-width:0; text-align:left; display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 16px; color:var(--muted); font-size:12px }
.gear { flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.gear:hover { background:var(--surface-hover); color:var(--text) }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

/* Toolbar */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.toolbar { flex:none; height:48px; display:flex; align-items:center; gap:8px; padding:0 12px 0 20px; border-bottom:1px solid var(--border) }
.toolbar.aligned { --col:680px; padding-left:max(20px,calc((100% - var(--col))/2 + 20px)); padding-right:max(12px,calc((100% - var(--col))/2 + 12px)) }
.toolbar.aligned.wide { --col:720px }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; white-space:nowrap }
.toolbar .sub { color:var(--muted); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums }
.spacer { flex:1 }
.segmented { display:flex; padding:2px; gap:2px; border-radius:8px; background:var(--surface) }
.segmented button { height:24px; display:flex; align-items:center; gap:4px; padding:0 8px; border-radius:6px; color:var(--muted) }
.segmented button.on { background:var(--background); color:var(--text); box-shadow:0 0 0 1px var(--border) }
.segmented button svg.icon { width:14px; height:14px }
.min .segmented button span { display:none }
.search { width:200px; height:28px; display:flex; align-items:center; gap:6px; padding:0 4px 0 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--muted) }
.min .search { width:136px }
.search.focused { border-color:var(--accent); background:var(--background); box-shadow:0 0 0 3px var(--focus) }
.search.invalid { border-color:var(--warning) }
.search input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--text) }
.search input::placeholder { color:var(--muted) }
.search .clear { width:20px; height:20px; display:grid; place-items:center; border-radius:5px }
.search .clear svg.icon { width:14px; height:14px }
.tool { width:28px; height:28px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.tool:hover { background:var(--surface-hover); color:var(--text) }
.hint { flex:none; display:flex; align-items:center; gap:6px; padding:6px 20px; font-size:12px; color:var(--warning); background:var(--warning-soft); border-bottom:1px solid var(--border) }
.hint svg.icon { width:14px; height:14px }

/* Timeline */
.scroll { flex:1; overflow-y:auto }
.column { max-width:680px; margin:0 auto; padding:4px 20px 24px }
.row { position:relative; display:flex; gap:12px; padding:14px 12px 14px 20px; margin:0 -12px 0 -20px; border-radius:10px }
.row + .row::before { content:""; position:absolute; top:0; left:20px; right:12px; border-top:1px solid var(--border) }
.row:hover, .row.hover { background:var(--surface) }
.row.hover::before, .row.hover + .row::before, .row.chosen::before, .row.chosen + .row::before { border-color:transparent }
.row.chosen { box-shadow:inset 0 0 0 2px var(--focus) }
.unread-dot { position:absolute; left:7px; top:21px; width:6px; height:6px; border-radius:50%; background:var(--accent) }
.content { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px }
.meta { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); min-width:0 }
.meta .src { color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.meta .sep::before { content:"·" }
.meta .when { white-space:nowrap; font-variant-numeric:tabular-nums }
.meta svg.icon { width:13px; height:13px }
.title { margin:0; font-size:14.5px; font-weight:600; line-height:1.35; text-wrap:pretty }
.read .title { font-weight:500; color:var(--muted) }
.read .summary, .read .text { color:var(--muted) }
.summary { margin:0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.text { margin:0; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden }
.author { font-weight:600; color:var(--text) }
.handle { color:var(--muted) }
mark { background:var(--warning-soft); color:inherit; border-radius:3px; padding:0 1px }

.pic { border-radius:8px; background:var(--surface); flex:none; overflow:hidden; position:relative }
.thumb { width:96px; height:64px; margin-top:20px }
.video-thumb { width:184px; aspect-ratio:16/9 }
.min .video-thumb { width:136px }
.duration { position:absolute; right:6px; bottom:6px; padding:1px 5px; border-radius:4px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; background:rgba(0,0,0,.72); color:#fff }
.play { position:absolute; inset:0; display:grid; place-items:center; color:#fff }
.play span { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:rgba(0,0,0,.45) }
.play svg.icon { width:16px; height:16px; fill:currentColor; margin-left:2px }
.grid { display:grid; gap:4px; margin-top:6px; border-radius:10px; overflow:hidden; max-width:440px }
.grid.n1 { grid-template-columns:1fr }
.grid.n2 { grid-template-columns:1fr 1fr }
.grid.n3 { grid-template-columns:1fr 1fr 1fr }
.grid .pic { border-radius:0; aspect-ratio:4/3 }
.grid.n3 .pic { aspect-ratio:1 }
.grid.n1 { max-width:384px }
.grid.n1 .pic { aspect-ratio:16/10; max-height:240px }
.grid .more { position:relative }
.grid .more b { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.5); color:#fff; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums }
.single { margin-top:6px; aspect-ratio:3/2; max-height:340px; border-radius:10px }

.actions { position:absolute; right:10px; top:10px; display:flex; gap:2px; padding:2px; border-radius:8px; background:var(--background); box-shadow:0 0 0 1px var(--border), 0 2px 8px rgba(0,0,0,.08); visibility:hidden }
.row.hover .actions, .row.chosen .actions { visibility:visible }
.actions button { width:26px; height:26px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.actions button:hover { background:var(--surface-hover); color:var(--text) }
.actions button.starred { color:var(--star) }
.star-mark { color:var(--star) }
.star-mark svg.icon { width:13px; height:13px }

.g1 { background:linear-gradient(135deg,#d6c7a8,#7b8f86) }
.g2 { background:linear-gradient(160deg,#283a4e,#7a5c86 60%,#e2a46d) }
.g3 { background:linear-gradient(120deg,#1c1c1c,#3c5e8a) }
.g4 { background:linear-gradient(200deg,#e9d8c4,#b98b6b) }
.g5 { background:linear-gradient(140deg,#0e1b2e,#223f6d 50%,#c9a35b) }
.g6 { background:linear-gradient(170deg,#7aa38a,#2f4f3f) }
.g7 { background:linear-gradient(110deg,#c56b4a,#f1c27d) }
.g8 { background:linear-gradient(150deg,#384b57,#99b1b8) }
.g9 { background:linear-gradient(130deg,#5a3d6b,#d08a92) }

.footer { display:flex; justify-content:center; align-items:center; gap:8px; padding:16px; color:var(--muted); font-size:12px }
.spin { animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
.pill { position:absolute; top:60px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; height:28px; padding:0 12px 0 10px; border-radius:14px; background:var(--accent); color:var(--accent-text); font-weight:500; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:2 }
.pill svg.icon { width:14px; height:14px }

.skeleton .bar { height:10px; border-radius:5px; background:var(--surface) }
.skeleton .bar.t { height:14px; width:70% }
.skeleton .bar.s { width:92% }
.skeleton .bar.m { width:36% }

.empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center }
.tile { width:48px; height:48px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent) }
.tile.danger { background:var(--danger-soft); color:var(--danger) }
.tile svg.icon { width:24px; height:24px; stroke-width:1.5 }
.empty h2 { margin:0; font-size:15px; font-weight:600 }
.empty p { margin:-4px 0 0; max-width:300px; color:var(--muted) }
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border:1px solid var(--border); border-radius:8px; background:var(--background); color:var(--text) }
.button:hover { background:var(--surface-hover) }
.button.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-text); font-weight:500 }
.button.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover) }

.scrim { position:absolute; inset:0; background:rgba(0,0,0,.28); display:grid; place-items:center; z-index:3 }
.alert { width:300px; padding:20px; border-radius:12px; background:var(--background); box-shadow:0 0 0 1px var(--border), 0 16px 40px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:8px; text-align:center; align-items:center }
.alert h2 { margin:4px 0 0; font-size:14px; font-weight:600 }
.alert p { margin:0; color:var(--muted); font-size:12px }
.alert .buttons { display:flex; gap:8px; margin-top:8px; width:100% }
.alert .buttons .button { flex:1 }
.fav { position:relative; width:16px; height:16px; flex:none; border-radius:4px; overflow:hidden }
.fav::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--text) 22%,transparent) }
.fav svg { display:block; width:16px; height:16px }
.toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:10px; max-width:calc(100% - 40px); min-height:40px; padding:6px 6px 6px 14px; border-radius:12px; background:var(--text); color:var(--background); font-size:12.5px; box-shadow:0 8px 28px rgba(0,0,0,.28) }
.toast svg.icon { width:16px; height:16px; flex:none }
.toast .msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.toast .act { height:28px; padding:0 10px; border-radius:8px; color:inherit; font-weight:600; white-space:nowrap; background:color-mix(in srgb,var(--background) 16%,transparent)}
.toast .act kbd, .sheet kbd { font:inherit }
.toast .act kbd { margin-left:6px; opacity:.6; font-weight:400 }
.toast .x { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:inherit; opacity:.7 }
.toast .x svg.icon { width:14px; height:14px }
.toast.plain { padding-right:14px }
.sheet { width:560px; max-width:calc(100% - 48px); max-height:calc(100% - 48px); overflow:auto; border-radius:12px; background:var(--background); box-shadow:0 0 0 1px var(--border), 0 16px 40px rgba(0,0,0,.25) }
.sheet header { display:flex; align-items:center; gap:12px; padding:16px 16px 8px 20px }
.sheet h2 { margin:0; flex:1; font-size:15px; font-weight:600 }
.sheet .close { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.sheet .close:hover { background:var(--surface-hover) }
.sheet .cols { display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; padding:4px 20px 20px }
.sheet h3 { margin:12px 0 4px; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
.sheet dl { margin:0; display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 12px }
.sheet dt { font-size:12.5px; padding:5px 0 }
.sheet dd { margin:0; display:flex; gap:4px; justify-content:flex-end }
.sheet kbd { min-width:22px; height:22px; padding:0 6px; display:inline-grid; place-items:center; border-radius:6px; background:var(--surface); box-shadow:inset 0 -1px 0 var(--border), 0 0 0 1px var(--border); font-size:11.5px; color:var(--text) }
.sheet .or { font-size:11px; color:var(--muted); align-self:center }
.window.min .sheet .cols { grid-template-columns:1fr }
.dot-inline { width:6px; height:6px; flex:none; border-radius:50%; background:var(--accent) }

/* Kind tabs, video grid, masonry */
.column.wide { max-width:720px }
.column.wide .grid { max-width:520px }
.vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px 14px; padding:16px 20px 24px }
.vcard { position:relative; display:flex; flex-direction:column; gap:6px }
.vcard .video-thumb { width:100% }
.vcard .play { opacity:0 }
.vcard.hover .play { opacity:1 }
.vcard .title { font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.masonry { columns:3 170px; column-gap:12px; padding:16px 20px 24px }
.mtile { position:relative; break-inside:avoid; margin:0 0 16px; display:flex; flex-direction:column; gap:4px }
.mtile .pic { width:100% }
.mtile figcaption { font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mtile.read figcaption { color:var(--muted) }
.vcard .actions, .mtile .actions { top:8px; right:8px }
.vcard.hover .actions, .mtile.hover .actions { visibility:visible }

/* Window chrome, as macOS 26 draws it: no title bar, the window buttons over the sidebar's top; the sidebar a pane
   of Liquid Glass floating 8 from the window's edges; the toolbar no bar, its controls capsules of glass floating
   over the content, which fades under them (the soft scroll edge). */
:root { --glass:color-mix(in srgb,var(--surface) 72%,transparent); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.8), inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 .5px rgba(0,0,0,.13); --edge:color-mix(in srgb,var(--background) 85%,transparent) }
:root[data-scheme=dark] { --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.11), 0 0 0 .5px rgba(0,0,0,.6) }
.window { position:relative; border:0; border-radius:16px; box-shadow:0 0 0 .5px rgba(0,0,0,.22), 0 24px 64px rgba(0,0,0,.22) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 24px 64px rgba(0,0,0,.6) }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }
aside, .toolbar .segmented, .toolbar .search, .toolbar > .tool, .toolbar .group, .toolbar .back, .toolbar .ghost { background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(1.6); backdrop-filter:blur(24px) saturate(1.6); box-shadow:var(--glass-rim) }
aside { margin:8px 0 8px 8px; padding-top:40px; border:0; border-radius:16px }
.server-bar { border-top:0 }
aside .top { height:36px; border-bottom:0 }
.main::after { content:""; position:absolute; top:0; left:0; right:0; height:62px; background:linear-gradient(var(--edge),transparent); pointer-events:none; z-index:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; border-bottom:0 }
.toolbar ~ .scroll { padding-top:52px }
.toolbar ~ .hint ~ .scroll { padding-top:0 }
.toolbar + .hint { margin:56px 12px 4px; padding:7px 14px; border:0; border-radius:10px }
.toolbar .segmented { height:32px; padding:3px; border-radius:16px }
.toolbar .segmented button { height:26px; padding:0 10px; border-radius:13px }
.toolbar .segmented button.on { background:var(--background); box-shadow:0 1px 3px rgba(0,0,0,.14) }
:root[data-scheme=dark] .toolbar .segmented button.on { background:var(--surface-pressed); box-shadow:none }
.toolbar .search { height:32px; padding:0 6px 0 12px; border:0; border-radius:16px }
.toolbar .search.focused { box-shadow:var(--glass-rim), 0 0 0 3px var(--focus) }
.toolbar .search.invalid { box-shadow:var(--glass-rim), inset 0 0 0 1.5px var(--warning) }
.toolbar > .tool { width:32px; height:32px; border-radius:16px }
.toolbar .group { flex:none; display:flex; align-items:center; height:32px; padding:0 2px; border-radius:16px }
.toolbar .group .tool { height:28px; border-radius:14px }
.toolbar .group + .group { margin-left:8px }
.toolbar .back { height:32px; padding:0 12px 0 6px; border-radius:16px; color:var(--text) }
.toolbar .ghost { height:32px; border-radius:16px }
/* One look for each state (docs/design.md, States). Chosen in navigation (a kind, a subscription, a settings
   group): the soft accent fill, the icon in Accent, the name in Text at 500. Chosen in a control (a segment): a
   raised face. The keyboard's place: the focus ring. Counts: 11, 500, tabular. Disabled: a neutral face with

const shown=state==='search'?entries.filter(e=>e.kind==='article'&&e.source===1):visible;

const navItem=(glyph,name,count,chosen,extra='')=>`<button class="item${chosen?' chosen':''}" aria-current="${chosen}">${glyph}<span class="name">${name}</span>${extra}${count?`<span class="count">${count}</span>`:''}</button>`;
const sourceItem=s=>navItem(glyph(s),s.name,s.unread,scope==='source'&&s.id===1,s.failing?`<span class="warn" role="img" aria-label="${copy.failing}" title="${copy.failing}">${icon('alert')}</span>`:'');
const tabKind=scope==='source'?'article':scope;
const kindList=[['all','inbox'],...kinds.map(k=>[k,k])];
const kindCount=(k,counts)=>counts?(k==='all'?total:kindUnread(k)):0;
const tabs=counts=>`<nav class="kind-list" aria-label="${copy.kinds}">${kindList.map(([k,g])=>navItem(icon(g),k==='all'?copy.all:copy[k],kindCount(k,counts),k===tabKind)).join('')}</nav>`;
function sidebar(){
  if(state==='no-subscriptions')return `<aside>${tabs(false)}<nav class="nav"></nav>${serverBar()}</aside>`;
  const list=tabKind==='all'?sources:sources.filter(s=>s.kind===tabKind);
  return `<aside>${tabs(true)}<nav class="nav" aria-label="${copy.sources}"><div class="section">${tabKind==='all'?copy.sources:copy[tabKind]}</div>${list.map(sourceItem).join('')}</nav>${serverBar()}</aside>`;
}
function serverBar(){return `<div class="server-bar"><button class="server" aria-label="${copy.thisComputer}">${icon('laptop')}<span class="name">${copy.thisComputer}</span><span class="dot" aria-hidden="true"></span></button><button class="gear" aria-label="${copy.settings}" title="${copy.settings} (Ctrl+,)">${icon('settings')}</button></div>`}

const highlight=s=>q&&state==='search'?s.replace(new RegExp(q,'ig'),m=>`<mark>${m}</mark>`):s;
const actionButtons=(e,cls='')=>`<button class="${cls}${e.starred?' starred':''}" aria-label="${e.starred?copy.unstar:copy.star}" title="${e.starred?copy.unstar:copy.star}">${icon('star',e.starred?'filled':'')}</button>
  <button class="${cls}" aria-label="${e.read?copy.markUnread:copy.markRead}" title="${e.read?copy.markUnread:copy.markRead}">${icon(e.read?'mail':'mailOpen')}</button>
  <button class="${cls}" aria-label="${copy.open}" title="${copy.open}">${icon('external')}</button>`;
const actions=e=>`<div class="actions">${actionButtons(e)}</div>`;
const unreadDot=e=>e.read?'':`<span class="dot-inline" role="img" aria-label="${copy.unread}"></span>`;
const meta=(e,prefix='')=>{const s=byId[e.source];return `<div class="meta">${prefix}${glyph(s)}<span class="src">${s.name}</span><span class="sep"></span><span class="when">${e.when}</span>${e.starred?`<span class="star-mark" role="img" aria-label="${copy.starred}">${icon('star','filled')}</span>`:''}</div>`};
const pictures=list=>{
  if(list.length===1)return `<div class="grid n1"><div class="pic ${list[0]}"></div></div>`;
  if(list.length===2)return `<div class="grid n2">${list.map(g=>`<div class="pic ${g}"></div>`).join('')}</div>`;
  const hidden=list.length-3;
  return `<div class="grid n3">${list.slice(0,3).map((g,i)=>i===2&&hidden>0?`<div class="pic more ${g}" role="img" aria-label="${t('morePictures',{n:hidden})}"><b aria-hidden="true">+${hidden}</b></div>`:`<div class="pic ${g}"></div>`).join('')}</div>`;
};
const videoCover=(e,cls)=>`<div class="pic ${cls} ${e.thumb}" role="img" aria-label="${t('duration',{d:e.duration})}"><div class="play"><span>${icon('video')}</span></div><span class="duration">${e.duration}</span></div>`;

// All, Articles, Social: one column of rows
const row=(e,i)=>{
  const cls=`row${e.read?' read':''}${i===1&&state==='list'?' hover':''}${(i===2&&state==='list')||(i===3&&state==='no-more-unread')?' chosen':''}`;
  const dot=e.read?'':`<span class="unread-dot" role="img" aria-label="${copy.unread}"></span>`;
  switch(e.kind){
    case 'article':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<h3 class="title">${highlight(e.title)}</h3><p class="summary">${highlight(e.summary)}</p></div>${e.thumb?`<div class="pic thumb ${e.thumb}"></div>`:''}${actions(e)}</article>`;
    case 'video':return `<article class="${cls}">${dot}${videoCover(e,'video-thumb')}<div class="content">${meta(e)}<h3 class="title">${e.title}</h3><div class="meta">${icon('video')}<span>${e.platform}</span></div></div>${actions(e)}</article>`;
    case 'social':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<p class="text"><span class="author">${e.author}</span> <span class="handle">${e.handle}</span><br>${e.text}</p>${pictures(e.images)}</div>${actions(e)}</article>`;
    case 'image':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<h3 class="title">${e.title}</h3><div class="pic single ${e.images[0]}"></div></div>${actions(e)}</article>`;
  }
};
// Videos and Images
const videoCard=(e,i)=>`<article class="vcard${e.read?' read':''}${i===0&&state==='list'?' hover':''}">${videoCover(e,'video-thumb')}<h3 class="title">${e.title}</h3>${meta(e,unreadDot(e))}${actions(e)}</article>`;
const masonryTile=(e,i)=>`<figure class="mtile${e.read?' read':''}${i===0&&state==='list'?' hover':''}"><div class="pic ${e.images[0]}" style="aspect-ratio:${e.r}" role="img" aria-label="${e.title}"></div><figcaption>${e.title}</figcaption>${meta(e,unreadDot(e))}${actions(e)}</figure>`;
const skeleton=()=>Array.from({length:4},(_,i)=>`<div class="row skeleton" aria-hidden="true"><div class="content" style="gap:8px"><div class="bar m"></div><div class="bar t"></div><div class="bar s"></div></div>${i%2?'':'<div class="pic thumb"></div>'}</div>`).join('');
const empty=(tile,title,hint,button='',cls='')=>`<div class="empty" role="status"><div class="tile ${cls}">${icon(tile)}</div><h2>${title}</h2><p>${hint}</p>${button}</div>`;
const more=state==='more'?`<div class="footer" role="status">${icon('loader','spin')}${copy.loadingMore}</div>`:'';

let list;
if(state==='loading')list=`<div class="column" aria-busy="true">${skeleton()}</div>`;
else if(state==='no-subscriptions')list=empty('rss',copy.noSubscriptions,copy.noSubscriptionsHint);
else if(state==='error')list=empty('wifiOff',copy.error,copy.errorHint,`<button class="button">${icon('refresh')}${copy.retry}</button>`,'danger');
else if(state==='unread-done')list=empty('circleCheck',copy.unreadDone,copy.unreadDoneHint);
else if(state==='starred-none')list=empty('star',copy.noStarred,copy.noStarredHint);
else if(state==='empty')list=empty('inbox',copy.empty,copy.emptyHint);
else if(state==='search-none')list=empty('search',t('noResults',{q}),copy.noResultsHint);
else if(scope==='video'&&state!=='search')list=`<div class="vgrid" role="feed" aria-label="${scopeName}">${shown.map(videoCard).join('')}</div>${more}`;
else if(scope==='image'&&state!=='search')list=`<div class="masonry" role="feed" aria-label="${scopeName}">${shown.map(masonryTile).join('')}</div>${more}`;
else list=`<div class="column${scope==='social'?' wide':''}" role="feed" aria-label="${scopeName}">${shown.map(row).join('')}${more}</div>`;

const unreadInScope=kinds.includes(scope)?kindUnread(scope):scope==='source'?byId[1].unread:total;
const sub=state==='no-subscriptions'||state==='error'?'':state==='search'?t('results',{n:1}):state==='unread-done'||state==='starred-none'||state==='empty'||state==='marked-read'?'':t('unreadCount',{n:unreadInScope});
const segments=[['inbox','everything'],['dot','unread'],['star','starred']].map(([g,k],i)=>`<button role="radio" aria-checked="${i===filter}" class="${i===filter?'on':''}" aria-label="${copy[k]}" title="${copy[k]}">${icon(g)}<span>${copy[k]}</span></button>`).join('');
const searchField=`<div class="search${searching?' focused':''}${state==='search-short'?' invalid':''}">${icon('search')}<input aria-label="${copy.searchLabel}" placeholder="${copy.search}" value="${q}" ${state==='search-short'?'aria-invalid="true" aria-describedby="hint"':''}>${searching?`<button class="clear" aria-label="${copy.clear}">${icon('x')}</button>`:''}</div>`;
const markAllName=t('markAllIn',{scope:scopeName});
const markAll=`<button class="tool" aria-label="${markAllName}" title="${markAllName}">${icon('checkCheck')}</button>`;
const columned=!((scope==='video'||scope==='image')&&state!=='search');
const toolbar=`<div class="toolbar${columned?' aligned':''}${scope==='social'?' wide':''}"><h1>${scopeName}</h1><span class="sub">${sub}</span><span class="spacer"></span><div class="segmented" role="radiogroup" aria-label="${copy.show}">${segments}</div>${searchField}${markAll}</div>`;
const hint=state==='search-short'?`<div class="hint" id="hint" role="status">${icon('alert')}${copy.tooShort}</div>`:'';
const pill=state==='new'?`<button class="pill">${icon('arrowUp')}${t('newEntries',{n:3})}</button>`:'';
const mod=navigator.platform.startsWith('Mac')?'⌘':'Ctrl+';
const toast=state==='marked-read'?`<div class="toast" role="status">${icon('checkCheck')}<span class="msg">${t('marked',{n:markedCount,scope:scopeName})}</span><button class="act">${copy.undo}<kbd>${mod}Z</kbd></button><button class="x" aria-label="${copy.dismiss}">${icon('x')}</button></div>`
  :state==='no-more-unread'?`<div class="toast plain" role="status">${icon('circleCheck')}<span class="msg">${copy.noMoreUnread}</span></div>`:'';
const keys=(...k)=>k.map(x=>Array.isArray(x)?x.map(y=>`<kbd>${y}</kbd>`).join(''):`<kbd>${x}</kbd>`).join(`<span class="or">${copy.or}</span>`);
const keyList=rows=>`<dl>${rows.map(([name,...k])=>`<dt>${copy[name]}</dt><dd>${keys(...k)}</dd>`).join('')}</dl>`;
const dialog=state==='keys'?`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kt"><header><h2 id="kt">${copy.keysTitle}</h2><button class="close" aria-label="${copy.close}">${icon('x')}</button></header><div class="cols"><div>
  <h3>${copy.inTimeline}</h3>${keyList([['kNext','J','↓'],['kPrev','K','↑'],['kNextUnread','N'],['kOpen','O','↩'],['kStar','S'],['kRead','M'],['kSearch','/',[mod,'F']],['kEscape','Esc'],['kUndo',[mod,'Z']]])}</div><div>
  <h3>${copy.inReader}</h3>${keyList([['kNextArticle','J'],['kPrevArticle','K'],['kNextUnread','N'],['kStar','S'],['kRead','M'],['kOpenBrowser','O'],['kBack','Esc']])}
  <h3>${copy.anywhere}</h3>${keyList([['kAdd',[mod,'N']],['kSettings',[mod,',']],['kKeys','?']])}</div></div></div></div>`:'';

document.getElementById('app').innerHTML=`${sidebar()}<section class="main">${toolbar}${hint}${pill}<div class="scroll">${list}</div>${toast}</section>${dialog}`;
if(state==='no-more-unread')document.querySelector('.row.chosen').scrollIntoView({block:'center'});
</script>
</html>
