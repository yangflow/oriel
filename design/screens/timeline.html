<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline screen</title>
<!-- The timeline: every subscription's entries in one list, newest first, each kind with its own row. The sidebar
     chooses the scope (everything, one kind or one source); the bar above the list narrows it to unread or starred
     and searches it. Colors are the Oriel palette of design/tokens.md; icons are Lucide (ISC License). Pictures are
     drawn as gradients here; in the app they load in the background and show the Surface color until then.
     Row 2 shows the pointer resting on it (its actions show), row 3 the keyboard choice (focus ring).
     All, Articles and Social are one column; Videos become a cover grid and Images a masonry wall. The kinds sit on
     top of the sidebar as named items with counts; the sidebar then lists only that kind's subscriptions. The server bar at the
     bottom opens the connect screen; the gear beside it opens the settings.
     A social post's pictures stay low: one keeps its own ratio up to 240 high, two sit side by side, three or more
     are one row of three squares, the third covered with +N for the rest. Over a column, the toolbar lines its title
     and controls up with the column's edges, so a wide window keeps them together (size=wide).
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     warm ink glass in both schemes, the content is warm paper, and the one capsule of glass in the toolbar is the
     segmented control; search is a flat fill and the tools are bare icons (docs/design.md, Title bar).
     Mark all as read names its scope in its tooltip, acts at once and offers Undo in a toast (marked-read), never a confirmation. N goes to the next
     unread entry; no-more-unread is what it says when there is none below. ? opens the keyboard shortcuts (keys).
     Site icons replace the monogram where a subscription has one; the ones here are generic stand-ins, not the
     sites' real icons, and The Go Blog shows the monogram a subscription without an icon keeps.
     A failing subscription carries the warning mark; its row's name says so ("The Go Blog, last fetch failed"), and the
     mark's tooltip gives how many times in a row and the reason (failing, the pointer resting on the mark). While any
     fail, the Subscriptions heading ends in "N failing", which narrows the list to them until Show all (failing-only).
     When a background check fails after the list has loaded, the list stays whole and usable and a quiet line under
     the toolbar says so ("Can't reach the server · last updated 10:42", offline): muted text, a Warning-tinted
     wifi-off mark, no button. It clears by itself on the next successful check, and is announced once (polite status).
     The bar above the window only switches the mockup.
     URL parameters: state, scope=all|article|video|social|image|source, scheme=light|dark, lang=en|zh-Hans,
     size=default|min|wide. -->
<style>
:root { color-scheme:light; --stage:#dedad2; --stage-text:#4f4a42; --shadow:28,24,18; --t:140ms ease-out;
  --background:#fdfcfa; --surface:#f6f3ee; --raised:#ffffff; --track:#ece8e0; --disabled:#b3ada1;
  --text:#25221e; --text2:#58534a; --muted:#736d62; --prose:#3a362f;
  --ink:37,34,30; --hover:rgba(var(--ink),.03); --pressed:rgba(var(--ink),.05); --sel:rgba(var(--ink),.065); --border:rgba(var(--ink),.075);
  --accent:#2a6d65; --accent-hover:#225a54; --accent-text:#ffffff; --accent-soft:rgba(42,109,101,.09); --focus:rgba(42,109,101,.45);
  --danger:#b4533c; --danger-soft:rgba(180,83,60,.09); --warning:#9a7222; --warning-soft:rgba(154,114,34,.10); --success:#4c7c59; --star:#b98a22;
  --chrome:#37332e; --chrome-ink:255,248,235; --chrome-text:#ece7dd; --chrome-text2:#cdc7bb; --chrome-muted:#a49e91;
  --glass:rgba(255,254,251,.66); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.95), 0 0 0 .5px rgba(var(--ink),.12), 0 2px 12px rgba(var(--ink),.07);
  --edge:color-mix(in srgb,var(--background) 96%,transparent) }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0b0c0c; --stage-text:#8a918f;
  --background:#171918; --surface:#1d1f1e; --raised:#252827; --track:#2c2f2e; --disabled:#565b59;
  --text:#dde1df; --text2:#aab0ae; --muted:#8a918f; --prose:#c3c9c7;
  --ink:234,240,238; --hover:rgba(var(--ink),.04); --pressed:rgba(var(--ink),.06); --sel:rgba(var(--ink),.08); --border:rgba(var(--ink),.075);
  --accent:#78beb1; --accent-hover:#8ccbbf; --accent-text:#10241f; --accent-soft:rgba(120,190,177,.12); --focus:rgba(120,190,177,.5);
  --danger:#e0897a; --danger-soft:rgba(224,137,122,.13); --warning:#d6aa55; --warning-soft:rgba(214,170,85,.13); --success:#8ab997; --star:#e2b24f;
  --chrome:#1a2422; --chrome-ink:235,248,244; --chrome-text:#e8eeec; --chrome-text2:#cbd5d2; --chrome-muted:#93a39f;
  --glass:rgba(58,63,62,.52); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 .5px rgba(0,0,0,.55);
  --edge:color-mix(in srgb,var(--background) 96%,transparent) }
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
body { margin:0; padding:24px; font:13px/1.5 system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
:root:lang(zh-Hans) body { line-height:1.65 }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default; transition:background-color var(--t), color var(--t), opacity var(--t) }
button:focus-visible { outline:2px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

/* Window: no title bar, the window buttons over the sidebar's top; the sidebar is an ink pane of glass floating 8
   from the window's edges; the content is paper and never sits on glass. */
.window { position:relative; width:960px; height:640px; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; background:var(--background); box-shadow:0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px rgba(var(--shadow),.28) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.65) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }

/* Sidebar: warm charcoal in both schemes, so its roles are its own: light on dark, warm-white state fills (5.5, 8.5
   and 12%), its own accent. The selection is the fill plus the icon in Accent. */
aside { width:216px; flex:none; display:flex; flex-direction:column; margin:8px 0 8px 8px; padding-top:40px; border-radius:14px;
  background:var(--chrome);
  box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.10), 0 0 0 .5px rgba(0,0,0,.35), 0 6px 24px rgba(var(--shadow),.14);
  --ink:var(--chrome-ink); --text:var(--chrome-text); --text2:var(--chrome-text2); --muted:var(--chrome-muted); --accent:#7cc9bb; --warning:#d6aa55; --success:#8ab997;
  --hover:rgba(var(--ink),.055); --pressed:rgba(var(--ink),.085); --sel:rgba(var(--ink),.12); --border:rgba(var(--ink),.08); --track:rgba(var(--ink),.11) }
:root[data-scheme=dark] aside { box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.08), 0 0 0 .5px rgba(0,0,0,.7) }
.min aside { width:184px }
.kind-list { flex:none; padding:0 8px 8px; display:flex; flex-direction:column; gap:1px }
.nav { flex:1; overflow-y:auto; padding:4px 8px 6px }
.section { margin:14px 10px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
.section.with { display:flex; align-items:center; gap:6px; margin-right:4px }
.section.with span { flex:1; min-width:0 }
.section .link { display:flex; align-items:center; gap:4px; height:20px; padding:0 6px; border-radius:6px; font:inherit; letter-spacing:inherit; color:var(--warning) }
.section .link.plain { color:var(--text2) }
.section .link:hover, .section .link.hover { background:var(--hover) }
.section .link svg.icon { width:12px; height:12px }
.tip { position:absolute; z-index:5; max-width:260px; padding:5px 9px; border-radius:6px; font-size:12px; line-height:1.4; color:var(--text); background:var(--raised); box-shadow:0 0 0 .5px rgba(var(--shadow),.18),0 4px 14px rgba(var(--shadow),.16) }
:root:lang(zh-Hans) .section { font-size:12px; letter-spacing:.02em }
.item { width:100%; height:30px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:8px; color:var(--text); text-align:left }
.item:hover { background:var(--hover) }
.item:active { background:var(--pressed) }
.item.chosen { background:var(--sel) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text2) }
.item.chosen .name { font-weight:500; color:var(--text) }
.item .count { font-size:11px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums; color:var(--muted) }
.item:hover .count, .item.chosen .count { color:var(--text2) }
.item .warn { color:var(--warning) }
.kind-list .item svg.icon { color:var(--muted) }
.kind-list .item:hover svg.icon { color:var(--text2) }
.kind-list .item.chosen svg.icon { color:var(--accent) }

/* One shape for every source icon: size, radius and hairline; monograms are neutral, never colored by kind. */
.fav, .mono { width:18px; height:18px; flex:none; border-radius:5px }
.fav { position:relative; overflow:hidden }
.fav::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 .5px rgba(var(--ink),.2) }
.fav svg { display:block; width:100%; height:100% }
.mono { display:grid; place-items:center; font-size:10.5px; font-weight:600; background:var(--track); color:var(--text2) }
.meta .fav, .meta .mono { width:15px; height:15px; border-radius:4px }
.meta .mono { font-size:9px }
.server-bar { flex:none; display:flex; align-items:center; padding:0 8px 6px 0 }
.server { flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 18px; text-align:left; font-size:12px; letter-spacing:.01em; color:var(--muted) }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }
.server .dot.off { background:var(--warning) }
.gear { flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.gear:hover { background:var(--hover); color:var(--text) }

/* Toolbar: no bar. The title is bare over the content, which fades under it (the soft scroll edge). The segmented
   control is the one glass capsule; search is a flat ink fill and the tools are bare icons. */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.main::after { content:""; position:absolute; top:0; left:0; right:0; height:76px; background:linear-gradient(var(--edge) 52px,transparent); pointer-events:none; z-index:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; display:flex; align-items:center; gap:10px; padding:0 12px 0 20px }
.toolbar.aligned { --col:680px; padding-left:max(20px,calc((100% - var(--col))/2 + 36px)); padding-right:max(12px,calc((100% - var(--col))/2 + 20px)) }
.toolbar.aligned.wide { --col:720px }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.005em; white-space:nowrap }
.toolbar .sub { font-size:12px; letter-spacing:.01em; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted) }
.spacer { flex:1 }
.segmented { display:flex; height:32px; padding:3px; gap:2px; border-radius:16px; background:var(--glass); box-shadow:var(--glass-rim); -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5) }
.segmented button { height:26px; display:flex; align-items:center; gap:4px; padding:0 11px; border-radius:13px; font-size:12px; font-weight:500; letter-spacing:.01em; color:var(--muted) }
.segmented button:hover { background:var(--hover); color:var(--text) }
.segmented button.on { background:rgba(var(--ink),.10); color:var(--text) }
.segmented button svg.icon { width:14px; height:14px }
.min .segmented button span { display:none }
.search { width:200px; height:32px; display:flex; align-items:center; gap:6px; padding:0 6px 0 12px; border-radius:16px; background:rgba(var(--ink),.055); color:var(--muted); transition:background-color var(--t), box-shadow var(--t) }
.search:hover { background:rgba(var(--ink),.075) }
.min .search { width:136px }
.search.focused { background:var(--raised); box-shadow:0 0 0 2px var(--focus), 0 2px 10px rgba(var(--ink),.08) }
.search.invalid { box-shadow:inset 0 0 0 1.5px var(--warning) }
.search input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--text) }
.search input::placeholder { color:var(--muted) }
.search .clear { width:20px; height:20px; display:grid; place-items:center; border-radius:6px }
.search .clear svg.icon { width:14px; height:14px }
.tool { width:32px; height:32px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.tool:hover { background:var(--hover); color:var(--text) }
.tool:active { background:var(--pressed) }
.hint { flex:none; display:flex; align-items:center; gap:6px; margin:56px 12px 4px; padding:7px 14px; border-radius:12px; font-size:12px; letter-spacing:.005em; color:var(--text2); background:var(--warning-soft) }
.hint svg.icon { width:14px; height:14px; color:var(--warning) }

.stale { position:relative; z-index:2; flex:none; display:flex; align-items:center; gap:6px; height:28px; margin-top:52px; padding:0 20px; font-size:12px; letter-spacing:.01em; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted) }
.stale.aligned { --col:680px; padding-left:max(20px,calc((100% - var(--col))/2 + 36px)); padding-right:max(12px,calc((100% - var(--col))/2 + 20px)) }
.stale.aligned.wide { --col:720px }
.stale span { min-width:0; overflow:hidden; text-overflow:ellipsis }
.stale svg.icon { width:14px; height:14px; color:var(--warning) }
.stale + .scroll { padding-top:0 }

/* Timeline: rows are 12-radius fills; the pointer, a press and the choice fill with the 3, 5 and 6.5% ink steps
   (4, 6 and 8% in dark). The choice also carries a small accent marker inside the fill, 8 from its left edge. */
.scroll { flex:1; overflow-y:auto; padding-top:52px }
.column { max-width:680px; margin:0 auto; padding:6px 24px 40px }
.column.wide { max-width:720px }
.row { position:relative; display:flex; gap:14px; padding:16px 16px 16px 28px; margin:0 -16px; border-radius:12px; transition:background-color var(--t) }
.row + .row::before { content:""; position:absolute; top:0; left:28px; right:16px; border-top:1px solid var(--border) }
.row:hover, .row.hover { background:var(--hover) }
.row:active { background:var(--pressed) }
.row.chosen, .row.chosen:hover { background:var(--sel) }
.row.chosen::after { content:""; position:absolute; left:8px; top:50%; width:2.5px; height:18px; margin-top:-9px; border-radius:2px; background:var(--accent) }
.row:hover::before, .row:hover + .row::before, .row.hover::before, .row.hover + .row::before, .row.chosen::before, .row.chosen + .row::before { border-color:transparent }
.unread-dot { position:absolute; left:14px; top:23px; width:7px; height:7px; border-radius:50%; background:var(--accent) }
.content { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px }
.meta { display:flex; align-items:center; gap:6px; height:20px; padding-right:88px; min-width:0; font-size:12px; letter-spacing:.005em; color:var(--muted) }
.meta .src { font-weight:500; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.meta .sep::before { content:"·"; opacity:.7 }
.meta .when { white-space:nowrap; font-variant-numeric:tabular-nums }
.meta svg.icon { width:13px; height:13px }
.title { margin:0; font-size:15px; font-weight:600; line-height:1.35; letter-spacing:-.005em; text-wrap:pretty }
:root:lang(zh-Hans) .title { line-height:1.5; letter-spacing:0 }
.summary { margin:0; font-size:13px; line-height:1.5; color:var(--text2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.text { margin:0; font-size:13px; line-height:1.55; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden }
:root:lang(zh-Hans) .summary, :root:lang(zh-Hans) .text { line-height:1.7 }
.read .title { font-weight:500; color:var(--muted) }
.read .summary, .read .text, .read .meta .src { color:var(--muted) }
.author { font-weight:500; color:var(--text) }
.read .author { color:var(--text2) }
.handle { color:var(--muted) }
mark { background:var(--warning-soft); color:inherit; border-radius:4px; padding:0 1px }
.star-mark { color:var(--star) }
.star-mark svg.icon { width:13px; height:13px }

.pic { position:relative; flex:none; overflow:hidden; border-radius:8px; background-color:var(--surface); outline:.5px solid rgba(var(--ink),.10); outline-offset:-.5px }
.thumb { width:96px; height:64px; margin-top:24px; align-self:flex-start }
.video-thumb { width:184px; aspect-ratio:16/9; border-radius:10px }
.min .video-thumb { width:136px }
.duration { position:absolute; right:6px; bottom:6px; padding:1px 6px; border-radius:5px; font-size:11px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums; background:rgba(28,24,18,.62); color:#fff }
.play { position:absolute; inset:0; display:grid; place-items:center; color:#fff }
.play span { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:rgba(28,24,18,.4); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px) }
.play svg.icon { width:16px; height:16px; fill:currentColor; margin-left:2px }
.grid { display:grid; gap:4px; margin-top:8px; border-radius:12px; overflow:hidden; max-width:440px }
.column.wide .grid { max-width:520px }
.grid.n1 { grid-template-columns:1fr; max-width:384px }
.grid.n2 { grid-template-columns:1fr 1fr }
.grid.n3 { grid-template-columns:1fr 1fr 1fr }
.grid .pic { border-radius:0; aspect-ratio:4/3 }
.grid.n3 .pic { aspect-ratio:1 }
.grid.n1 .pic { aspect-ratio:16/10; max-height:240px }
.grid .more b { position:absolute; inset:0; display:grid; place-items:center; background:rgba(28,24,18,.5); color:#fff; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums }
.single { margin-top:8px; aspect-ratio:3/2; max-height:320px; border-radius:12px }

/* Row actions: bare icons that fade in over the meta band, never a popover. */
.actions { position:absolute; top:14px; right:10px; display:flex; visibility:hidden; opacity:0; transition:opacity 120ms ease-out, visibility 0s 120ms }
.row.hover .actions, .row.chosen .actions, .row:hover .actions, .vcard.hover .actions, .vcard:hover .actions, .mtile.hover .actions, .mtile:hover .actions { visibility:visible; opacity:1; transition:opacity 120ms ease-out, visibility 0s }
.actions button { width:27px; height:24px; display:grid; place-items:center; border-radius:7px; color:var(--muted) }
.actions button:hover { background:var(--pressed); color:var(--text) }
.actions button:active { background:var(--sel) }
.actions button.starred { color:var(--star) }

/* Photo placeholders: a color fill only, so the gradient shows until the picture loads. */
.g1 { background-image:linear-gradient(135deg,#d6c7a8,#7b8f86) }
.g2 { background-image:linear-gradient(160deg,#283a4e,#7a5c86 60%,#e2a46d) }
.g3 { background-image:linear-gradient(120deg,#1c1c1c,#3c5e8a) }
.g4 { background-image:linear-gradient(200deg,#e9d8c4,#b98b6b) }
.g5 { background-image:linear-gradient(140deg,#0e1b2e,#223f6d 50%,#c9a35b) }
.g6 { background-image:linear-gradient(170deg,#7aa38a,#2f4f3f) }
.g7 { background-image:linear-gradient(110deg,#c56b4a,#f1c27d) }
.g8 { background-image:linear-gradient(150deg,#384b57,#99b1b8) }
.g9 { background-image:linear-gradient(130deg,#5a3d6b,#d08a92) }

/* Videos become a cover grid, Images a masonry wall. */
.vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); align-items:start; gap:24px 16px; padding:16px 24px 32px }
.vcard { position:relative; display:flex; flex-direction:column; gap:7px }
.vcard .video-thumb { width:100% }
.vcard .play { opacity:0; transition:opacity var(--t) }
.vcard.hover .play, .vcard:hover .play { opacity:1 }
.vcard .title { font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
:root:lang(zh-Hans) .vcard .title { line-height:1.5 }
.vcard.read .title { font-weight:500; color:var(--muted) }
.vcard .meta, .mtile .meta { padding-right:0 }
.vcard.hover .meta, .vcard:hover .meta, .mtile.hover .meta, .mtile:hover .meta { padding-right:84px }
.vcard .actions, .mtile .actions { top:auto; bottom:-2px; right:-4px }
.masonry { columns:3 170px; column-gap:14px; padding:16px 24px 32px }
.mtile { position:relative; break-inside:avoid; margin:0 0 20px; display:flex; flex-direction:column; gap:4px }
.mtile .pic { width:100% }
.mtile figcaption { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mtile.read figcaption { font-weight:500; color:var(--muted) }

.footer { display:flex; justify-content:center; align-items:center; gap:8px; padding:16px; font-size:12px; color:var(--muted) }
.spin { animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
.pill { position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:2; display:flex; align-items:center; gap:6px; height:28px; padding:0 12px 0 10px; border-radius:14px; background:var(--accent); color:var(--accent-text); font-size:12px; font-weight:500; box-shadow:0 4px 14px rgba(var(--shadow),.2) }
.pill svg.icon { width:14px; height:14px }

.skeleton .bar { height:10px; border-radius:5px; background:var(--surface) }
.skeleton .bar.t { height:14px; width:70% }
.skeleton .bar.s { width:92% }
.skeleton .bar.m { width:36% }

.empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center }
.tile { width:52px; height:52px; display:grid; place-items:center; border-radius:16px; background:var(--surface); color:var(--muted) }
.tile.danger { background:var(--danger-soft); color:var(--danger) }
.tile svg.icon { width:24px; height:24px; stroke-width:1.4 }
.empty h2 { margin:0; font-size:15px; font-weight:600 }
.empty p { margin:-4px 0 0; max-width:300px; letter-spacing:.005em; color:var(--muted) }
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border-radius:10px; background:var(--track); color:var(--text); font-weight:500 }
.button:hover { background:color-mix(in srgb,var(--track) 90%,var(--text)) }

.scrim { position:absolute; inset:0; z-index:3; display:grid; place-items:center; background:rgba(var(--shadow),.32) }
.toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:10px; max-width:calc(100% - 40px); min-height:40px; padding:6px 6px 6px 14px; border-radius:14px; background:#2a2620; color:#f4efe6; font-size:12.5px; box-shadow:0 10px 30px rgba(var(--shadow),.28), 0 0 0 .5px rgba(255,248,235,.08) }
:root[data-scheme=dark] .toast { background:#333837 }
.toast svg.icon { flex:none }
.toast .msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.toast .act { height:28px; padding:0 10px; border-radius:8px; color:inherit; font-weight:600; white-space:nowrap; background:rgba(255,248,235,.12) }
.toast .act kbd, .sheet kbd { font:inherit }
.toast .act kbd { margin-left:6px; font-weight:400; opacity:.6 }
.toast .x { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:inherit; opacity:.7 }
.toast .x svg.icon { width:14px; height:14px }
.toast.plain { padding-right:14px }
.sheet { width:560px; max-width:calc(100% - 48px); max-height:calc(100% - 48px); overflow:auto; border-radius:16px; background:var(--raised); box-shadow:0 0 0 .5px rgba(var(--ink),.12), 0 20px 50px rgba(var(--shadow),.25) }
.sheet header { display:flex; align-items:center; gap:12px; padding:16px 16px 8px 20px }
.sheet h2 { margin:0; flex:1; font-size:15px; font-weight:600 }
.sheet .close { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.sheet .close:hover { background:var(--hover) }
.sheet .cols { display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; padding:4px 20px 20px }
.window.min .sheet .cols { grid-template-columns:1fr }
.sheet h3 { margin:12px 0 4px; font-size:11px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--muted) }
.sheet dl { margin:0; display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 12px }
.sheet dt { padding:5px 0; font-size:12.5px }
.sheet dd { margin:0; display:flex; gap:4px; justify-content:flex-end }
.sheet kbd { min-width:22px; height:22px; padding:0 6px; display:inline-grid; place-items:center; border-radius:6px; background:var(--track); font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--text) }
.sheet .or { align-self:center; font-size:11px; color:var(--muted) }
.dot-inline { width:6px; height:6px; flex:none; border-radius:50%; background:var(--accent) }

const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');

document.documentElement.lang=lang;

document.getElementById('window').classList.toggle('wide',size==='wide');

  {source:2,kind:'article',when:ago('h',5),title:zh?'我的 2026 桌面工作流：少即是多':'My 2026 desktop workflow: less is more',summary:zh?'这一年我删掉了一半的应用，留下的每一个都必须回答一个问题：它让我更专注了吗？':'This year I removed half of my apps. Every one that stayed had to answer one question: does it help me focus?',read:true},
  {source:7,kind:'social',when:ago('h',7),author:zh?'中国国家地理':'China National Geography',handle:'Weibo',text:zh?'【秋日的喀纳斯】十月初，喀纳斯湖畔的白桦和落叶松陆续变黄，晨雾散开时，整片山谷像被点亮。':'Autumn at Kanas: in early October the birches and larches along the lake turn gold, and when the morning fog lifts the whole valley lights up.',images:['g6','g7','g4','g9','g1','g5'],read:true},
  {source:5,kind:'video',when:ago('d'),title:zh?'我们用三个月拍了一条只有 60 秒的片子':'Three months of shooting for a 60-second film',duration:'14:37',platform:zh?'哔哩哔哩':'Bilibili',thumb:'g7',read:true},
  {source:4,kind:'video',when:ago('days',2),title:zh?'行列式的几何意义':'The determinant, visualized',duration:'11:20',platform:'YouTube',thumb:'g3'},
  {source:9,kind:'image',when:ago('days',2),title:zh?'晨雾中的喀纳斯':'Morning fog over Kanas',images:['g6'],r:'3/2'},
  {source:5,kind:'video',when:ago('days',2),title:zh?'零下 30 度拍摄：器材实测':'Shooting at −30°C: a gear test',duration:'18:05',platform:zh?'哔哩哔哩':'Bilibili',thumb:'g6',read:true},
  {source:9,kind:'image',when:ago('days',3),title:zh?'沙丘的线条':'Lines in the dunes',images:['g7'],r:'4/5'},
  {source:8,kind:'image',when:ago('days',3),title:zh?'卡西尼号眼中的土星环':'Saturn’s rings, seen by Cassini',images:['g5'],r:'1/1',read:true},
  {source:4,kind:'video',when:ago('days',3),title:zh?'群论与魔群':'Group theory and the Monster',duration:'20:42',platform:'YouTube',thumb:'g9'},
  {source:9,kind:'image',when:ago('days',4),title:zh?'黄昏的港口':'Harbor at dusk',images:['g9'],r:'3/4'},
  {source:5,kind:'video',when:ago('days',4),title:zh?'一盏灯拍完一整天':'A whole day on set with one light',duration:'9:58',platform:zh?'哔哩哔哩':'Bilibili',thumb:'g8',read:true},
  {source:9,kind:'image',when:ago('days',5),title:zh?'老城的屋顶':'Old town roofs',images:['g4'],r:'3/2',read:true},
  {source:8,kind:'image',when:ago('days',5),title:zh?'特罗姆瑟上空的极光':'Aurora over Tromsø',images:['g8'],r:'4/3'},
];
const inScope=s=>scope==='all'||s.kind===scope||(scope==='source'&&s.id===1);
const markedCount=sources.filter(inScope).reduce((a,s)=>a+s.unread,0);
if(state==='marked-read'){entries.forEach(e=>{if(inScope(byId[e.source]))e.read=true});sources.filter(inScope).forEach(s=>s.unread=0)}
total=sources.reduce((a,s)=>a+s.unread,0);
const scopeName=kinds.includes(scope)?copy[scope]:scope==='source'?byId[1].name:copy.all;
const visible=kinds.includes(scope)?entries.filter(e=>e.kind===scope):scope==='source'?entries.filter(e=>e.source===1):entries.slice(0,7);
const filter=state==='unread-done'?1:state==='starred-none'?2:0;
const q=state==='search'?'sqlite':state==='search-none'?'kubernetes':state==='search-short'?'go':'';
const searching=q!=='';
const shown=state==='search'?entries.filter(e=>e.kind==='article'&&e.source===1):visible;

const navItem=(glyph,name,count,chosen,extra='',label='')=>`<button class="item${chosen?' chosen':''}" aria-current="${chosen}"${label?` aria-label="${label}"`:''}>${glyph}<span class="name">${name}</span>${extra}${count?`<span class="count">${count}</span>`:''}</button>`;
const failedText=s=>s.failing>1?t('failedTimes',{n:s.failing,error:s.error}):t('failedOnce',{error:s.error});
const failingName=s=>s.unread?t('failingUnread',{name:s.name,n:s.unread}):t('failingName',{name:s.name});
const sourceItem=s=>navItem(glyph(s),s.name,s.unread,scope==='source'&&s.id===1,s.failing?`<span class="warn" role="img" aria-label="${failedText(s)}" title="${failedText(s)}"${state==='failing'&&s.id===3?' id="tipped"':''}>${icon('alert')}</span>`:'',s.failing?failingName(s):'');
const failingSources=sources.filter(s=>s.failing);
const tabKind=scope==='source'?'article':scope;
const kindList=[['all','inbox'],...kinds.map(k=>[k,k])];
const kindCount=(k,counts)=>counts?(k==='all'?total:kindUnread(k)):0;
const tabs=counts=>`<nav class="kind-list" aria-label="${copy.kinds}">${kindList.map(([k,g])=>navItem(icon(g),k==='all'?copy.all:copy[k],kindCount(k,counts),k===tabKind)).join('')}</nav>`;
function sidebar(){
  if(state==='no-subscriptions')return `<aside>${tabs(false)}<nav class="nav"></nav>${serverBar()}</aside>`;
  const only=state==='failing-only';
  const list=only?failingSources:tabKind==='all'?sources:sources.filter(s=>s.kind===tabKind);
  const n=failingSources.length;
  const heading=only?`<div class="section with"><span>${copy.failingTitle}</span><button class="link plain">${copy.showAll}</button></div>`
    :n?`<div class="section with"><span>${tabKind==='all'?copy.sources:copy[tabKind]}</span><button class="link" aria-label="${t('failingShow',{n})}" title="${t('failingShow',{n})}">${icon('alert')}${t('failingCount',{n})}</button></div>`
    :`<div class="section">${tabKind==='all'?copy.sources:copy[tabKind]}</div>`;
  return `<aside>${tabs(true)}<nav class="nav" aria-label="${copy.sources}">${heading}${list.map(sourceItem).join('')}</nav>${serverBar()}</aside>`;
}
function serverBar(){return `<div class="server-bar"><button class="server" aria-label="${copy.thisComputer}">${icon('laptop')}<span class="name">${copy.thisComputer}</span><span class="dot${state==='offline'?' off':''}" aria-hidden="true"></span></button><button class="gear" aria-label="${copy.settings}" title="${copy.settings} (Ctrl+,)">${icon('settings')}</button></div>`}

const highlight=s=>q&&state==='search'?s.replace(new RegExp(q,'ig'),m=>`<mark>${m}</mark>`):s;
const actionButtons=(e,cls='')=>`<button class="${cls}${e.starred?' starred':''}" aria-label="${e.starred?copy.unstar:copy.star}" title="${e.starred?copy.unstar:copy.star}">${icon('star',e.starred?'filled':'')}</button>
  <button class="${cls}" aria-label="${e.read?copy.markUnread:copy.markRead}" title="${e.read?copy.markUnread:copy.markRead}">${icon(e.read?'mail':'mailOpen')}</button>
  <button class="${cls}" aria-label="${copy.open}" title="${copy.open}">${icon('external')}</button>`;
const actions=e=>`<div class="actions">${actionButtons(e)}</div>`;
const unreadDot=e=>e.read?'':`<span class="dot-inline" role="img" aria-label="${copy.unread}"></span>`;
const meta=(e,prefix='')=>{const s=byId[e.source];return `<div class="meta">${prefix}${glyph(s)}<span class="src">${s.name}</span><span class="sep"></span><span class="when">${e.when}</span>${e.starred?`<span class="star-mark" role="img" aria-label="${copy.starred}">${icon('star','filled')}</span>`:''}</div>`};
const pictures=list=>{
  if(list.length===1)return `<div class="grid n1"><div class="pic ${list[0]}"></div></div>`;
  if(list.length===2)return `<div class="grid n2">${list.map(g=>`<div class="pic ${g}"></div>`).join('')}</div>`;
  const hidden=list.length-3;
  return `<div class="grid n3">${list.slice(0,3).map((g,i)=>i===2&&hidden>0?`<div class="pic more ${g}" role="img" aria-label="${t('morePictures',{n:hidden})}"><b aria-hidden="true">+${hidden}</b></div>`:`<div class="pic ${g}"></div>`).join('')}</div>`;
};
const videoCover=(e,cls)=>`<div class="pic ${cls} ${e.thumb}" role="img" aria-label="${t('duration',{d:e.duration})}"><div class="play"><span>${icon('video')}</span></div><span class="duration">${e.duration}</span></div>`;

// All, Articles, Social: one column of rows
const row=(e,i)=>{
  const cls=`row${e.read?' read':''}${i===1&&state==='list'?' hover':''}${(i===2&&state==='list')||(i===3&&state==='no-more-unread')?' chosen':''}`;
  const dot=e.read?'':`<span class="unread-dot" role="img" aria-label="${copy.unread}"></span>`;
  switch(e.kind){
    case 'article':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<h3 class="title">${highlight(e.title)}</h3><p class="summary">${highlight(e.summary)}</p></div>${e.thumb?`<div class="pic thumb ${e.thumb}"></div>`:''}${actions(e)}</article>`;
    case 'video':return `<article class="${cls}">${dot}${videoCover(e,'video-thumb')}<div class="content">${meta(e)}<h3 class="title">${e.title}</h3><div class="meta">${icon('video')}<span>${e.platform}</span></div></div>${actions(e)}</article>`;
    case 'social':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<p class="text"><span class="author">${e.author}</span> <span class="handle">${e.handle}</span><br>${e.text}</p>${pictures(e.images)}</div>${actions(e)}</article>`;
    case 'image':return `<article class="${cls}">${dot}<div class="content">${meta(e)}<h3 class="title">${e.title}</h3><div class="pic single ${e.images[0]}"></div></div>${actions(e)}</article>`;
  }
};
// Videos and Images
const videoCard=(e,i)=>`<article class="vcard${e.read?' read':''}${i===0&&state==='list'?' hover':''}">${videoCover(e,'video-thumb')}<h3 class="title">${e.title}</h3>${meta(e,unreadDot(e))}${actions(e)}</article>`;
const masonryTile=(e,i)=>`<figure class="mtile${e.read?' read':''}${i===0&&state==='list'?' hover':''}"><div class="pic ${e.images[0]}" style="aspect-ratio:${e.r}" role="img" aria-label="${e.title}"></div><figcaption>${e.title}</figcaption>${meta(e,unreadDot(e))}${actions(e)}</figure>`;
const skeleton=()=>Array.from({length:4},(_,i)=>`<div class="row skeleton" aria-hidden="true"><div class="content" style="gap:8px"><div class="bar m"></div><div class="bar t"></div><div class="bar s"></div></div>${i%2?'':'<div class="pic thumb"></div>'}</div>`).join('');
const empty=(tile,title,hint,button='',cls='')=>`<div class="empty" role="status"><div class="tile ${cls}">${icon(tile)}</div><h2>${title}</h2><p>${hint}</p>${button}</div>`;
const more=state==='more'?`<div class="footer" role="status">${icon('loader','spin')}${copy.loadingMore}</div>`:'';

let list;
if(state==='loading')list=`<div class="column" aria-busy="true">${skeleton()}</div>`;
else if(state==='no-subscriptions')list=empty('rss',copy.noSubscriptions,copy.noSubscriptionsHint);
else if(state==='error')list=empty('wifiOff',copy.error,copy.errorHint,`<button class="button">${icon('refresh')}${copy.retry}</button>`,'danger');
else if(state==='unread-done')list=empty('circleCheck',copy.unreadDone,copy.unreadDoneHint);
else if(state==='starred-none')list=empty('star',copy.noStarred,copy.noStarredHint);
else if(state==='empty')list=empty('inbox',copy.empty,copy.emptyHint);
else if(state==='search-none')list=empty('search',t('noResults',{q}),copy.noResultsHint);
else if(scope==='video'&&state!=='search')list=`<div class="vgrid" role="feed" aria-label="${scopeName}">${shown.map(videoCard).join('')}</div>${more}`;
else if(scope==='image'&&state!=='search')list=`<div class="masonry" role="feed" aria-label="${scopeName}">${shown.map(masonryTile).join('')}</div>${more}`;
else list=`<div class="column${scope==='social'?' wide':''}" role="feed" aria-label="${scopeName}">${shown.map(row).join('')}${more}</div>`;

const unreadInScope=kinds.includes(scope)?kindUnread(scope):scope==='source'?byId[1].unread:total;
const sub=state==='no-subscriptions'||state==='error'?'':state==='search'?t('results',{n:1}):state==='unread-done'||state==='starred-none'||state==='empty'||state==='marked-read'?'':t('unreadCount',{n:unreadInScope});
const segments=[['inbox','everything'],['dot','unread'],['star','starred']].map(([g,k],i)=>`<button role="radio" aria-checked="${i===filter}" class="${i===filter?'on':''}" aria-label="${copy[k]}" title="${copy[k]}">${icon(g)}<span>${copy[k]}</span></button>`).join('');
const searchField=`<div class="search${searching?' focused':''}${state==='search-short'?' invalid':''}">${icon('search')}<input aria-label="${copy.searchLabel}" placeholder="${copy.search}" value="${q}" ${state==='search-short'?'aria-invalid="true" aria-describedby="hint"':''}>${searching?`<button class="clear" aria-label="${copy.clear}">${icon('x')}</button>`:''}</div>`;
const markAllName=t('markAllIn',{scope:scopeName});
const markAll=`<button class="tool" aria-label="${markAllName}" title="${markAllName}">${icon('checkCheck')}</button>`;
const columned=!((scope==='video'||scope==='image')&&state!=='search');
const toolbar=`<div class="toolbar${columned?' aligned':''}${scope==='social'?' wide':''}"><h1>${scopeName}</h1><span class="sub">${sub}</span><span class="spacer"></span><div class="segmented" role="radiogroup" aria-label="${copy.show}">${segments}</div>${searchField}${markAll}</div>`;
const hint=state==='search-short'?`<div class="hint" id="hint" role="status">${icon('alert')}${copy.tooShort}</div>`:'';
const stale=state==='offline'?`<div class="stale${columned?' aligned':''}${scope==='social'?' wide':''}" role="status">${icon('wifiOff')}<span>${t('offline',{time:'10:42'})}</span></div>`:'';
const pill=state==='new'?`<button class="pill">${icon('arrowUp')}${t('newEntries',{n:3})}</button>`:'';
const mod=navigator.platform.startsWith('Mac')?'⌘':'Ctrl+';
const toast=state==='marked-read'?`<div class="toast" role="status">${icon('checkCheck')}<span class="msg">${t('marked',{n:markedCount,scope:scopeName})}</span><button class="act">${copy.undo}<kbd>${mod}Z</kbd></button><button class="x" aria-label="${copy.dismiss}">${icon('x')}</button></div>`
  :state==='no-more-unread'?`<div class="toast plain" role="status">${icon('circleCheck')}<span class="msg">${copy.noMoreUnread}</span></div>`:'';
const keys=(...k)=>k.map(x=>Array.isArray(x)?x.map(y=>`<kbd>${y}</kbd>`).join(''):`<kbd>${x}</kbd>`).join(`<span class="or">${copy.or}</span>`);
const keyList=rows=>`<dl>${rows.map(([name,...k])=>`<dt>${copy[name]}</dt><dd>${keys(...k)}</dd>`).join('')}</dl>`;
const dialog=state==='keys'?`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kt"><header><h2 id="kt">${copy.keysTitle}</h2><button class="close" aria-label="${copy.close}">${icon('x')}</button></header><div class="cols"><div>
  <h3>${copy.inTimeline}</h3>${keyList([['kNext','J','↓'],['kPrev','K','↑'],['kNextUnread','N'],['kOpen','O','↩'],['kStar','S'],['kRead','M'],['kSearch','/',[mod,'F']],['kEscape','Esc'],['kUndo',[mod,'Z']]])}</div><div>
  <h3>${copy.inReader}</h3>${keyList([['kNextArticle','J'],['kPrevArticle','K'],['kNextUnread','N'],['kStar','S'],['kRead','M'],['kOpenBrowser','O'],['kBack','Esc']])}
  <h3>${copy.anywhere}</h3>${keyList([['kAdd',[mod,'N']],['kSettings',[mod,',']],['kKeys','?']])}</div></div></div></div>`:'';

document.getElementById('app').innerHTML=`${sidebar()}<section class="main">${toolbar}${hint}${stale}${pill}<div class="scroll">${list}</div>${toast}</section>${dialog}`;
if(state==='no-more-unread')document.querySelector('.row.chosen').scrollIntoView({block:'center'});
const tipped=document.getElementById('tipped');
if(tipped){const w=document.getElementById('window').getBoundingClientRect(),r=tipped.getBoundingClientRect();
  document.getElementById('window').insertAdjacentHTML('beforeend',`<div class="tip" role="tooltip" style="left:${r.left-w.left-8}px;top:${r.bottom-w.top+6}px">${tipped.title}</div>`)}
</script>
</html>
