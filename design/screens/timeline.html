<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline screen</title>
<!-- The timeline: every subscription's entries in one list, newest first, each kind with its own row. The sidebar
     chooses the scope (everything, one kind or one source); the bar above the list narrows it to unread or starred
     and searches it. Colors are the Oriel palette of design/tokens.md; icons are Lucide (ISC License). Pictures are
     drawn as gradients here; in the app they load in the background and show the Surface color until then.
     Row 2 shows the pointer resting on it (its actions show), row 3 the keyboard choice (focus ring).
     All, Articles, Social and a single subscription are one column; Videos is a cover grid and Images a masonry wall.
     Each kind has a viewer chosen in Settings (View as, a device preference): Articles List or Compact
     (article-compact), Videos Grid, Large cover or List (video-cover, video-list), Social Card or Compact
     (social-compact), Images Wall, Grid or Card (image-grid, image-card). The defaults, Grid for Videos and Wall for
     Images, are what Videos and Images show with no state. Grid, Wall and the square image Grid are used only in the
     Videos and Images scopes without a search; everywhere else those kinds draw their row or card, and Compact and
     Large cover apply everywhere (mixed-viewers). In Videos, Images and a single video or image subscription a bare
     icon right of the clock switches that scope between the list and the grid (the grid icon while the list shows,
     the list icon while the grid shows); it is never there in a search. Images switched to the list is image-switch,
     one image subscription as a grid is source-grid. The choice is kept per scope on this device and wins over
     the viewer; the grid is never suggested. The kinds sit on
     top of the sidebar as named items with counts; the sidebar then lists only that kind's subscriptions. The server bar at the
     bottom opens the connect screen; the gear beside it opens the settings.
     A social post's pictures stay low: one keeps its own ratio up to 240 high, two sit side by side, three or more
     are one row of three squares, the third covered with +N for the rest. Over a column, the toolbar lines its title
     and controls up with the column's edges, so a wide window keeps them together (size=wide).
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating pane of
     warm ink glass in both schemes, the content is warm paper, and the one capsule of glass in the toolbar is the
     segmented control; search is a flat fill and the tools are bare icons (docs/design.md, Title bar).
     The list order has no button: "Newest first" and "Oldest first" are the last two rows of the clock menu, under a
     hairline (order-oldest: the menu open, the oldest entries at the top, the clock tinted like a budget with no text
     beside it, and ". Oldest first" added to its name); it is a device preference, and in the oldest-first order no
     "N new" pill ever shows. dense is Settings > Appearance > Timeline > List density
     Compact: the same rows with less padding and smaller gaps, nothing left out.
     The bar is solid: it has no edge at the top, and scrolled (the list moved up under it) shows a hairline.
     Toolbar icon buttons are one spec, 32 square, 8 radius, 4 apart; a row's actions are smaller, 28 by 24 (docs/design.md, Toolbar buttons).
     Mark all as read names its scope in its tooltip, acts at once and offers Undo in a toast (marked-read), never a confirmation. N goes to the next
     unread entry; no-more-unread is what it says when there is none below. ? opens the keyboard shortcuts (keys).
     Cmd/Ctrl+K opens the command palette: palette (empty query: Actions, Kinds, then every subscription, the first
     row highlighted), palette-query (typing, ranked: prefix, word start, substring, scattered letters) and
     palette-none. 60% of the window high at most, anchored 15% from the top; Up and Down wrap.
     Site icons replace the monogram where a subscription has one; the ones here are generic stand-ins, not the
     sites' real icons, and The Go Blog shows the monogram a subscription without an icon keeps.
     Refresh all (Subscriptions menu, Cmd/Ctrl+R, the palette) has no button: while it runs, the heading's failing count
     gives way to a muted progress link, a turning loader and "3/12" (refreshing); the result is a plain toast with the
     tile of the other plain toasts: all checked (refreshed), some failed (refreshed-failed, the alert mark), stopped
     waiting after a timeout (refreshed-part) or nothing active to refresh (refresh-none).
     A failing subscription carries the warning mark; its row's name says so ("The Go Blog, last fetch failed"), and the
     mark's tooltip gives how many times in a row and the reason (failing, the pointer resting on the mark). While any
     fail, the Subscriptions heading ends in "N failing", which narrows the list to them until Show all (failing-only).
     When a background check fails after the list has loaded, the list stays whole and usable and a quiet line under
     the toolbar says so ("Can't reach the server · last updated 10:42 AM", offline): muted text, a Warning-tinted
     wifi-off mark, and at its end a quiet "Try again" text button (offline). While the server stays out of reach the
     app checks again after 3, 5, 10 and then every 30 seconds, and when the window is brought forward or the computer
     wakes; "Try again" checks at once, and while the check runs the button reads "Retrying…" and is dimmed
     (offline-retrying). The line clears by itself on the next successful check, and is announced once (polite status).
     A star or read change made while the server is out of reach stays on the row and is sent when it comes back,
     not rolled back; until then the row's meta line carries a small muted upload mark after the star, named "Waiting
     to save" (offline-pending, the first two rows). The waiting changes live in memory only and are lost on quit.
     With no subscription yet (no-subscriptions) the empty state offers three ways in: the primary "Add your first
     subscription" opens the add dialog, and the quiet "Import OPML…" and "Restore from backup…" beside it open Settings
     on Import and export, where the backup file is chosen and the restore confirmed.
     The hint adds one line saying that links to YouTube, X, GitHub and the like work too.
     After a subscription is added or refreshed its row shows a spinner in place of the warning mark until the first
     fetch is done (fetching; the row's name for a screen reader gains ", fetching"), then one plain toast with no Undo
     says the result: "Fetched 12 entries from ..." (fetched) or "Couldn't fetch ...: reason" with the Warning alert mark
     (fetched-failed); when the site's bot protection turned the fetch away the reason is a localized sentence that
     names rsshub.app and Settings → RSSHub, or says the site blocks automated readers (subscriptions.html, edit-blocked).
     Polling ends silently after 60 seconds.
     Mark all as read has a menu of its own on right click (menu-markall): Mark all as read, as the click, a hairline, then Mark older than 1 day,
     1 week, 1 month as read. They mark the unread entries of the scope whose time, the one the row shows, is before now minus that long, act at once and offer
     Undo in the same toast (marked-older: it says how old and how many); when none is that old a plain toast says so (marked-older-none), without Undo.
     They are off where Mark all as read is.
     Right click opens a menu. On an entry (menu-entry): Star, Mark as read or unread and Open in browser, as the row's
     actions have them, then Copy link (puts the entry's original address on the clipboard; toast "Link copied", as in the reader's link-copied; dimmed for an entry with no link), a hairline, Copy as Markdown and Save as Markdown… (the same two as the reader's More menu; Copy puts
     the article on the clipboard and says "Copied", Save asks where to put the .md file), then Mark above as read, which marks the unread entries listed above this one (not this one)
     and is dimmed when there are none (menu-entry-first) or under Starred and search. On a subscription (menu-feed,
     the sidebar keeps the existing menu of subscriptions.html): Mark subscription as read sits under Refresh and is
     dimmed when it has nothing unread (menu-feed-none); the three Mark older than ... as read items follow it and are dimmed with it. All act at once and offer Undo in the same toast as Mark all
     as read (marked-above, marked-feed).
     V marks the entries fully in view as read and scrolls so the first entry below them is at the top, the keyboard choice
     on it (marked-visible, drawn after the press: eight entries were in view, five of them unread, so the toast says 5; the next one is chosen).
     It marks from the first entry fully in view to the last one fully in view; a row cut at the top or bottom edge stays
     unread. It offers Undo in the same toast as Mark all as read, and is off under Starred and search. With nothing
     unread in view it only scrolls, without a toast.
     A filter field sits under the Subscriptions heading (side-filter): a flat ink fill, the magnifier, the input and a clear
     button once there is text, and beside it the Unread first toggle, an arrow-up-down icon button that is a fill plus an
     Accent icon while on (side-unread-first: unread count descending, then name). The field narrows the list by name as
     you type, ignoring case; when nothing matches the list gives way to one muted line (side-filter-none). It is hidden
     while there are no subscriptions. Esc clears the text, then a second Esc hands the focus to the sidebar; Down or
     Enter hands it to the first match.
     The keyboard reaches the sidebar too (sidebar-focus, the focus ring on the chosen item): 1 to 5 switch to All and
     the four kinds from anywhere in the timeline; H or Left moves the focus to the chosen item of the sidebar, Up and
     Down walk its kinds and subscriptions, Enter chooses one and the focus stays on it, and L, Right or Escape
     returns it to the list, the chosen entry focused. While the sidebar has the focus the entry keys (J K O S M N V,
     Up and Down) leave the entries alone. Shift+F10 or the Menu key opens the menu of the focused subscription or
     entry (menu-feed and menu-entry look the same); a Mac has no Menu key, so there it is Shift+F10 (fn on laptops).
     All of them are listed in the key sheet (keys) and are off while the search field has the focus, a dialog is
     open or the reader shows. A switch made from the keyboard is announced ("Videos, 12 unread").
     The sidebar button is a bare 32 square panel-left icon, "Hide sidebar" while the pane shows, "Show sidebar" once it is hidden
     (sidebar-hidden; Cmd+\\ or Ctrl+\\ does the same, listed under Anywhere in the keys sheet). Shown, it sits at the right end of
     the pane's top 40, 8 from the pane's edge and centered on the toolbar row's middle line, level with the window buttons.
     Hidden, the pane is gone with no rail, the main column takes the whole width (also at size=min) and the toolbar pads its
     left by the width of the window buttons, which then sit over it; the button is the first item of the toolbar, right
     after them, before the title, and stays on the same line as when the pane showed. The choice is remembered.
     A source with a pace fades its unread entries during the last quarter of their time (expiring): the whole row goes
     from full to 55% opacity, linearly, and its accessible name ends with "leaving the timeline soon". Nothing else changes.
     The toolbar is three parts: the title (with the count and the edit button) at the leading end, the segments in the middle,
     and at the trailing end the icon buttons (reading time, grid switch where it applies, mark all as read) with search
     last at the far right. The title's part and the trailing part take equal room, so the segments are centered in the
     main column. Search is a 200 wide field (it gives up width before anything else, down to 48) from a 736 wide column;
     narrower (size=min) it is a 32 square magnifier button after the other buttons and, clicked, opens the field over them
     (search-open) until it loses the focus with no text in it.
     Edge cases (long-titles, many-feeds, broken-images; the rules are in docs/design.md, The timeline). A title stops
     at two lines in a row and in a video card, at one in a picture's caption, a subscription's name in the sidebar, the
     source name in the meta line and the screen title, each with an ellipsis; a Chinese title breaks between any two
     characters and a word that does not fit breaks where it must. The sidebar's name shows in full in a tooltip once
     the pointer rests on it, the reader shows the full title. With about 60 subscriptions only the heading and the
     subscriptions scroll: the kinds above them and the server bar below stay. A picture that fails to load keeps its
     box on the Track color with a muted image mark (a video cover keeps its play mark and duration); a site icon
     that fails keeps the monogram.
     The lightbox (lightbox, lightbox-failed; docs/design.md, The lightbox) is where the pictures of a social or image
     entry are viewed in the app: a click on a picture in a row opens it on that picture (here picture 3 of 12 of the
     first post), the title and text still open the browser. It covers the whole window with a dim layer, dark in both
     schemes; the picture is fitted and centered; the counter is centered in the bar beside the window buttons, the
     actions (Open in browser, Open picture in browser, Close) sit at the right and Previous and Next at the sides.
     lightbox-failed is picture 4 of 12 that did not load: a muted box with the image mark and a line, paging and the
     browser buttons still work. Below 760 (size=min) "Open in browser" is the icon alone. Space on a chosen row opens
     the lightbox on its first picture (keys).
     The bar above the window only switches the mockup.
     Reading time: a row's meta line ends with a quiet "6 min read" after the time, for an article or a post whose estimate is
     a minute or more; a video, an image and anything shorter show none. The clock button right of the segments narrows
     the list to what fits the time you have (time-menu: Any length, 5, 10, 15, 30 minutes, the current one checked;
     time-10: the chip reads "≤ 10 min" and the list holds what fits, newest first, including entries too short to
     carry a label and videos of up to 10 minutes; time-empty: 5 minutes together with Unread leaves nothing and the
     empty state offers Show any length). It is a view filter that marks nothing, hides the unread count and dims
     Mark all as read. Below 760 (size=min) the chip is the icon with a dot.
     URL parameters: state, scope=all|article|video|social|image|source, scheme=light|dark, lang=en|zh-Hans,
     size=default|min|wide. -->
<style>
:root { color-scheme:light; --stage:#dedad2; --stage-text:#4f4a42; --shadow:28,24,18; --t:140ms ease-out;
  --background:#fdfcfa; --surface:#f6f3ee; --raised:#ffffff; --track:#ece8e0; --disabled:#b3ada1;
  --text:#25221e; --text2:#58534a; --muted:#736d62; --prose:#3a362f;
  --ink:37,34,30; --hover:rgba(var(--ink),.03); --pressed:rgba(var(--ink),.05); --sel:rgba(var(--ink),.065); --border:rgba(var(--ink),.075);
  --accent:#2a6d65; --accent-hover:#225a54; --accent-text:#ffffff; --accent-soft:rgba(42,109,101,.09); --focus:rgba(42,109,101,.7);
  --danger:#b4533c; --danger-soft:rgba(180,83,60,.09); --warning:#9a7222; --warning-soft:rgba(154,114,34,.10); --success:#4c7c59; --star:#b98a22;
  --chrome:#37332e; --chrome-ink:255,248,235; --chrome-text:#ece7dd; --chrome-text2:#cdc7bb; --chrome-muted:#a49e91;
  --glass:rgba(255,254,251,.66); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.95), 0 0 0 .5px rgba(var(--ink),.12), 0 2px 12px rgba(var(--ink),.07) }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0b0c0c; --stage-text:#8a918f;
  --background:#171918; --surface:#1d1f1e; --raised:#252827; --track:#2c2f2e; --disabled:#565b59;
  --text:#dde1df; --text2:#aab0ae; --muted:#8a918f; --prose:#c3c9c7;
  --ink:234,240,238; --hover:rgba(var(--ink),.04); --pressed:rgba(var(--ink),.06); --sel:rgba(var(--ink),.08); --border:rgba(var(--ink),.075);
  --accent:#78beb1; --accent-hover:#8ccbbf; --accent-text:#10241f; --accent-soft:rgba(120,190,177,.12); --focus:rgba(120,190,177,.7);
  --danger:#e0897a; --danger-soft:rgba(224,137,122,.13); --warning:#d6aa55; --warning-soft:rgba(214,170,85,.13); --success:#8ab997; --star:#e2b24f;
  --chrome:#1a2422; --chrome-ink:235,248,244; --chrome-text:#e8eeec; --chrome-text2:#cbd5d2; --chrome-muted:#93a39f;
  --glass:rgba(58,63,62,.52); --glass-rim:inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 .5px rgba(0,0,0,.55) }
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
body { margin:0; padding:24px; font:13px/1.5 system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
:root:lang(zh-Hans) body { line-height:1.65 }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default; transition:background-color var(--t), color var(--t), opacity var(--t) }
button:focus-visible { outline:2px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

/* Window: no title bar, the window buttons over the sidebar's top; the sidebar is an ink pane of glass floating 8
   from the window's edges; the content is paper and never sits on glass. */
.window { position:relative; width:960px; height:640px; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; background:var(--background); box-shadow:0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px rgba(var(--shadow),.28) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.65) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }

/* Sidebar: warm charcoal in both schemes, so its roles are its own: light on dark, warm-white state fills (5.5, 8.5
   and 12%), its own accent. The selection is the fill plus the icon in Accent. */
aside { width:216px; flex:none; display:flex; flex-direction:column; margin:8px 0 8px 8px; padding-top:40px; position:relative; border-radius:14px;
  background:var(--chrome);
  box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.10), 0 0 0 .5px rgba(0,0,0,.35), 0 6px 24px rgba(var(--shadow),.14);
  --ink:var(--chrome-ink); --text:var(--chrome-text); --text2:var(--chrome-text2); --muted:var(--chrome-muted); --accent:#7cc9bb; --warning:#d6aa55; --success:#8ab997;
  --hover:rgba(var(--ink),.055); --pressed:rgba(var(--ink),.085); --sel:rgba(var(--ink),.12); --border:rgba(var(--ink),.08); --track:rgba(var(--ink),.11) }
:root[data-scheme=dark] aside { box-shadow:inset 0 0 0 .5px rgba(var(--chrome-ink),.08), 0 0 0 .5px rgba(0,0,0,.7) }
.min aside { width:184px }
.sbtn.pane { position:absolute; top:2px; right:9px }
.kind-list { flex:none; padding:0 8px 8px; display:flex; flex-direction:column; gap:1px }
.nav { flex:1; overflow-y:auto; padding:4px 8px 6px }
.nav::-webkit-scrollbar { width:10px }
.nav::-webkit-scrollbar-thumb { border:3px solid transparent; border-radius:5px; background:rgba(var(--ink),.28) padding-box }
.section { margin:14px 10px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
.section { display:flex; align-items:center; gap:6px; height:22px; margin-right:6px }
.section span { flex:1; min-width:0 }
.section .add { width:22px; height:22px; flex:none; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.section .add:hover { background:var(--hover); color:var(--text) }
.section .add svg.icon { width:14px; height:14px }
.section .link { display:flex; align-items:center; gap:4px; height:20px; padding:0 6px; border-radius:6px; font:inherit; letter-spacing:inherit; color:var(--warning) }
.section .link.plain { color:var(--text2) }
.section .link.progress { cursor:default; font-variant-numeric:tabular-nums }
.section .link.progress:hover { background:none }
.section .link:hover, .section .link.hover { background:var(--hover) }
.section .link svg.icon { width:12px; height:12px }
.side-tools { display:flex; align-items:center; gap:4px; margin:0 3px 6px 0 }
.side-filter { flex:1; min-width:0; height:28px; display:flex; align-items:center; gap:6px; padding:0 4px 0 10px; border-radius:8px; background:var(--hover); color:var(--muted); transition:background-color var(--t), box-shadow var(--t) }
.side-filter:hover { background:var(--pressed) }
.side-filter.focused { background:var(--pressed); box-shadow:0 0 0 2px rgba(124,201,187,.7) }
.side-filter svg.icon { width:14px; height:14px; flex:none }
.side-filter input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--text) }
.side-filter input::placeholder { color:var(--muted) }
.side-filter .clear { width:20px; height:20px; flex:none; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.side-filter .clear:hover { background:var(--hover); color:var(--text) }
.side-filter .clear svg.icon { width:12px; height:12px }
.sort { width:28px; height:28px; flex:none; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.sort:hover { background:var(--hover); color:var(--text2) }
.sort[aria-pressed=true] { background:var(--sel); color:var(--accent) }
.sort svg.icon { width:14px; height:14px }
.side-none { margin:6px 10px; font-size:13px; color:var(--muted) }
.tip { position:absolute; z-index:5; max-width:260px; padding:5px 9px; border-radius:6px; font-size:12px; line-height:1.4; color:var(--text); background:var(--raised); box-shadow:0 0 0 .5px rgba(var(--shadow),.18),0 4px 14px rgba(var(--shadow),.16) }
:root:lang(zh-Hans) .section { font-size:12px; letter-spacing:.02em }
.item { width:100%; height:30px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:8px; color:var(--text); text-align:left }
.item:hover { background:var(--hover) }
.item:active { background:var(--pressed) }
.item.chosen { background:var(--sel) }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text2) }
.item.chosen .name { font-weight:500; color:var(--text) }
.item .count { font-size:11px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums; color:var(--muted) }
.item:hover .count, .item.chosen .count { color:var(--text2) }
.item .warn { color:var(--warning) }
.item .busy { display:inline-flex; color:var(--muted) }
.item .busy svg.icon { width:13px; height:13px }
.kind-list .item svg.icon { color:var(--muted) }
.kind-list .item:hover svg.icon { color:var(--text2) }
.kind-list .item.chosen svg.icon { color:var(--accent) }

/* One shape for every source icon: size, radius and hairline; monograms are neutral, never colored by kind. */
.fav, .mono { width:18px; height:18px; flex:none; border-radius:5px }
.fav { position:relative; overflow:hidden }
.fav::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 .5px rgba(var(--ink),.2) }
.fav svg { display:block; width:100%; height:100% }
.mono { display:grid; place-items:center; font-size:10.5px; font-weight:600; background:var(--track); color:var(--text2) }
.meta .fav, .meta .mono { width:15px; height:15px; border-radius:4px }
.meta .mono { font-size:9px }
.server-bar { flex:none; display:flex; align-items:center; padding:0 11px 6px 0 }
.server { flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 18px; text-align:left; font-size:12px; letter-spacing:.01em; color:var(--muted) }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }
.server .dot.off { background:var(--warning) }
.gear { flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.gear:hover { background:var(--hover); color:var(--text) }

/* Toolbar: no bar. The title is bare over the content, which fades under it (the soft scroll edge). The segmented
   control is the one glass capsule; search is a flat ink fill and the tools are bare icons. */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.main::before { content:""; position:absolute; top:0; left:0; right:0; height:52px; background:var(--background); z-index:1; pointer-events:none }
.main::after { content:""; position:absolute; top:52px; left:0; right:0; height:.5px; background:var(--border); opacity:0; transition:opacity 120ms ease-out; z-index:1; pointer-events:none }
.main.scrolled::after { opacity:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; display:flex; align-items:center; gap:10px; padding:0 12px 0 12px }

.timebtn { flex:none; position:relative; height:32px; min-width:32px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; color:var(--muted) }
.timebtn:hover { background:var(--hover); color:var(--text) }
.timebtn.on, .timebtn.on:hover { padding:0 12px 0 9px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:500; letter-spacing:.01em; white-space:nowrap; font-variant-numeric:tabular-nums }

/* Several sources carry the same article: one row, with a quiet chip after the time that names how many other sources
   have it. It is a text button in the meta band (muted, hover fill), never a badge; open, it unfolds the list of the other
   sources under the row, indented behind a hairline. */
.also { flex:none; display:inline-flex; align-items:center; gap:3px; height:20px; margin:0 -4px 0 0; padding:0 6px 0 4px; border-radius:6px; font:inherit; font-size:12px; color:var(--muted); white-space:nowrap }

/* Timeline: rows are 12-radius fills; the pointer, a press and the choice fill with the 3, 5 and 6.5% ink steps
   (4, 6 and 8% in dark). The choice also carries a small accent marker inside the fill, 8 from its left edge. */
.scroll { flex:1; overflow-y:auto; padding-top:52px }
.column { max-width:680px; margin:0 auto; padding:6px 24px 40px }
.column.wide { max-width:720px }
.row { position:relative; display:flex; gap:14px; padding:16px 16px 16px 28px; margin:0 -16px; border-radius:12px; transition:background-color var(--t) }

.unread-dot { position:absolute; left:14px; top:23px; width:7px; height:7px; border-radius:50%; background:var(--accent) }
.content { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px }

:root:lang(zh-Hans) .summary, :root:lang(zh-Hans) .text { line-height:1.7 }
.summary.ai { display:flex; gap:6px; align-items:flex-start }

.author { font-weight:500; color:var(--text) }

mark { background:var(--warning-soft); color:inherit; border-radius:4px; padding:0 1px }

.play span { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:rgba(28,24,18,.4); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px) }

/* Photo placeholders: a color fill only, so the gradient shows until the picture loads. */

   Large cover: the 16:9 cover at the column's width. Grid: cells that share the width, in rows. */

.dense .row.crow { height:30px; padding-top:0; padding-bottom:0 }

.strip .pic { width:40px; height:40px; border-radius:6px }

.strip .more b { position:absolute; inset:0; display:grid; place-items:center; background:rgba(28,24,18,.5); color:#fff; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums }
.thumb-s { width:56px; height:56px; margin-top:24px; align-self:flex-start; border-radius:8px }

.pill { position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:2; display:flex; align-items:center; gap:6px; height:28px; padding:0 12px 0 10px; border-radius:14px; background:var(--accent); color:var(--accent-text); font-size:12px; font-weight:500; box-shadow:0 4px 14px rgba(var(--shadow),.2) }

.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border-radius:10px; background:var(--track); color:var(--text); font-weight:500 }
.button:hover { background:color-mix(in srgb,var(--track) 90%,var(--text)) }
