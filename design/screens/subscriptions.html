<title>Subscriptions</title>
<!-- Adding, editing and deleting subscriptions, over the timeline. "+" next to Subscriptions in the sidebar, the
     button of the empty timeline, and Cmd/Ctrl+N open the add dialog; right click on a subscription, or the pencil
     in the toolbar while one subscription is chosen, edits it. The address field recognizes platform links and
     says what it will subscribe to before anything is sent; the server checks again. Colors are the Oriel palette of
     design/tokens.md; icons are Lucide (ISC License). The edit dialog ends with the subscription's summaries and
     translations: switches that queue new entries, and prompts that replace the global ones in Settings; edit-ai
     shows that part scrolled into view, edit-ai-off the same while AI is not set up. A dialog taller than the window
     keeps its header and buttons in place and scrolls only the form, with a divider under the header once scrolled
     and above the buttons while more is below.
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating ink pane
     of glass and the toolbar's title sits bare over the content (docs/design.md, Title bar).
     Subscriptions show their site icon (generic stand-ins here); The Go Blog has none, so it keeps its monogram,
     in the list and in the edit dialog's header.
     On a subscription whose last fetch failed, Refresh reads Try again, in its menu (menu-failing) and beside the
     reason in the edit dialog (edit-failing).
     The check interval offers Auto first, which is also the default of a new subscription: the app works the
     interval out from how often the feed publishes, between 15 minutes and a day, and the edit dialog shows what it
     is now (Auto · 6 h). After the first fetch a feed that looks like another kind gets a line under the kind
     picker (edit-suggest) with a button; nothing changes until it is pressed and the dialog saved.
     The bar above the window only switches the mockup.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min. -->

<div class="switcher" aria-hidden="true">
  <label>state <select id="state"></select></label>

<script>
const states=['add','add-link','add-feed','add-route','add-route-no-base','add-invalid','add-exists','adding','empty','menu','menu-failing','edit','edit-failing','edit-paused','edit-ai','edit-ai-off','edit-suggest','delete'];
const query=new URLSearchParams(location.search);
const pick=(name,list,fallback)=>list.includes(query.get(name))?query.get(name):fallback;
const options={state:states,scheme:['light','dark'],lang:['en','zh-Hans'],size:['default','min']};
const state=pick('state',states,'add');
const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');
document.documentElement.dataset.scheme=scheme;
document.documentElement.lang=lang;
document.getElementById('window').classList.toggle('min',size==='min');
for(const [id,list] of Object.entries(options)){
  const select=document.getElementById(id);
  select.innerHTML=list.map(s=>`<option>${s}</option>`).join('');
  select.value={state,scheme,lang,size}[id];
  select.onchange=()=>{query.set(id,select.value);location.search=query};
}

const icons={
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  article:'<path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/>',
  video:'<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
  social:'<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  rss:'<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',

  laptop:'<path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/>',
};
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;

const copy={

    found:{bilibili:'Bilibili · videos of user 2267573', feed:'Feed at go.dev', route:'RSSHub route'},
    needsBase:'RSSHub routes need an RSSHub instance. Enter its address; it is saved in Settings.',

// Site icons are generic stand-ins, not the sites' real icons; The Go Blog has none and keeps its monogram.
const favs={
  simon:'<rect width="16" height="16" fill="#1d1d1f"/><path d="M4 11.5 8 4l4 7.5z" fill="#f5d547"/>',
  b3:'<rect width="16" height="16" fill="#2b4c7e"/><circle cx="5.5" cy="9" r="2.6" fill="#7fb3e8"/><circle cx="10.5" cy="7" r="3.2" fill="#a46a3a"/>',
  rauchg:'<rect width="16" height="16" fill="#000"/><path d="M8 3.5 13 12H3z" fill="#fff"/>',
  nasa:'<rect width="16" height="16" fill="#0b3d91"/><circle cx="8" cy="8" r="4.2" fill="#fff"/><path d="M2.5 10.5c4-1 7-3 11-6" stroke="#fc3d21" stroke-width="1.5" fill="none"/>',
};
const sources=[
  {kind:'article',name:'Simon Willison',mono:'S',unread:4,fav:favs.simon},
  {kind:'article',name:'The Go Blog',mono:'G',unread:14,failing:state==='edit-failing'||state==='menu-failing',paused:state==='edit-paused'},
  {kind:'video',name:'3Blue1Brown',mono:'3',unread:2,fav:favs.b3},
  {kind:'social',name:'@rauchg',mono:'R',unread:9,fav:favs.rauchg},
  {kind:'image',name:'NASA APOD',mono:'N',unread:1,fav:favs.nasa},
];
const empty=state==='empty';
const editing=['menu','menu-failing','edit','edit-failing','edit-paused','edit-ai','edit-ai-off','edit-suggest','delete'].includes(state);
const tabs=`<nav class="kind-list" aria-label="${copy.kinds}">${[['all','inbox'],['article','article'],['video','video'],['social','social'],['image','image']].map(([k,g],i)=>`<button class="item${i===0?' chosen':''}" aria-current="${i===0}">${icon(g)}<span class="name">${copy[k]}</span>${empty?'':`<span class="count">${[30,18,2,9,1][i]}</span>`}</button>`).join('')}</nav>`;
const item=(s,i)=>`<button class="item${editing&&i===1?' chosen':''}${state.startsWith('menu')&&i===1?' menued':''}${s.paused?' is-paused':''}">${s.fav?`<span class="fav" aria-hidden="true"><svg viewBox="0 0 16 16">${s.fav}</svg></span>`:`<span class="mono k-${s.kind}">${s.mono}</span>`}<span class="name">${s.name}</span>${s.failing?`<span class="warn" role="img" aria-label="${copy.failingMark}">${icon('alert')}</span>`:''}${s.paused?`<span class="paused" role="img" aria-label="${copy.pausedMark}">${icon('pause')}</span>`:''}<span class="count">${s.paused?'':s.unread}</span></button>`;
const sidebar=`<aside>${tabs}<nav class="nav" aria-label="${copy.sources}"><div class="section"><span>${copy.sources}</span><button class="${state==='add'?'hover':''}" aria-label="${copy.add}" title="${copy.add} (⌘N)">${icon('plus')}</button></div>${empty?'':sources.map(item).join('')}</nav><div class="server">${icon('laptop')}<span class="name">${copy.thisComputer}</span><span class="dot"></span></div></aside>`;
const rows=Array.from({length:5},(_,i)=>`<div class="bars"><div class="bar" style="width:${30+i%3*6}%"></div><div class="bar" style="width:${74-i*5}%;height:14px"></div><div class="bar" style="width:${90-i*3}%"></div></div>`).join('');
const toolbar=`<div class="toolbar"><h1>${editing?'The Go Blog':copy.all}</h1><span class="sub">${empty?'':copy.unread}</span>${editing?`<button class="tool${state==='edit'?' hover':''}" aria-label="${copy.editSource}" title="${copy.editSource}">${icon('pencil')}</button>`:''}<span class="spacer"></span><div class="ghost"></div></div>`;
const main=empty
  ?`<section class="main">${toolbar}<div class="empty" role="status"><div class="tile">${icon('rss')}</div><h2>${copy.noSubscriptions}</h2><p>${copy.noSubscriptionsHint}</p><button class="button primary">${icon('plus')}${copy.addHere}</button></div></section>`
  :`<section class="main">${toolbar}<div class="column" aria-hidden="true">${rows}</div></section>`;

const kindPicker=on=>`<div class="field"><span class="label" id="kind">${copy.showAs}</span><div class="kinds" role="radiogroup" aria-labelledby="kind">${['article','video','social','image'].map(k=>`<button role="radio" aria-checked="${k===on}" class="${k===on?'on':''}" aria-label="${copy[k]}">${icon(k)}<span>${copy[k]}</span></button>`).join('')}</div></div>`;
const select=(label,value)=>`<div class="field"><label>${label}</label><div class="box select" role="combobox" aria-label="${label}"><span>${value}</span>${icon('chevron')}</div></div>`;
const foundCard=(kind,what,code)=>`<div class="found" role="status">${icon(kind==='feed'?'rss':kind)}<div class="what"><b>${what}</b><code>${code}</code></div>${icon('check')}</div>`;

function addDialog(){
  const value={add:'','add-link':'https://space.bilibili.com/2267573','add-feed':'https://go.dev/blog/feed.atom','add-route':'/github/trending/daily','add-route-no-base':'/github/trending/daily','add-invalid':'go.dev/blog','add-exists':'https://go.dev/blog/feed.atom',adding:'https://space.bilibili.com/2267573'}[state];
  const kind=['add-link','adding'].includes(state)?'video':'article';
  const invalid=state==='add-invalid'||state==='add-exists';
  let below=`<span class="help" id="ah">${copy.addressHelp}</span>`;
  if(state==='add-link'||state==='adding')below=foundCard('video',copy.found.bilibili,`${copy.viaRsshub} /bilibili/user/video/2267573`);
  if(state==='add-feed')below=foundCard('feed',copy.found.feed,'https://go.dev/blog/feed.atom');
  if(state==='add-route')below=foundCard('article',copy.found.route,'/github/trending/daily');
  if(state==='add-route-no-base')below=`<div class="needs" role="status"><div class="head">${icon('triangle')}<span>${copy.needsBase}</span></div><div class="box focused">${icon('link')}<input aria-label="${copy.rsshubAddress}" placeholder="${copy.rsshubPlaceholder}"></div></div>`;
  if(state==='add-invalid')below=`<span class="error" id="ae">${icon('alert')}${copy.invalidUrl}</span>`;
  if(state==='add-exists')below=`<span class="error" id="ae">${icon('alert')}<span>${copy.exists} <a href="#" style="color:inherit;font-weight:500">${copy.show}</a></span></span>`;
  const busy=state==='adding';
  return `<div class="scrim"><div class="dialog" role="dialog" aria-labelledby="dt">
    <header><div class="tile" style="width:32px;height:32px;border-radius:8px">${icon('rss')}</div><div class="titles"><h2 id="dt">${copy.add}</h2></div><button class="close" aria-label="${copy.close}">${icon('x')}</button></header>
    <div class="form">
      <div class="field"><label for="addr">${copy.address}</label><div class="box${state==='add'||state==='add-invalid'?' focused':''}${invalid?' invalid':''}">${icon('link')}<input id="addr" value="${value}" placeholder="${copy.addressPlaceholder}" ${invalid?'aria-invalid="true" aria-describedby="ae"':''}></div>${below}</div>
      ${kindPicker(kind)}
      <div class="pair"><div class="field"><label>${copy.title}</label><div class="box"><input placeholder="${copy.titlePlaceholder}"></div></div>${select(copy.every,copy.auto)}</div>
    </div>
    <footer><span class="spacer"></span><button class="button">${copy.cancel}</button><button class="button primary"${state==='add'||invalid?' disabled':''}>${busy?icon('loader','spin')+copy.adding:copy.addShort}</button></footer>
  </div></div>`;
}

function editDialog(){
  const failing=state==='edit-failing', paused=state==='edit-paused', ai=state==='edit-ai';
  const health=failing
    ?`<div class="health bad" role="status">${icon('alert')}<span>${copy.failing}</span><button class="button small">${icon('refresh')}${copy.retry}</button></div>`
    :paused?`<div class="health" role="status">${icon('pause')}<span>${copy.paused}</span></div>`
    :`<div class="health" role="status">${icon('check')}<span>${copy.checked}</span><button class="button small">${icon('refresh')}${copy.refresh}</button></div>`;
  return `<div class="scrim"><div class="dialog wide" role="dialog" aria-labelledby="dt">
    <header><span class="mono big">G</span><div class="titles"><h2 id="dt">${copy.editTitle}</h2><p>https://go.dev/blog/feed.atom</p></div><button class="close" aria-label="${copy.close}">${icon('x')}</button></header>
    <div class="form">
      ${health}
      <div class="pair"><div class="field"><label>${copy.title}</label><div class="box focused"><input value="The Go Blog" placeholder="${copy.titlePlaceholder}"></div></div>${select(copy.every,copy.autoEvery.replace('{every}',copy.every6h))}</div>
      ${kindPicker('article')}
      ${state==='edit-suggest'?`<div class="health" role="status">${icon('video')}<span>${copy.suggest}</span><button class="button small">${copy.suggestUse}</button></div>`:''}
      <div class="switch-row"><div class="text"><span class="label">${copy.pauseLabel}</span><span class="help">${copy.pauseHelp}</span></div><span class="switch${paused?' on':''}" role="switch" aria-checked="${paused}" aria-label="${copy.pauseLabel}"></span></div>
      <div class="field"><label for="mute">${copy.mute}</label><textarea id="mute" aria-describedby="mh">${lang==='en'?'sponsored\nhiring':'广告\n招聘'}</textarea><span class="help" id="mh">${copy.muteHelp}</span></div>
      <h3 class="group-title">${icon('sparkles')}${copy.aiGroup}</h3>
      ${state==='edit-ai-off'?`<div class="health" role="status">${icon('alert')}<span>${copy.aiOff}</span><button class="button small">${copy.openSettings}</button></div>`:''}
      <div class="switch-row"><div class="text"><span class="label">${copy.autoSummary}</span><span class="help">${copy.autoHelp}</span></div><span class="switch${ai?' on':''}" role="switch" aria-checked="${ai}" aria-label="${copy.autoSummary}"></span></div>
      <div class="switch-row"><div class="text"><span class="label">${copy.autoTranslate}</span></div><span class="switch" role="switch" aria-checked="false" aria-label="${copy.autoTranslate}"></span></div>
      <div class="field"><label for="ps">${copy.promptSummary}</label><textarea id="ps" class="prompt" placeholder="${copy.promptPlaceholder}">${ai?(lang==='en'?'Summarize the post in {language} in one sentence, then list the Go versions it mentions.':'用{language}一句话概括这篇文章，再列出提到的 Go 版本。'):''}</textarea></div>
      <div class="field"><label for="pt">${copy.promptTranslate}</label><textarea id="pt" class="prompt" placeholder="${copy.promptPlaceholder}"></textarea></div>
    </div>
    <footer><button class="button quiet">${icon('trash')}${copy.remove}</button><span class="spacer"></span><button class="button">${copy.cancel}</button><button class="button primary">${copy.save}</button></footer>
  </div></div>`;
}

let overlay='';
if(state.startsWith('add')||state==='adding')overlay=addDialog();
if(state.startsWith('edit'))overlay=editDialog();
if(state.startsWith('menu'))overlay=`<div class="menu" role="menu" style="left:150px;top:168px"><button role="menuitem"${state==='menu-failing'?' class="hover"':''}>${icon('refresh')}${state==='menu-failing'?copy.retry:copy.refresh}</button><button role="menuitem"${state==='menu'?' class="hover"':''}>${icon('pencil')}${copy.edit}</button><button role="menuitem">${icon('pause')}${copy.pause}</button><hr><button role="menuitem" class="danger">${icon('trash')}${copy.remove}</button></div>`;
if(state==='delete')overlay=`<div class="scrim"><div class="alert" role="alertdialog" aria-labelledby="ct" aria-describedby="cb"><div class="tile danger">${icon('trash')}</div><h2 id="ct">${copy.deleteTitle}</h2><p id="cb">${copy.deleteBody}</p><div class="buttons"><button class="button">${copy.cancel}</button><button class="button danger">${copy.confirmDelete}</button></div></div></div>`;

document.getElementById('app').innerHTML=`${sidebar}${main}${overlay}`;
const form=document.querySelector('.dialog .form');
if(form){
  const edges=()=>{const d=form.closest('.dialog');d.classList.toggle('scrolled',form.scrollTop>0);d.classList.toggle('more',form.scrollTop+form.clientHeight<form.scrollHeight-1)};
  form.addEventListener('scroll',edges);
  if(state.startsWith('edit-ai'))form.scrollTop=1e4;
  edges();
}
</script>
</html>
