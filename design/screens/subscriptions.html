<title>Subscriptions</title>
<!-- Adding, editing and deleting subscriptions, over the timeline. "+" next to Subscriptions in the sidebar, the
     button of the empty timeline, and Cmd/Ctrl+N open the add dialog; right click on a subscription, or the pencil
     in the toolbar while one subscription is chosen, edits it. The address field recognizes platform links and
     says what it will subscribe to before anything is sent; the server checks again.
     A page address that is not a platform link is looked up after a short pause in typing: add-searching shows
     "Looking for feeds…" and holds Add; add-found-list lists every feed found, one row each in the found row's
     style (the chosen row filled with a check, the others outlined), the first chosen; add-none-found says nothing
     was found and Add tries the address as typed.
     A name such as "github", or a link that has no feed, is looked up in the route catalog of the user's RSSHub
     instance: add-routes lists the matching routes in the same row style (route name, route template), add-route-params
     shows the chosen route's parameters as fields under the list (the link's own parts already filled in),
     add-route-preview adds the Preview button's result, the first entries of the route without subscribing, and
     add-no-catalog is the quiet line when the instance has no catalog. Colors are the Oriel palette of
     design/tokens.md; icons are Lucide (ISC License). The edit dialog ends with the subscription's summaries and
     translations: switches that queue new entries, and prompts that replace the global ones in Settings; edit-ai
     shows that part scrolled into view, edit-ai-off the same while AI is not set up. edit-backup is the dialog of an RSSHub route whose last fetch
     was served by a backup instance: a muted line under the status names the host and "(backup)". Under the mute
     keywords a second muted line says how many entries they hide now (edit; edit-mute-none when none) and follows the
     keywords as they are typed. A dialog taller than the window
     keeps its header and buttons in place and scrolls only the form, with a divider under the header once scrolled
     and above the buttons while more is below.
     The window has no title bar: the window buttons sit over the sidebar's top, the sidebar is a floating ink pane
     of glass and the toolbar's title sits bare over the content (docs/design.md, Title bar).
     Subscriptions show their site icon (generic stand-ins here); The Go Blog has none, so it keeps its monogram,
     in the list and in the edit dialog's header.
     A full address of the public instance (https://rsshub.app/…) gets a warning card under the field instead of a
     lookup: add-public, while an RSSHub instance is set, says the public instance often blocks automated requests and
     offers "Use my RSSHub instance", which rewrites the field to the route only when pressed; add-public-no-instance
     says it usually blocks Oriel and offers "Open Settings…". Add stays available, the address is never changed
     on its own. edit-blocked is the edit dialog of a subscription whose fetch the site's bot protection turned away:
     the reason line is the localized sentence (here for rsshub.app), not the raw HTTP text.
     On a subscription whose last fetch failed, Refresh reads Try again, in its menu (menu-failing) and beside the
     reason in the edit dialog (edit-failing).
     The check interval offers Auto first, which is also the default of a new subscription: the app works the
     interval out from how often the feed publishes, between 15 minutes and a day, and the edit dialog shows what it
     is now (Auto · 6 h). After the first fetch a feed that looks like another kind gets a line under the kind
     picker (edit-suggest) with a button; nothing changes until it is pressed and the dialog saved.
     Keep entries is a select in the style of the check interval, full width, under the kind picker and its
     suggestion and above the pause switch. It reads "Follow settings · 1 month" by default, with the period of the
     global setting after the dot; a help line says that older entries are removed and starred ones are kept.
     Pace is a select of the same style right under Keep entries: Off by default, then Breaking (3 h), Daily (2 days)
     and Weekly (7 days); a help line says unread entries fade and leave All and Unread when the time is up.
     Extraction is a collapsed row under Pace, a chevron and its name with a help line: a subscription whose pages
     the automatic full-text extraction gets wrong can name the content element (a CSS selector), a Referer to send
     and link rewrites, one "from => to" per line in a monospace field. Collapsed by default, and expanded
     (edit-extract) once any of the three is set; the help lines say what an empty field does.
     Subscription health (health, health-loading, health-error, health-empty) is a dialog the command palette opens
     ("Subscription health…"); the sidebar has no entry for it. It lists unpaused sources that are dead, keep failing
     or are rarely read, each with its reason, the last 30 days in numbers and two buttons, Pause and Unsubscribe….
     Nothing changes until one is pressed; Unsubscribe… opens the delete confirmation (health-delete).
     Deleting acts at once after the confirmation, which says the delete can be undone for a few seconds. The
     subscription leaves the sidebar and a toast at the bottom (deleted) says "Deleted “The Go Blog”" with Undo and a
     close button; it shows for about 8 seconds, is announced to screen readers and takes no focus. Undo brings the
     subscription back with its entries.
     The bar above the window only switches the mockup.
     URL parameters: state, scheme=light|dark, lang=en|zh-Hans, size=default|min. -->
<style>
:root { color-scheme:light; --stage:#dedad2; --stage-text:#4f4a42;
  --chrome:#37332e; --chrome-ink:255,248,235; --chrome-text:#ece7dd; --chrome-text2:#cdc7bb; --chrome-muted:#a49e91; --chrome-accent:#7cc9bb; --chrome-success:#8ab997;
  --background:#fdfcfa; --surface:#f6f3ee; --raised:#ffffff; --track:#ece8e0; --disabled:#b3ada1;
  --text:#25221e; --text2:#58534a; --muted:#736d62;
  --ink:37,34,30; --hover:rgba(var(--ink),.03); --pressed:rgba(var(--ink),.05); --chosen:rgba(var(--ink),.065);
  --border:rgba(var(--ink),.075); --edge-line:rgba(var(--ink),.12);
  --accent:#2a6d65; --accent-hover:#225a54; --accent-text:#ffffff; --accent-soft:rgba(42,109,101,.09); --focus:rgba(42,109,101,.7);
  --danger:#b4533c; --danger-soft:rgba(180,83,60,.09); --warning:#9a7222; --warning-soft:rgba(154,114,34,.10); --success:#4c7c59;
  --segment-on:#ffffff; --segment-shadow:0 1px 2px rgba(var(--ink),.12), 0 0 0 .5px rgba(var(--ink),.08);
  --scrim:rgba(28,24,18,.32); --sheet-shadow:0 0 0 .5px rgba(var(--ink),.12), 0 20px 50px rgba(28,24,18,.25);
  --t:140ms ease-out }
:root[data-scheme=dark] { color-scheme:dark; --stage:#0b0c0c; --stage-text:#8a918f;
  --chrome:#1a2422; --chrome-ink:235,248,244; --chrome-text:#e8eeec; --chrome-text2:#cbd5d2; --chrome-muted:#93a39f;
  --background:#171918; --surface:#1d1f1e; --raised:#252827; --track:#2c2f2e; --disabled:#565b59;
  --text:#dde1df; --text2:#aab0ae; --muted:#8a918f;
  --ink:234,240,238; --hover:rgba(var(--ink),.04); --pressed:rgba(var(--ink),.06); --chosen:rgba(var(--ink),.08);
  --accent:#78beb1; --accent-hover:#8ccbbf; --accent-text:#10241f; --accent-soft:rgba(120,190,177,.12); --focus:rgba(120,190,177,.7);
  --danger:#e0897a; --danger-soft:rgba(224,137,122,.13); --warning:#d6aa55; --warning-soft:rgba(214,170,85,.13); --success:#8ab997;
  --segment-on:rgba(var(--ink),.12); --segment-shadow:none;
  --sheet-shadow:0 0 0 1px rgba(255,255,255,.08), 0 20px 50px rgba(0,0,0,.55) }
* { box-sizing:border-box }
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
body { margin:0; padding:24px; font:13px/1.5 system-ui,-apple-system,"SF Pro Text","PingFang SC","Segoe UI",sans-serif; background:var(--stage); color:var(--text) }
:root:lang(zh-Hans) body { line-height:1.65 }
svg.icon { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
svg.icon.filled { fill:currentColor }
button { font:inherit; color:inherit; border:0; background:none; padding:0; cursor:default; transition:background-color var(--t), color var(--t), opacity var(--t) }
button:focus-visible { outline:2px solid var(--focus); outline-offset:1px }

.switcher { display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 16px; font-size:12px; color:var(--stage-text) }
.switcher select { font:inherit }

.window { position:relative; width:960px; height:640px; border-radius:22px; overflow:hidden; display:flex; flex-direction:column; background:var(--background); box-shadow:0 0 0 .5px rgba(0,0,0,.25), 0 30px 80px rgba(28,24,18,.28) }
:root[data-scheme=dark] .window { box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 30px 80px rgba(0,0,0,.65) }
.window.min { width:640px; height:480px }
.window.wide { width:1280px; height:760px }
.body { flex:1; min-height:0; display:flex }
.lights { position:absolute; top:20px; left:20px; z-index:6; display:flex; gap:8px }
.lights i { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
.lights i:nth-child(1) { background:#ff5f57 }
.lights i:nth-child(2) { background:#febc2e }
.lights i:nth-child(3) { background:#28c840 }

/* Sidebar: the ink pane, with its own light-on-dark roles, the same in both schemes: a glass pane floating 8 from
   the window's edges, radius 14. */
aside { width:216px; flex:none; margin:8px 0 8px 8px; padding-top:40px; display:flex; flex-direction:column; border-radius:14px; background:var(--chrome);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 .5px rgba(0,0,0,.35), 0 6px 24px rgba(28,24,18,.12);
  --text:var(--chrome-text); --muted:var(--chrome-muted); --accent:var(--chrome-accent); --success:var(--chrome-success); --warning:#d6aa55;
  --hover:rgba(var(--chrome-ink),.055); --pressed:rgba(var(--chrome-ink),.085); --chosen:rgba(var(--chrome-ink),.12) }
:root[data-scheme=dark] aside { box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 .5px rgba(0,0,0,.7) }
.min aside { width:184px }
.section { margin:14px 10px 4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
:root:lang(zh-Hans) .section { font-size:12px; letter-spacing:.02em }
.item { width:100%; height:30px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:8px; color:var(--chrome-text2); text-align:left; transition:background-color var(--t), color var(--t) }
.item:hover { background:var(--hover) }
.item:active { background:var(--pressed) }
.item.chosen { background:var(--chosen); color:var(--text) }
.item.chosen .name { font-weight:500 }
.item .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.item svg.icon { color:var(--muted) }
.item:hover svg.icon { color:var(--chrome-text2) }
.kind-list .item svg.icon { width:16px; height:16px }
.item.chosen svg.icon { color:var(--accent) }
.server { flex:none; width:100%; display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; color:var(--muted); font-size:12px; letter-spacing:.01em; cursor:default }
.server .name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.server .dot { width:6px; height:6px; border-radius:50%; background:var(--success) }

.nav { flex:1; overflow:hidden; padding:6px 8px; position:relative }
.kind-list { flex:none; padding:0 8px 6px; display:flex; flex-direction:column; gap:1px }
.kind-list ~ .nav { padding-top:4px }
.section { display:flex; align-items:center; height:22px; margin:14px 4px 4px 10px }
.section span { flex:1 }
.section button { width:22px; height:22px; display:grid; place-items:center; border-radius:6px; color:var(--muted) }
.section button:hover, .section button.hover { background:var(--hover); color:var(--text) }
.section button svg.icon { width:14px; height:14px }
.item.menued { box-shadow:0 0 0 2px var(--focus) }
.item .count { font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--muted) }
.item:hover .count, .item.chosen .count { color:var(--chrome-text2) }
.item .warn, .item .paused { display:flex; color:var(--warning) }
.item .paused { color:var(--muted) }
.item .warn svg.icon, .item .paused svg.icon { width:14px; height:14px; color:inherit }
.item.is-paused .name { color:var(--muted) }
.mono { width:16px; height:16px; flex:none; display:grid; place-items:center; border-radius:4px; font-size:10px; font-weight:600; background:var(--pressed); color:var(--text) }
.mono.big { width:32px; height:32px; border-radius:8px; font-size:15px; background:var(--track); color:var(--text2) }
.fav { position:relative; width:16px; height:16px; flex:none; border-radius:4px; overflow:hidden }
.fav::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18) }
.fav svg { display:block; width:16px; height:16px }

/* Toolbar: no bar, the title bare over the content, which fades under it */
.main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.main::before { content:""; position:absolute; top:0; left:0; right:0; height:52px; background:var(--background); z-index:1; pointer-events:none }
.main::after { content:""; position:absolute; top:52px; left:0; right:0; height:.5px; background:var(--border); opacity:0; transition:opacity 120ms ease-out; z-index:1; pointer-events:none }
.main.scrolled::after { opacity:1 }
.toolbar { position:absolute; top:0; left:0; right:0; z-index:2; height:52px; display:flex; align-items:center; gap:8px; padding:0 12px 0 20px }
.toolbar h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.005em; white-space:nowrap }
.toolbar .sub { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
.spacer { flex:1 }
.tool { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted) }
.tool:hover, .tool.hover { background:var(--hover); color:var(--text) }
.ghost { height:28px; width:280px; border-radius:14px; background:var(--surface) }
.min .ghost { width:150px }
.column { max-width:680px; margin:0 auto; padding:64px 20px 18px; display:flex; flex-direction:column; gap:26px; width:100% }
.bars { display:flex; flex-direction:column; gap:8px }
.bar { height:10px; border-radius:5px; background:var(--surface) }
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center }
.empty h2 { margin:0; font-size:15px; font-weight:600 }
.empty p { margin:-4px 0 0; max-width:300px; color:var(--muted) }
.tile { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent) }
.tile.danger { background:var(--danger-soft); color:var(--danger) }
.tile svg.icon { width:24px; height:24px; stroke-width:1.4 }

/* Controls sit on the Track fill; fields on a dialog's Raised sheet use Surface with an inset edge. */
.button { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 14px; white-space:nowrap; border-radius:8px; background:var(--track); color:var(--text); font-weight:500 }
.button:hover { background:color-mix(in srgb,var(--track),rgba(var(--ink),.06)) }
.button:active { background:color-mix(in srgb,var(--track),rgba(var(--ink),.1)) }
.button.primary { background:var(--accent); color:var(--accent-text) }
.button.primary:hover { background:var(--accent-hover) }
.button.danger { background:var(--danger); color:var(--accent-text) }
.button.quiet { background:none; color:var(--danger); padding:0 8px }
.button.quiet:hover { background:var(--danger-soft) }
.button.small { height:26px; padding:0 10px; font-size:12px }
.button:disabled { background:rgba(var(--ink),.04); color:var(--disabled); font-weight:400 }
.button svg.icon { width:14px; height:14px }
.spin { animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
.field { display:flex; flex-direction:column; gap:6px }
.field > label, .label { font-size:12px; font-weight:500 }
.box { height:32px; display:flex; align-items:center; gap:8px; padding:0 10px; border-radius:8px; background:var(--surface); box-shadow:inset 0 0 0 .5px var(--edge-line); color:var(--muted); transition:box-shadow var(--t), background-color var(--t) }
.box.focused { background:var(--raised); box-shadow:0 0 0 2px var(--focus) }
.box.invalid { box-shadow:inset 0 0 0 1.5px var(--danger) }
.box input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--text) }
.box input::placeholder, textarea::placeholder { color:var(--muted) }
.box.select { color:var(--text); justify-content:space-between }
.box.select svg.icon { color:var(--muted); width:14px; height:14px }
textarea { width:100%; min-height:72px; resize:none; padding:7px 10px; border:0; outline:0; border-radius:8px; background:var(--surface); box-shadow:inset 0 0 0 .5px var(--edge-line); font:inherit; color:var(--text); line-height:1.5 }
textarea.prompt { min-height:58px; font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace }
.disclosure { display:flex; align-items:center; gap:6px; align-self:flex-start; padding:2px 0; border:0; background:none; font:inherit; font-size:12px; font-weight:500; color:var(--text); cursor:pointer }
.disclosure svg.icon { width:14px; height:14px; color:var(--muted); transition:transform var(--t) }
.disclosure[aria-expanded=false] svg.icon { transform:rotate(-90deg) }
.help { font-size:12px; color:var(--muted) }
.help.count { font-variant-numeric:tabular-nums }
.error { display:flex; gap:6px; font-size:12px; color:var(--danger) }
.error svg.icon { width:14px; height:14px; margin-top:2px }
.added { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; background:color-mix(in srgb,var(--success) 12%,transparent); font-weight:500 }
.added svg { color:var(--success) }
.found { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; background:var(--accent-soft) }
.found > svg.icon:first-child { color:var(--accent) }
.found > svg.icon:last-child { color:var(--success) }
.found .what { flex:1; min-width:0; display:flex; flex-direction:column }
.found .what b { font-weight:600 }
.found code { font:12px ui-monospace,Menlo,Consolas,monospace; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.found.pick { background:transparent; box-shadow:inset 0 0 0 1px var(--border); cursor:pointer }
.found.pick.on { background:var(--accent-soft); box-shadow:none }
.found.pick > svg.icon:last-child { visibility:hidden }
.found.pick.on > svg.icon:last-child { visibility:visible }
.picks { display:flex; flex-direction:column; gap:6px }
.picks .head { font-size:12px; color:var(--muted) }
.params { display:flex; flex-direction:column; gap:10px }
.preview { display:flex; flex-direction:column; gap:6px; padding:8px 12px; border-radius:8px; box-shadow:inset 0 0 0 1px var(--border) }
.preview .row { display:flex; gap:10px; align-items:baseline }
.preview .row b { flex:1; min-width:0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.preview .row span { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap }
.needs { display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:8px; background:var(--warning-soft) }
.needs .head { display:flex; gap:8px; color:var(--warning); font-weight:500 }
.needs .head svg.icon { width:14px; height:14px; margin-top:3px; flex:none }
.needs .box { background:var(--raised) }
.kinds { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:3px; border-radius:9px; background:var(--track) }
.kinds button { height:28px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:7px; color:var(--muted) }
.kinds button:hover { color:var(--text) }
.kinds button svg.icon { width:14px; height:14px }
.kinds button.on { background:var(--segment-on); color:var(--text); font-weight:500; box-shadow:var(--segment-shadow) }
.kinds button.on svg.icon { color:var(--accent) }
.min .kinds button span { display:none }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.switch-row { display:flex; align-items:center; gap:12px }
.switch-row .text { flex:1; display:flex; flex-direction:column }
.switch { width:34px; height:20px; border-radius:10px; background:rgba(var(--ink),.16); position:relative; flex:none; transition:background-color var(--t) }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2) }
.switch.on { background:var(--accent) }
.switch.on::after { left:16px }
.group-title { display:flex; align-items:center; gap:6px; margin:12px 0 -4px; font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted) }
:root:lang(zh-Hans) .group-title { font-size:12px; letter-spacing:.02em }
.group-title svg.icon { width:14px; height:14px }

/* Dialogs and the menu. A tall dialog scrolls only its form; a hairline marks an edge where content hides. */
.toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:10px; max-width:calc(100% - 40px); min-height:40px; padding:6px 6px 6px 14px; border-radius:14px; background:#2a2620; color:#f4efe6; font-size:12.5px; box-shadow:0 10px 30px rgba(var(--ink),.28), 0 0 0 .5px rgba(255,248,235,.08) }
:root[data-scheme=dark] .toast { background:#333837 }
.toast svg.icon { flex:none }
.toast .msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.toast .act { height:28px; padding:0 10px; border-radius:8px; color:inherit; font-weight:600; white-space:nowrap; background:rgba(255,248,235,.12) }
.toast .x { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:inherit; opacity:.7 }
.toast .x svg.icon { width:14px; height:14px }
.scrim { position:absolute; inset:0; background:var(--scrim); display:grid; place-items:center; z-index:3; padding:16px }
.dialog { width:440px; max-height:100%; overflow:hidden; border-radius:16px; background:var(--raised); box-shadow:var(--sheet-shadow); display:flex; flex-direction:column }
.dialog.wide { width:480px }
.dialog header { flex:none; display:flex; align-items:center; gap:12px; padding:18px 20px 12px; border-bottom:1px solid transparent }
.dialog header .titles { flex:1; min-width:0 }
.dialog h2 { margin:0; font-size:15px; font-weight:600 }
.dialog header p { margin:0; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.dialog header .tile { background:var(--accent-soft) }
.dialog .close { width:28px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--muted); align-self:flex-start }
.dialog .close:hover { background:var(--hover); color:var(--text) }
.dialog .form { flex:1 1 auto; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:16px; padding:14px 20px }
.dialog footer { flex:none; display:flex; align-items:center; gap:8px; padding:14px 20px 18px; border-top:1px solid transparent }
.dialog.scrolled header, .dialog.more footer { border-color:var(--border) }
.health { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:var(--surface); font-size:12px; color:var(--muted) }
.health.bad { background:var(--warning-soft); color:var(--warning) }
.health span { flex:1 }
.health svg.icon { width:14px; height:14px }
.health .button { color:var(--text) }
.hrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border) }
.hrow:first-child { border-top:0 }
.hrow .who { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px }
.hrow .name { display:flex; align-items:center; gap:8px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.hrow .reason { display:flex; align-items:flex-start; gap:6px; font-size:12px; color:var(--warning) }
.hrow .reason.quiet { color:var(--muted) }
.hrow .reason svg.icon { width:14px; height:14px; margin-top:2px }
.hrow .reason span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.hrow .numbers { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
.hrow .actions { flex:none; display:flex; gap:4px }
.status { display:flex; flex-direction:column; align-items:center; gap:8px; padding:36px 0; color:var(--muted); text-align:center }
.status.ok svg.icon { width:28px; height:28px; color:var(--success) }
.status b { color:var(--text); font-weight:500 }
.alert { width:320px; padding:20px; border-radius:16px; background:var(--raised); box-shadow:var(--sheet-shadow); display:flex; flex-direction:column; gap:8px; text-align:center; align-items:center }
.alert h2 { margin:8px 0 0; font-size:15px; font-weight:600 }
.alert p { margin:0; color:var(--muted); font-size:12px }
.alert .buttons { display:flex; gap:8px; margin-top:12px; width:100% }
.alert .buttons .button { flex:1 }
.menu { position:absolute; z-index:4; min-width:184px; padding:4px; border-radius:10px; background:var(--raised); box-shadow:var(--sheet-shadow) }
.menu button { width:100%; height:28px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; text-align:left }
.menu button:hover, .menu button.hover { background:var(--chosen) }
.menu button svg.icon { width:14px; height:14px; color:var(--muted) }
.menu button.danger { color:var(--danger) }
.menu button.danger svg.icon { color:inherit }

.menu hr { border:0; border-top:1px solid var(--border); margin:4px 2px }

const pick=(name,list,fallback)=>list.includes(query.get(name))?query.get(name):fallback;
const options={state:states,scheme:['light','dark'],lang:['en','zh-Hans'],size:['default','min']};
const state=pick('state',states,'add');
const scheme=pick('scheme',options.scheme,'light');
const lang=pick('lang',options.lang,'en');
const size=pick('size',options.size,'default');
document.documentElement.dataset.scheme=scheme;
document.documentElement.lang=lang;
document.getElementById('window').classList.toggle('min',size==='min');
for(const [id,list] of Object.entries(options)){
  const select=document.getElementById(id);
  select.innerHTML=list.map(s=>`<option>${s}</option>`).join('');
  select.value={state,scheme,lang,size}[id];
  select.onchange=()=>{query.set(id,select.value);location.search=query};
}

const editing=['menu','menu-failing','edit','edit-failing','edit-blocked','edit-paused','edit-ai','edit-ai-off','edit-extract','edit-suggest','edit-backup','edit-mute-none','delete'].includes(state);
const tabs=`<nav class="kind-list" aria-label="${copy.kinds}">${[['all','inbox'],['article','article'],['video','video'],['social','social'],['image','image']].map(([k,g],i)=>`<button class="item${i===0?' chosen':''}" aria-current="${i===0}">${icon(g)}<span class="name">${copy[k]}</span>${empty?'':`<span class="count">${[30,18,2,9,1][i]}</span>`}</button>`).join('')}</nav>`;
const item=(s,i)=>`<button class="item${editing&&i===1?' chosen':''}${state.startsWith('menu')&&i===1?' menued':''}${s.paused?' is-paused':''}">${s.fav?`<span class="fav" aria-hidden="true"><svg viewBox="0 0 16 16">${s.fav}</svg></span>`:`<span class="mono k-${s.kind}">${s.mono}</span>`}<span class="name">${s.name}</span>${s.failing?`<span class="warn" role="img" aria-label="${copy.failingMark}">${icon('alert')}</span>`:''}${s.paused?`<span class="paused" role="img" aria-label="${copy.pausedMark}">${icon('pause')}</span>`:''}<span class="count">${s.paused?'':s.unread}</span></button>`;
const sidebar=`<aside>${tabs}<nav class="nav" aria-label="${copy.sources}"><div class="section"><span>${copy.sources}</span><button class="${state==='add'?'hover':''}" aria-label="${copy.add}" title="${copy.add} (⌘N)">${icon('plus')}</button></div>${empty?'':sources.filter((s,i)=>!(state==='deleted'&&i===1)).map(item).join('')}</nav><div class="server">${icon('laptop')}<span class="name">${copy.thisComputer}</span><span class="dot"></span></div></aside>`;
const rows=Array.from({length:5},(_,i)=>`<div class="bars"><div class="bar" style="width:${30+i%3*6}%"></div><div class="bar" style="width:${74-i*5}%;height:14px"></div><div class="bar" style="width:${90-i*3}%"></div></div>`).join('');
const toolbar=`<div class="toolbar"><h1>${editing?'The Go Blog':copy.all}</h1><span class="sub">${empty?'':copy.unread}</span>${editing?`<button class="tool${state==='edit'?' hover':''}" aria-label="${copy.editSource}" title="${copy.editSource}">${icon('pencil')}</button>`:''}<span class="spacer"></span><div class="ghost"></div></div>`;
const main=empty
  ?`<section class="main">${toolbar}<div class="empty" role="status"><div class="tile">${icon('rss')}</div><h2>${copy.noSubscriptions}</h2><p>${copy.noSubscriptionsHint}</p><button class="button primary">${icon('plus')}${copy.addHere}</button></div></section>`
  :`<section class="main">${toolbar}<div class="column" aria-hidden="true">${rows}</div>${state==='deleted'?`<div class="toast" role="status">${icon('trash')}<span class="msg">${copy.deleted}</span><button class="act">${copy.undo}</button><button class="x" aria-label="${copy.dismiss}">${icon('x')}</button></div>`:''}</section>`;

const kindPicker=on=>`<div class="field"><span class="label" id="kind">${copy.showAs}</span><div class="kinds" role="radiogroup" aria-labelledby="kind">${['article','video','social','image'].map(k=>`<button role="radio" aria-checked="${k===on}" class="${k===on?'on':''}" aria-label="${copy[k]}">${icon(k)}<span>${copy[k]}</span></button>`).join('')}</div></div>`;
const select=(label,value)=>`<div class="field"><label>${label}</label><div class="box select" role="combobox" aria-label="${label}"><span>${value}</span>${icon('chevron')}</div></div>`;
const foundCard=(kind,what,code)=>`<div class="found" role="status">${icon(kind==='feed'?'rss':kind)}<div class="what"><b>${what}</b><code>${code}</code></div>${icon('check')}</div>`;

function addDialog(){
  const value={add:'','add-link':'https://space.bilibili.com/2267573','add-feed':'https://go.dev/blog/feed.atom','add-route':'/github/trending/daily','add-route-no-base':'/github/trending/daily','add-public':'https://rsshub.app/github/trending/daily','add-public-no-instance':'https://rsshub.app/github/trending/daily','add-more':'','add-invalid':'go.dev/blog','add-exists':'https://go.dev/blog/feed.atom',adding:'https://space.bilibili.com/2267573','add-searching':'https://go.dev/blog','add-found-list':'https://go.dev/blog','add-none-found':'https://example.org/about','add-routes':'github','add-route-params':'https://github.com/rsshub/rsshub','add-route-preview':'https://github.com/rsshub/rsshub','add-no-catalog':'github'}[state];
  const kind=['add-link','adding'].includes(state)?'video':'article';
  const invalid=state==='add-invalid'||state==='add-exists';
  let below=`<span class="help" id="ah">${copy.addressHelp}</span>`;
  if(state==='add-link'||state==='adding')below=foundCard('video',copy.found.bilibili,`${copy.viaRsshub} /bilibili/user/video/2267573`);
  if(state==='add-feed')below=foundCard('feed',copy.found.feed,'https://go.dev/blog/feed.atom');
  if(state==='add-route')below=foundCard('article',copy.found.route,'/github/trending/daily');
  if(state==='add-route-no-base')below=`<div class="needs" role="status"><div class="head">${icon('triangle')}<span>${copy.needsBase}</span></div><div class="box focused">${icon('link')}<input aria-label="${copy.rsshubAddress}" placeholder="${copy.rsshubPlaceholder}"></div></div>`;
  if(state==='add-public')below=`<div class="needs" role="status"><div class="head">${icon('triangle')}<span>${copy.publicNote}</span></div><button class="button small" style="align-self:flex-start">${copy.useMine}</button></div>`;
  if(state==='add-public-no-instance')below=`<div class="needs" role="status"><div class="head">${icon('triangle')}<span>${copy.publicNoInstance}</span></div><button class="button small" style="align-self:flex-start">${copy.openSettings}</button></div>`;
  if(state==='add-searching')below=`<span class="help" role="status">${icon('loader','spin')} ${copy.searching}</span>`;
  if(state==='add-found-list')below=`<div class="picks" role="radiogroup" aria-label="${copy.foundMany.replace('{n}',3)}"><span class="head" role="status">${copy.foundMany.replace('{n}',3)}</span>${[['pickGo','pickGoCode',1],['pickAll','pickAllCode',0],['pickCom','pickComCode',0]].map(([a,b,on])=>`<div class="found pick${on?' on':''}" role="radio" aria-checked="${!!on}">${icon('rss')}<div class="what"><b>${copy[a]}</b><code>${copy[b]}</code></div>${icon('check')}</div>`).join('')}</div>`;
  if(state==='add-none-found')below=`<span class="help" role="status">${copy.noneFound}</span>`;
  const routes=[['routeA','/github/issue/:user/:repo',1],['routeB','/github/trending/:since/:language?',0],['routeC','/github/user/followers/:user',0]];
  const field=(name,help,val,focus)=>`<div class="field"><label>${name}</label><div class="box${focus?' focused':''}"><input value="${val}" placeholder="${help}" aria-label="${name}"></div></div>`;
  if(['add-routes','add-route-params','add-route-preview'].includes(state)){
    const head=copy.foundRoutes.replace('{n}',3);
    below=`<div class="picks" role="radiogroup" aria-label="${head}"><span class="head" role="status">${head}</span>${routes.map(([a,b,on])=>`<div class="found pick${on?' on':''}" role="radio" aria-checked="${!!on}">${icon('rss')}<div class="what"><b>${copy[a]}</b><code>${b}</code></div>${icon('check')}</div>`).join('')}</div>`;
  }
  if(state==='add-route-params'||state==='add-route-preview'){
    const done=state==='add-route-preview';
    below+=`<div class="params">${field(copy.paramUser,copy.paramUserHelp,'rsshub',false)}${field(copy.paramRepo,copy.paramRepoHelp,done?'rsshub':'',!done)}<button class="button" style="align-self:flex-start"${done?'':' disabled'}>${icon('eye')}${copy.preview}</button></div>`;
  }
  if(state==='add-route-preview'){
    const items=lang==='en'?[['Support Atom feeds for pages','2 h'],['Route /github/issue returns 404 for private repos','1 d'],['Add a parameter for labels','3 d'],['Docs: describe radar rules','5 d'],['Fix date parsing','1 w']]:[['页面支持 Atom 订阅','2 小时'],['私有仓库时 /github/issue 返回 404','1 天'],['为标签加一个参数','3 天'],['文档：说明 radar 规则','5 天'],['修复日期解析','1 周']];
    below+=`<div class="preview" role="status"><span class="help">${copy.previewOf}</span>${items.map(([t,d])=>`<div class="row"><b>${t}</b><span>${d}</span></div>`).join('')}</div>`;
  }
  if(state==='add-no-catalog')below=`<span class="help" role="status">${copy.noCatalog}</span>`;
  if(state==='add-invalid')below=`<span class="error" id="ae">${icon('alert')}${copy.invalidUrl}</span>`;
  if(state==='add-exists')below=`<span class="error" id="ae">${icon('alert')}<span>${copy.exists} <a href="#" style="color:inherit;font-weight:500">${copy.show}</a></span></span>`;
  const busy=state==='adding';
  return `<div class="scrim"><div class="dialog" role="dialog" aria-labelledby="dt">
    <header><div class="tile" style="width:32px;height:32px;border-radius:8px">${icon('rss')}</div><div class="titles"><h2 id="dt">${copy.add}</h2></div><button class="close" aria-label="${copy.close}">${icon('x')}</button></header>
    <div class="form">
      ${state==='add-more'?`<div class="added" role="status">${icon('check')}<span>${copy.addedMore}</span></div>`:''}
      <div class="field"><label for="addr">${copy.address}</label><div class="box${state==='add'||state==='add-more'||state==='add-invalid'?' focused':''}${invalid?' invalid':''}">${icon('link')}<input id="addr" value="${value}" placeholder="${copy.addressPlaceholder}" ${invalid?'aria-invalid="true" aria-describedby="ae"':''}></div>${below}</div>
      ${kindPicker(kind)}
      <div class="pair"><div class="field"><label>${copy.title}</label><div class="box"><input placeholder="${copy.titlePlaceholder}"></div></div>${select(copy.every,copy.auto)}</div>
    </div>
    <footer><span class="spacer"></span><button class="button">${state==='add-more'?copy.done:copy.cancel}</button><button class="button" title="${copy.addContinue} (⌘Enter)"${state==='add'||state==='add-more'||state==='add-searching'||state==='add-routes'||state==='add-route-params'||state==='add-no-catalog'||invalid?' disabled':''}>${copy.addContinue}</button><button class="button primary"${state==='add'||state==='add-more'||state==='add-searching'||invalid?' disabled':''}>${busy?icon('loader','spin')+copy.adding:copy.addShort}</button></footer>
  </div></div>`;
}

function editDialog(){
  const failing=state==='edit-failing'||state==='edit-blocked', paused=state==='edit-paused', ai=state==='edit-ai';
  const health=failing
    ?`<div class="health bad" role="status">${icon('alert')}<span>${state==='edit-blocked'?copy.failingBlocked:copy.failing}</span><button class="button small">${icon('refresh')}${copy.retry}</button></div>`
    :paused?`<div class="health" role="status">${icon('pause')}<span>${copy.paused}</span></div>`
    :`<div class="health" role="status">${icon('check')}<span>${copy.checked}</span><button class="button small">${icon('refresh')}${copy.refresh}</button></div>`;
  const open=state==='edit-extract';
  const extractGroup=`<div class="field"><button class="disclosure" aria-expanded="${open}" aria-controls="xg">${icon('chevron')}${copy.extract}</button><span class="help">${copy.extractHelp}</span></div>`
    +(open?`<div id="xg" class="field" style="gap:12px">
      <div class="field"><label for="xs">${copy.extractSelector}</label><div class="box"><input id="xs" value="article .post-body" placeholder="article"></div><span class="help">${copy.extractSelectorHelp}</span></div>
      <div class="field"><label for="xr">${copy.extractReferer}</label><div class="box"><input id="xr" value="https://go.dev/" placeholder="https://example.com/"></div><span class="help">${copy.extractRefererHelp}</span></div>
      <div class="field"><label for="xw">${copy.extractRewrites}</label><textarea id="xw" class="prompt">www.go.dev => go.dev\nhttps://go.dev/blog/amp/ => https://go.dev/blog/</textarea><span class="help">${copy.extractRewritesHelp}</span></div>
    </div>`:'');
  const backup=state==='edit-backup';
  const served=backup?`<span class="help">${copy.servedByBackup.replace('{host}','rsshub.backup.example')}</span>`:'';
  return `<div class="scrim"><div class="dialog wide" role="dialog" aria-labelledby="dt">
    <header><span class="mono big">G</span><div class="titles"><h2 id="dt">${copy.editTitle}</h2><p>${backup?'/github/trending/daily':'https://go.dev/blog/feed.atom'}</p></div><button class="close" aria-label="${copy.close}">${icon('x')}</button></header>
    <div class="form">
      ${health}${served}
      <div class="pair"><div class="field"><label>${copy.title}</label><div class="box focused"><input value="The Go Blog" placeholder="${copy.titlePlaceholder}"></div></div>${select(copy.every,copy.autoEvery.replace('{every}',copy.every6h))}</div>
      ${kindPicker('article')}
      ${state==='edit-suggest'?`<div class="health" role="status">${icon('video')}<span>${copy.suggest}</span><button class="button small">${copy.suggestUse}</button></div>`:''}
      ${select(copy.keep,copy.keepFollow).replace('</div></div>',`</div><span class="help">${copy.keepHelp}</span></div>`)}
      ${select(copy.pace,copy.paceOff).replace('</div></div>',`</div><span class="help">${copy.paceHelp}</span></div>`)}
      ${extractGroup}
      <div class="switch-row"><div class="text"><span class="label">${copy.pauseLabel}</span><span class="help">${copy.pauseHelp}</span></div><span class="switch${paused?' on':''}" role="switch" aria-checked="${paused}" aria-label="${copy.pauseLabel}"></span></div>
      <div class="field"><label for="mute">${copy.mute}</label><textarea id="mute" aria-describedby="mh mc">${state==='edit-mute-none'?(lang==='en'?'giveaway':'抽奖'):lang==='en'?'sponsored\nhiring':'广告\n招聘'}</textarea><span class="help" id="mh">${copy.muteHelp}</span><span class="help count" id="mc" role="status">${state==='edit-mute-none'?copy.muteNone:copy.muteHidden.replace('{n}','7')}</span></div>
      <h3 class="group-title">${icon('sparkles')}${copy.aiGroup}</h3>
      ${state==='edit-ai-off'?`<div class="health" role="status">${icon('alert')}<span>${copy.aiOff}</span><button class="button small">${copy.openSettings}</button></div>`:''}
      <div class="switch-row"><div class="text"><span class="label">${copy.autoSummary}</span><span class="help">${copy.autoHelp}</span></div><span class="switch${ai?' on':''}" role="switch" aria-checked="${ai}" aria-label="${copy.autoSummary}"></span></div>
      <div class="switch-row"><div class="text"><span class="label">${copy.autoTranslate}</span></div><span class="switch" role="switch" aria-checked="false" aria-label="${copy.autoTranslate}"></span></div>
      <div class="field"><label for="ps">${copy.promptSummary}</label><textarea id="ps" class="prompt" placeholder="${copy.promptPlaceholder}">${ai?(lang==='en'?'Summarize the post in {language} in one sentence, then list the Go versions it mentions.':'用{language}一句话概括这篇文章，再列出提到的 Go 版本。'):''}</textarea></div>
      <div class="field"><label for="pt">${copy.promptTranslate}</label><textarea id="pt" class="prompt" placeholder="${copy.promptPlaceholder}"></textarea></div>
    </div>
    <footer><button class="button quiet">${icon('trash')}${copy.remove}</button><span class="spacer"></span><button class="button">${copy.cancel}</button><button class="button primary">${copy.save}</button></footer>
  </div></div>`;
}

const fill=(text,values)=>text.replace(/\{(\w+)\}/g,(_,k)=>values[k]);
const flagged=[
  {kind:'article',name:'Old Gadget Review',mono:'O',state:'dead',reason:fill(copy.healthSilent,{n:143}),recent:0,read:0,starred:0},
  {kind:'article',name:'Daily Haiku',mono:'D',state:'dead',reason:fill(copy.healthDead,{n:41}),error:'HTTP 404 Not Found',recent:0,read:0,starred:0},
  {kind:'social',name:'@weatherbot',mono:'W',state:'failing',reason:fill(copy.healthFailing,{n:5}),error:'HTTP 503 Service Unavailable',recent:48,read:6,starred:0},
  {kind:'article',name:'News Firehose',mono:'N',state:'rare',reason:fill(copy.healthRare,{read:3,recent:120,days:30}),recent:120,read:3,starred:1},
];
function healthDialog(){
  let body;
  if(state==='health-loading')body=`<div class="status" role="status">${icon('loader','spin')}<span>${copy.healthChecking}</span></div>`;
  else if(state==='health-error')body=`<div class="status" role="alert"><span class="error">${icon('alert')}${copy.healthError}</span><button class="button small">${icon('refresh')}${copy.retry}</button></div>`;
  else if(state==='health-empty')body=`<div class="status ok" role="status">${icon('checkbig')}<b>${copy.healthOk}</b></div>`;
  else body=`<ul style="list-style:none;margin:0;padding:0">${flagged.map(f=>`<li class="hrow"><span class="mono k-${f.kind}">${f.mono}</span><div class="who"><span class="name">${f.name}</span><span class="reason${f.state==='rare'?' quiet':''}">${icon(f.state==='rare'?'eye':f.state==='failing'?'triangle':'alert')}<span>${f.reason}${f.error?`: ${f.error}`:''}</span></span><span class="numbers">${fill(copy.healthNumbers,{recent:f.recent,read:f.read,starred:f.starred})}</span></div><div class="actions"><button class="button small" aria-label="${fill(copy.pauseSource,{name:f.name})}">${icon('pause')}${copy.pause}</button><button class="button small quiet" aria-label="${fill(copy.unsubscribeSource,{name:f.name})}">${icon('trash')}${copy.unsubscribe}</button></div></li>`).join('')}</ul>`;
  return `<div class="scrim"><div class="dialog wide" role="dialog" aria-labelledby="dt">
    <header><div class="tile" style="width:32px;height:32px;border-radius:8px">${icon('heart')}</div><div class="titles"><h2 id="dt">${copy.healthTitle}</h2><p>${copy.healthSub}</p></div><button class="close" aria-label="${copy.close}">${icon('x')}</button></header>
    <div class="form">${body}</div>
    <footer><span class="spacer"></span><button class="button">${copy.close}</button></footer>
  </div></div>`;
}

let overlay='';
if(state.startsWith('add')||state==='adding')overlay=addDialog();
if(state.startsWith('edit'))overlay=editDialog();
if(state.startsWith('health')&&state!=='health-delete')overlay=healthDialog();
if(state.startsWith('menu'))overlay=`<div class="menu" role="menu" style="left:150px;top:168px"><button role="menuitem"${state==='menu-failing'?' class="hover"':''}>${icon('refresh')}${state==='menu-failing'?copy.retry:copy.refresh}</button><button role="menuitem"${state==='menu'?' class="hover"':''}>${icon('pencil')}${copy.edit}</button><button role="menuitem">${icon('pause')}${copy.pause}</button><hr><button role="menuitem" class="danger">${icon('trash')}${copy.remove}</button></div>`;
if(state==='delete'||state==='health-delete')overlay=`<div class="scrim"><div class="alert" role="alertdialog" aria-labelledby="ct" aria-describedby="cb"><div class="tile danger">${icon('trash')}</div><h2 id="ct">${state==='health-delete'?copy.deleteTitle.replace('The Go Blog','Old Gadget Review'):copy.deleteTitle}</h2><p id="cb">${copy.deleteBody}</p><div class="buttons"><button class="button">${copy.cancel}</button><button class="button danger">${copy.confirmDelete}</button></div></div></div>`;

document.getElementById('app').innerHTML=`${sidebar}${main}${overlay}`;
const form=document.querySelector('.dialog .form');
if(form){
  const edges=()=>{const d=form.closest('.dialog');d.classList.toggle('scrolled',form.scrollTop>0);d.classList.toggle('more',form.scrollTop+form.clientHeight<form.scrollHeight-1)};
  form.addEventListener('scroll',edges);
  if(state.startsWith('edit-ai'))form.scrollTop=1e4;
  if(state==='edit-extract')document.getElementById('xg').scrollIntoView({block:'center'});
  edges();
}
</script>
</html>
