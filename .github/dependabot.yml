# The pr-title workflow skips Dependabot pull requests.
# The MyGo library and CLI are one module; after an update, sync THIRD_PARTY.md and resources/ThirdPartyLicenses/.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
