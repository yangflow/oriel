name: Feature
description: 新能力，或改变现有行为
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: 现在缺什么，或者哪条路径走不通。Oriel 是单用户阅读器，范围见 docs/product.md。
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix direction
      description: 做完后，谁能完成哪件具体的事。明确不做什么。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 几行可检查的条件，能演示或能验证。
    validations:
      required: true
