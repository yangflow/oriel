name: Bug
description: 哪里坏了、不对或崩了
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: 做了什么，看到什么，预期是什么。写复现步骤、操作系统和版本、go tool mygo dev 还是打包后的应用、深浅色。截图和日志贴在这里。不要贴口令、token 和 API key。
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix direction
      description: 你觉得该怎么改。不知道就留空。
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 几行可检查的条件。怎么算修好了。
    validations:
      required: true
