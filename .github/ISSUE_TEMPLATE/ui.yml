name: UI
description: 界面和 design/ 画板不一致，或要调视觉和交互
title: "[ui] "
labels: ["ui"]
body:
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: 哪个界面，哪个平台，浅色还是深色。和画板差在哪。附截图。
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix direction
      description: 对照 design/ 里哪块画板。要改画板的话说明改什么。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 几行可检查的条件。
    validations:
      required: true
