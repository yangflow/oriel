# A tag vX.Y.Z builds, signs and uploads every platform to a draft release, then publishes it once all uploaded.
# The secrets belong to the environment release, which only tags v* may use (docs/release.md); a missing one stops
# the run before anything is uploaded.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan_secrets.py reads the whole history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: The tag, the version and its notes agree
        run: |
          version="$(jq -r .version mygo.json)"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -q "^## \[$version\] - " CHANGELOG.md
          jq -e '.updates.publicKey and .updates.github' mygo.json > /dev/null
      - run: scripts/check.sh --cross
      - run: python3 scripts/scan_secrets.py
      - run: go test -race ./...

  draft-release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macOS, os: macos-latest, platform: 'darwin/universal'}
          - {name: Windows, os: ubuntu-latest, platform: 'windows/amd64,windows/arm64'}
          - {name: Linux, os: ubuntu-latest, platform: 'linux/amd64,linux/arm64'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the secrets
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          required=(MYGO_UPDATER_PRIVATE_KEY)
          if [[ "$RUNNER_OS" == macOS ]]; then
            required+=(MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit "$missing"
      - name: Import the certificate and the notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"
          # Notarize only here: local builds stay signed ad hoc and are never submitted.
          jq --arg keychain "$keychain" '.macos.notarize = {keychainProfile: "notary", keychain: $keychain}' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          sign=()
          if [[ "$RUNNER_OS" == macOS ]]; then sign=(-sign "$MACOS_SIGNING_IDENTITY"); fi
          go tool mygo build -platform "${{ matrix.platform }}" "${sign[@]}" -upload
      - name: Verify the macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          app="$(find build -maxdepth 2 -name '*.app' -type d | head -n 1)"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          for dmg in build/*/*.dmg; do xcrun stapler validate "$dmg"; done

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
