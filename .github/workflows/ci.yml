name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # scan_secrets.py 扫全部历史。
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: scripts/check.sh --cross
      - run: python3 scripts/scan_secrets.py
      - run: go test -race ./...
  # 数据目录的文件锁和路径在 Windows 上走另一套代码，check.sh 只交叉编译、不运行。
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
