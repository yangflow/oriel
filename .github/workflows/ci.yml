name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # scan_secrets.py scans the whole history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Format, module, tests with the race detector and cross-compilation
        run: scripts/check.sh --cross --race
      - name: Secret scan of the history
        run: python3 scripts/scan_secrets.py
      # Pinned so a new release of the tool cannot fail CI by itself; fails the job on a vulnerability the code
      # reaches, in the standard library or in a dependency.
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  # The data directory lock and paths take a separate code path on Windows; check.sh only cross-compiles it.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
