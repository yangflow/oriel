<h1>胡同里的早点铺</h1>
<p>清晨六点，胡同口的早点铺已经排起了队，豆浆的热气混着油条的香味，老板娘一边收钱一边招呼熟客，这一段文字足够长，可以让正文提取保留它。</p>
<p>铺子开了三十多年，从最初的一口大锅到现在的四张小桌，菜单几乎没有变过，常来的人都说，味道和小时候一样，这一段同样足够长。</p>
